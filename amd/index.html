<style>
/* Layout: ľavý panel s témami, vpravo jedna veľká karta s príkladom ako list z poznámkového bloku */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ok-bg:#16382a; --bad-bg:#44212a; --soft:#222c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111620; --card:#192030; --fg:#e7ebf3; --muted:#9aa5ba; --rule:#202a3c; --line:#33415a;
  --red:#ff7f8c; --blue:#80aaff; --green:#58d28e; --amber:#f0b14a;
  --ok-bg:#16382a; --bad-bg:#44212a; --soft:#222c40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 40px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px}
.app{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:9px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--fg)}
.btn:hover{border-color:var(--blue)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}

.fb{padding:10px 14px;border-radius:9px;font-weight:500}

.sol{border-top:2px dashed var(--line);padding-top:12px}

.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--blue);background:var(--card);border-color:var(--line)}
.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.split{display:flex;flex-direction:column;gap:14px;min-width:0}
.tpane{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 20px 18px;min-width:0}
.tpane h3{font:700 2rem/1.1 var(--f-display);color:var(--red);margin:12px 0 0}
.tsec{padding-top:14px}
.tsec h4{font:700 1.45rem/1.1 var(--f-display);color:var(--green);margin:0 0 4px}
.tsec p{margin:.4em 0}.tsec ul,.tsec ol{margin:.4em 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tex{border-left:3px solid var(--blue);background:var(--soft);border-radius:0 8px 8px 0;padding:6px 12px;margin:8px 0;overflow-x:auto;max-width:100%}
.tex p{margin:.3em 0}
.app[data-view="theory"]{max-width:1320px}
.app[data-view="theory"] details.theory{display:none}
.app[data-view="theory"] .tpane{display:block}
@media (min-width:1100px){
  .app[data-view="theory"] .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:18px}
  .app[data-view="theory"] .card{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.topics{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;gap:8px}
  .tbtn{flex:0 0 auto;min-width:170px}
  .tbtn .s{display:none}
  h1{font-size:2.2rem}.card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="app" id="app" data-view="practice">
  <header class="top">
    <div>
      <h1>Cvičebnica ADM</h1>
      <p class="sub">Matice, sústavy rovníc, Gaussova eliminácia, inverzná matica a determinanty. Každý príklad je nový.</p>
    </div>
    <div class="score" id="score"></div>
  </header>
  <div class="tabs" role="tablist" aria-label="Zobrazenie"><button class="tab" role="tab" id="tab-practice" aria-selected="true" data-v="practice">Cvičenie</button><button class="tab" role="tab" id="tab-theory" aria-selected="false" data-v="theory">Teória a cvičenie vedľa seba</button></div>
  <div class="layout">
    <nav class="topics" id="nav" aria-label="Témy"></nav>
    <main>
      <details class="theory" id="theory"><summary></summary><div class="in"></div></details>
      <div class="split"><article class="tpane" id="tpane" aria-label="Teória"></article><section class="card" id="card" aria-live="off"></section></div>
    </main>
  </div>
</div>
<script>
'use strict';
/* ---------- zlomky ---------- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const F=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const add=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d),sub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d),mul=(a,b)=>F(a.n*b.n,a.d*b.d),div=(a,b)=>F(a.n*b.d,a.d*b.n),eq=(a,b)=>a.n===b.n&&a.d===b.d,isZ=a=>a.n===0,neg=a=>F(-a.n,a.d);
const fs=a=>`${a.n<0?'−':''}${Math.abs(a.n)}${a.d!==1?'/'+a.d:''}`;
const fh=a=>a.d===1?`${a.n<0?'−':''}${Math.abs(a.n)}`:`${a.n<0?'−':''}<span class="fr"><i>${Math.abs(a.n)}</i><i>${a.d}</i></span>`;
function parseF(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s+/g,'');if(s==='')return null;
  let m=s.match(/^([+-]?)(\d+)\/(\d+)$/);if(m){const d=+m[3];if(!d)return null;return F((m[1]==='-'?-1:1)*(+m[2]),d)}
  m=s.match(/^([+-]?)(\d+)(?:\.(\d+))?$/);if(m){const fr=m[3]||'';const d=Math.pow(10,fr.length);return F((m[1]==='-'?-1:1)*(+(m[2]+fr)),d)}
  return null}
/* ---------- náhoda ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const rmI=(r,c,lo,hi)=>Array.from({length:r},()=>Array.from({length:c},()=>R(lo,hi)));
const FM=A=>A.map(r=>r.map(x=>F(x)));
const flat=M=>M.flat();
const sg=n=>n<0?'−'+(-n):''+n;
const P=n=>n<0?`(−${-n})`:`${n}`;
const fk=f=>{f=typeof f==='number'?F(f):f;return(f.n<0||f.d!==1)?`(${fs(f)})`:fs(f)};
/* ---------- matice ---------- */
const mmul=(A,B)=>A.map((r,i)=>B[0].map((_,j)=>r.reduce((s,_,k)=>add(s,mul(A[i][k],B[k][j])),F(0))));
const mT=A=>A[0].map((_,j)=>A.map(r=>r[j]));
const mAdd=(A,B,s=1)=>A.map((r,i)=>r.map((x,j)=>s>0?add(x,B[i][j]):sub(x,B[i][j])));
const mSc=(c,A)=>A.map(r=>r.map(x=>mul(c,x)));
const mI=n=>Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>F(i===j?1:0)));
const mEq=(A,B)=>A.every((r,i)=>r.every((x,j)=>eq(x,B[i][j])));
function det(A){const n=A.length;const M=A.map(r=>r.slice());let d=F(1);
  for(let c=0;c<n;c++){let p=-1;for(let r=c;r<n;r++)if(!isZ(M[r][c])){p=r;break}
    if(p<0)return F(0);if(p!==c){[M[p],M[c]]=[M[c],M[p]];d=neg(d)}
    d=mul(d,M[c][c]);
    for(let r=c+1;r<n;r++){const f=div(M[r][c],M[c][c]);for(let k=c;k<n;k++)M[r][k]=sub(M[r][k],mul(f,M[c][k]))}}
  return d}
const minor=(A,i,j)=>A.filter((_,r)=>r!==i).map(r=>r.filter((_,c)=>c!==j));
const cof=(A,i,j)=>{const d=det(minor(A,i,j));return(i+j)%2?neg(d):d};
function gj(M0){const M=M0.map(r=>r.slice());const rows=M.length,cols=M[0].length;const steps=[];let r=0;
  const snap=op=>steps.push({op,M:M.map(x=>x.slice())});
  for(let c=0;c<cols&&r<rows;c++){let p=-1;for(let i=r;i<rows;i++)if(!isZ(M[i][c])){p=i;break}
    if(p<0)continue;
    if(p!==r){[M[p],M[r]]=[M[r],M[p]];snap(`R${r+1} ↔ R${p+1}`)}
    if(!eq(M[r][c],F(1))){const k=div(F(1),M[r][c]);M[r]=M[r].map(x=>mul(x,k));snap(`${fk(k)}·R${r+1}`)}
    for(let i=0;i<rows;i++){if(i===r||isZ(M[i][c]))continue;const k=neg(M[i][c]);M[i]=M[i].map((x,j)=>add(x,mul(k,M[r][j])));snap(`${fk(k)}·R${r+1} + R${i+1} → R${i+1}`)}
    r++}
  return{M,steps}}
function inv(A){const n=A.length;const aug=A.map((r,i)=>[...r,...mI(n)[i]]);const{M}=gj(aug);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(!eq(M[i][j],F(i===j?1:0)))return null;
  return M.map(r=>r.slice(n))}
/* ---------- HTML pomôcky ---------- */
const mx=(M,aug=-1,cls='')=>`<span class="mx ${cls}"><table>${M.map(r=>`<tr>${r.map((x,j)=>`<td class="${j===aug?'aug':''}">${fh(x)}</td>`).join('')}</tr>`).join('')}</table></span>`;
const lab=(n,M,aug=-1)=>`<span class="lbl">${n} =</span> ${mx(M,aug)}`;
const eqStr=(co,rhs,v=['x','y','z'])=>{let s='';co.forEach((a,i)=>{if(a===0)return;const t=(Math.abs(a)===1?'':Math.abs(a))+v[i];s+=s===''?(a<0?'−':'')+t:` ${a<0?'−':'+'} ${t}`});return(s||'0')+' = '+sg(rhs)};
const sys=(rows,v)=>`<div class="sys">${rows.map(r=>`<div>${eqStr(r.slice(0,-1),r[r.length-1],v)}</div>`).join('')}</div>`;
const stepsHtml=(init,aug,st)=>`<div class="steps"><div class="st"><span class="op">začiatok</span>${mx(init,aug)}</div>${st.map(s=>`<div class="st"><span class="op">${s.op}</span>${mx(s.M,aug)}</div>`).join('')}</div>`;
const grid=(r,c,aug=-1)=>({t:'grid',r,c,aug});
const lines=l=>({t:'lines',lines:l});
const choice=(opts,cor)=>{const o=shuf(opts);return{input:{t:'choice',opts:o},answer:[o.indexOf(cor)]}};
const addOp=(k,i,j)=>`${fk(k)}·R${i+1} + R${j+1} → R${j+1}`,scaleOp=(k,i)=>`${fk(k)}·R${i+1}`,swapOp=(i,j)=>`R${i+1} ↔ R${j+1}`;
const OP=s=>`<span class="op">${s}</span>`;
const sub_=n=>String(n).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'[+c]).join('');
const XV=n=>Array.from({length:n},(_,i)=>'x'+sub_(i+1));
const YN=['Áno','Nie'];

/* ========== 1. MATICE A OPERÁCIE ========== */
const gMat=[];
gMat.push(()=>{const r=pick([2,3]),c=pick([2,3]),s=pick([1,-1]);const A=FM(rmI(r,c,-5,9)),B=FM(rmI(r,c,-5,9));const Rm=mAdd(A,B,s);
  return{kind:s>0?'Súčet matíc':'Rozdiel matíc',prompt:`Vypočítaj.<div class="eq">${lab('A',A)} <span class="gap"></span> ${lab('B',B)}</div><div class="eq">A ${s>0?'+':'−'} B = ?</div>`,input:grid(r,c),answer:flat(Rm),
  solution:`<p>Obe matice majú rozmer ${r}×${c}, takže ich ${s>0?'sčítame':'odčítame'} prvok po prvku.</p><div class="eq">${mx(Rm)}</div>`}});
gMat.push(()=>{const r=pick([2,3]),c=pick([2,3]),k=pick([2,3,4,5,-1,-2,-3]);const A=FM(rmI(r,c,-4,6));const Rm=mSc(F(k),A);
  return{kind:'Skalárny násobok',prompt:`Vypočítaj.<div class="eq"><span class="lbl">c = ${sg(k)}</span> <span class="gap"></span> ${lab('A',A)}</div><div class="eq">c · A = ?</div>`,input:grid(r,c),answer:flat(Rm),
  solution:`<p>Každý prvok matice vynásobíme číslom ${sg(k)}.</p><div class="eq">${mx(Rm)}</div>`}});
gMat.push(()=>{const[m,rr,n]=pick([[2,2,2],[2,3,2],[2,3,3],[3,2,2],[2,2,3],[3,3,2]]);const Ai=rmI(m,rr,-3,4),Bi=rmI(rr,n,-3,4);const A=FM(Ai),B=FM(Bi);const Pm=mmul(A,B);
  const term=(i,j)=>Ai[i].map((a,k)=>`${P(a)}·${P(Bi[k][j])}`).join(' + ')+' = '+sg(Pm[i][j].n);
  const head=`<p>A je ${m}×${rr}, B je ${rr}×${n}. Vnútorné rozmery sa rovnajú, takže A·B existuje a má rozmer ${m}×${n}.</p>`;

function rrefReason(M){let last=-1,zero=false;
  for(let i=0;i<M.length;i++){const p=M[i].findIndex(x=>!isZ(x));if(p<0){zero=true;continue}
    if(zero)return`Nulový riadok je nad nenulovým riadkom ${i+1}. Nulové riadky patria na koniec.`;
    if(!eq(M[i][p],F(1)))return`Prvé nenulové číslo v riadku ${i+1} nie je 1 (je ${fs(M[i][p])}).`;
    if(p<=last)return`Pivot v riadku ${i+1} nie je vpravo od pivota z predošlého riadku, tvar nie je schodovitý.`;
    for(let k=0;k<M.length;k++)if(k!==i&&!isZ(M[k][p]))return`Nad alebo pod pivotom riadku ${i+1} je v stĺpci ${p+1} nenulové číslo (riadok ${k+1}). Mimo pivotov majú byť v ich stĺpcoch samé nuly.`;
    last=p}
  return null}

  return{M,r,pc}}

const TOPICS=[
 {id:'mat',name:'Matice a operácie',short:'súčet, súčin, transpozícia',gens:gMat,theory:`<ul>

  <li><b>Súčet a rozdiel</b> existujú len pre rovnaký rozmer, počítame prvok po prvku.</li>
  <li><b>Skalárny násobok</b> c·A: každý prvok vynásobíme c.</li>
  <li><b>Súčin</b> A·B: A je m×r, B je r×n, výsledok je m×n. Prvok (i,j) je súčet súčinov i-teho riadku A a j-teho stĺpca B.</li>
  <li><b>Transpozícia</b> Aᵀ: výmena riadkov a stĺpcov.</li>
  <li>Násobenie matíc <b>nie je komutatívne</b>, A·B ≠ B·A. Platí asociatívnosť a distributívnosť, matice sa nedajú krátiť.</li>
  <li>Lineárna kombinácia: c₁A₁ + c₂A₂ + … + cₙAₙ.</li></ul>`},
 {id:'sys',name:'Sústavy rovníc',short:'riešenia, parametre, rozšírená matica',gens:gSys,theory:`<ul>
  <li>Sústavu zapíšeme ako A·x = b, rozšírená matica je [A | b].</li>
  <li>Riešenie dosadíme do <b>všetkých</b> rovníc, vždy musí platiť ĽS = PS. Záleží na poradí čísel.</li>
  <li>Sústava má <b>jedno</b> riešenie (priamky sa pretínajú), <b>žiadne</b> (rovnobežné, vyjde nepravda 0 = 6) alebo <b>nekonečne veľa</b> (totožné, vyjde 0 = 0).</li>
  <li>Pri nekonečne veľa riešeniach jednu neznámu zvolíme ako parameter t ∈ ℝ a ostatné cez ňu vyjadríme.</li></ul>`},
 {id:'gauss',name:'Gaussova eliminácia',short:'riadkové operácie, echelónový tvar',gens:gGau,theory:`<ul>
  <li>Elementárne riadkové operácie: <b>c·Rᵢ</b> (c ≠ 0), <b>Rᵢ ↔ Rⱼ</b>, <b>c·Rᵢ + Rⱼ → Rⱼ</b>.</li>
  <li><b>Redukovaný echelónový tvar</b>: prvé nenulové číslo riadku je 1 (pivot), pivoty idú schodovito doprava, v stĺpci pivota sú inak samé nuly, nulové riadky sú dole.</li>
  <li>Riadok 0 0 0 | 1 znamená <b>žiadne riešenie</b>. Neznáme bez pivota sú <b>parametre</b>, vtedy je riešení nekonečne veľa.</li>
  <li>Gauss = dopredný postup (nuly pod pivotmi), Jordan = spätný postup (nuly nad pivotmi).</li></ul>`},
 {id:'inv',name:'Inverzná matica',short:'2×2, 3×3, elementárne matice',gens:gInv,theory:`<ul>
  <li>A je invertibilná, ak existuje B s A·B = B·A = I. Inverzná matica je len jedna.</li>
  <li><b>2×2</b>: pre A = [a b; c d] je A⁻¹ = 1/(ad−bc) · [d −b; −c a], ak ad − bc ≠ 0.</li>
  <li><b>Gaussova–Jordanova metóda</b>: [A | I] → [I | A⁻¹].</li>
  <li>(A·B)⁻¹ = B⁻¹·A⁻¹ (zmena poradia). Sústava A·x = b má riešenie x = A⁻¹·b.</li>
  <li>Elementárna matica vznikne z I jednou riadkovou operáciou. Inverzia: c·Rᵢ ↔ (1/c)·Rᵢ, c·Rᵢ + Rⱼ ↔ (−c)·Rᵢ + Rⱼ, výmena ↔ výmena.</li></ul>`},
 {id:'det',name:'Determinanty',short:'rozvoj, vlastnosti, adjungovaná',gens:gDet,theory:`<ul>
  <li>2×2: det A = a·d − b·c. 3×3: Sarrusovo pravidlo alebo rozvoj podľa riadku či stĺpca.</li>
  <li><b>Minor</b> M<sub>ij</sub>: determinant po vynechaní i-teho riadku a j-teho stĺpca. <b>Kofaktor</b> C<sub>ij</sub> = (−1)<sup>i+j</sup>·M<sub>ij</sub>.</li>
  <li>Rozvoj: det A = a<sub>i1</sub>C<sub>i1</sub> + … + a<sub>in</sub>C<sub>in</sub>. Najlepšie rozvíjať podľa riadku alebo stĺpca s nulami.</li>
  <li>Trojuholníková a diagonálna matica: det = súčin prvkov na diagonále.</li>
  <li>Výmena riadkov: det ×(−1). Vynásobenie riadku k: det ×k. Pripočítanie násobku riadku: det sa nemení.</li>
  <li>det(A·B) = det A · det B, det(A⁻¹) = 1/det A. A je invertibilná ⇔ det A ≠ 0.</li>
  <li>adj(A) je transponovaná matica kofaktorov, A⁻¹ = 1/det(A) · adj(A).</li></ul>`}
];

const KEY='adm-cvicebnica-v1';

function renderNav(){
  const all=Object.values(ST.stats).reduce((a,s)=>({ok:a.ok+s.ok,total:a.total+s.total}),{ok:0,total:0});
  const btn=(id,name,short,st)=>`<button class="tbtn" data-id="${id}" aria-pressed="${S.topic===id}"><span class="n"><span>${name}</span><em>${st.ok}/${st.total}</em></span><span class="s">${short}</span><div class="bar"><i style="width:${st.total?Math.round(100*st.ok/st.total):0}%"></i></div></button>`;
  $('#nav').innerHTML=(S.view==='theory'?'':btn('mix','Všetko dokopy','náhodná téma',all))+TOPICS.map(t=>btn(t.id,t.name,t.short,tstat(t.id))).join('')+`<button class="reset" id="reset">Vynulovať štatistiku</button>`;
  $('#nav').querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{S.topic=b.dataset.id;renderTheory();if(S.view==='theory')window.scrollTo({top:0});next()});
  $('#reset').onclick=()=>{ST={stats:{},streak:0,best:0};save();renderNav();renderScore()};

function renderScore(){
  const all=Object.values(ST.stats).reduce((a,s)=>({ok:a.ok+s.ok,total:a.total+s.total}),{ok:0,total:0});

  for(let k=0;k<6&&!q;k++){try{t=pick(pool);q=pick(t.gens)()}catch(e){q=null}}
  S={...S,q,qt:t,sel:null,counted:false,done:false,shown:false};
  renderNav();renderCard();

  c.innerHTML=`<div class="meta"><span class="chip">${q.kind}</span><span>${S.qt.name}</span></div>
   <div class="prompt">${q.prompt}</div>${inputsHtml(q.input)}
   ${q.input.t!=='choice'?'<div class="muted">Celé čísla alebo zlomky, napríklad <kbd>−3</kbd> alebo <kbd>2/7</kbd>. Enter skočí na ďalšie pole.</div>':''}
   <div id="fb" role="status" aria-live="polite"></div>
   <div class="actions"><button class="btn main" id="chk">Skontrolovať</button><button class="btn" id="shw">Ukáž riešenie</button><button class="btn" id="nx">Ďalší príklad</button></div>
   <div id="sol" class="sol" hidden></div>`;
  $('#chk').onclick=check;$('#shw').onclick=reveal;$('#nx').onclick=next;

function fb(cls,txt){$('#fb').innerHTML=`<div class="fb ${cls}">${txt}</div>`}
function record(ok){
  const s=tstat(S.qt.id);s.total++;if(ok){s.ok++;ST.streak++;ST.best=Math.max(ST.best,ST.streak)}else ST.streak=0;
  S.counted=true;save();renderNav()}
function check(){
  if(S.done||S.shown)return;
  const q=S.q;let ok=false,hit=0,total=q.answer.length;
  if(q.input.t==='choice'){
    if(S.sel==null){fb('warn','Vyber jednu možnosť.');return}
    ok=S.sel===q.answer[0];
    $('#card').querySelectorAll('.opt').forEach((o,i)=>{if(i===S.sel)o.classList.add(ok?'ok':'bad')})}
  else{
    const ins=[...$('#card').querySelectorAll('input.cell')];const vals=ins.map(i=>parseF(i.value));
    if(vals.some(v=>v===null)){fb('warn','Vyplň všetky polia číslom alebo zlomkom, napríklad −3 alebo 2/7.');return}
    vals.forEach((v,i)=>{const g=eq(v,q.answer[i]);ins[i].classList.toggle('ok',g);ins[i].classList.toggle('bad',!g);if(g)hit++});
    ok=hit===total}
  if(!S.counted)record(ok);
  if(ok){S.done=true;fb('ok','Správne.'+(S.counted?'':''));lockInputs();showSol(false);$('#chk').disabled=true;$('#nx').classList.add('main');$('#chk').classList.remove('main');$('#nx').focus({preventScroll:true})}
  else fb('bad',q.input.t==='choice'?'Zatiaľ nie. Skús inú možnosť alebo si zobraz riešenie.':`Správne ${hit} z ${total} polí. Červené polia oprav alebo si zobraz riešenie.`)}
function lockInputs(){$('#card').querySelectorAll('input.cell').forEach(i=>i.readOnly=true);$('#card').querySelectorAll('.opt').forEach(o=>o.disabled=true)}
function showSol(open){const s=$('#sol');s.hidden=false;s.innerHTML=`<h3>Postup</h3>${S.q.solution}`;if(open)s.scrollIntoView({block:'nearest',behavior:'smooth'})}
function reveal(){
  if(!S.counted)record(false);
  S.shown=true;
  if(S.q.input.t==='choice')$('#card').querySelectorAll('.opt').forEach((o,i)=>{o.disabled=true;if(i===S.q.answer[0])o.classList.add('ok')});
  else{const ins=[...$('#card').querySelectorAll('input.cell')];ins.forEach((el,i)=>{el.value=fs(S.q.answer[i]);el.classList.add('ok');el.readOnly=true})}
  if(!S.done)fb('warn','Riešenie je zobrazené, tento príklad sa počíta ako nesprávny.');
  $('#chk').disabled=true;showSol(true)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(S.done||S.shown)&&e.target===document.body)next()});
renderTheory();next();
</script>

</body></html>
