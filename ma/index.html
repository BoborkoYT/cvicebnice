/* ===== Témy 7 a 8: Taylorov polynóm, l'Hospitalovo pravidlo, priebeh funkcie ===== */
const SUP=['⁰','¹','²','³','⁴','⁵','⁶','⁷'];
const fact=n=>n<=1?1:n*fact(n-1);
const strip_=h=>h.replace(/<[^>]+>/g,'');
function polyLines(label,n,x0){ // M_n(x) = [ ] + [ ]·x + ...
  const arr=[label];
  for(let k=0;k<=n;k++){
    if(k>0)arr.push(' + ');
    arr.push(null);
    if(k>0)arr.push(x0===0?`·x${k>1?SUP[k]:''}`:`·(x ${x0<0?'+':'−'} ${Math.abs(x0)})${k>1?SUP[k]:''}`);
  }
  return[arr]}
function derivTable(f,x0,n,withExpr=true){
  const rows=[];
  for(let k=0;k<=n;k++){const dk=Dn(f,k);const v=ev(dk,x0);const ck=v/fact(k);
    const ex=strip_(H(dk)).length<60&&withExpr?H(dk):'…';
    rows.push([k,ex,fv(v),`${fv(v)}/${fact(k)} = <b>${fv(ck)}</b>`])}
  return tblh(['k','f<sup>(k)</sup>(x)',`f<sup>(k)</sup>(${nn(x0)})`,'koeficient f<sup>(k)</sup>/k!'],rows)}
function taylorCoefs(f,x0,n){const c=[];for(let k=0;k<=n;k++)c.push(ev(Dn(f,k),x0)/fact(k));return c}
const polyShow=(c,x0)=>{let h='';c.forEach((v,k)=>{if(Math.abs(v)<1e-12)return;const t=k===0?fv(Math.abs(v)):(Math.abs(v)===1?'':fv(Math.abs(v)))+(x0===0?(k===1?'x':`x<sup>${k}</sup>`):(k===1?`(x ${x0<0?'+':'−'} ${Math.abs(x0)})`:`(x ${x0<0?'+':'−'} ${Math.abs(x0)})<sup>${k}</sup>`));
  h+=h===''?(v<0?'−':'')+t:(v<0?' − ':' + ')+t});return h||'0'};

function gMaclaurin(){
  const a=rnd(2,3);
  const L=[[`e^(${a}*x)`,3],['e^(-x)',4],['sin(x)',3],['sin(x)',5],[`sin(${a}*x)`,3],['cos(x)',4],[`cos(${a}*x)`,4],['ln(1+x)',4],['1/(1-x)',4],['1/(1+x)',3],['sqrt(1+x)',3],['arctg(x)',3],['sinh(x)',3],['cosh(x)',4],['tg(x)',3],['x*e^x',3],['e^x*cos(x)',3],['ln(1-x)',3],['1/(1+x^2)',4],['(1+x)^3',3]];
  const [s,n]=pick(L);const f=P(s);const c=taylorCoefs(f,0,n);
  if(c.some(v=>!rat(v,5040)))return null;
  return{kind:'MacLaurinov polynóm',prompt:p_(`Rozvíj funkciu ${FX(f)} do MacLaurinovho polynómu ${n}. stupňa M<sub>${n}</sub>(x). Zapíš koeficienty polynómu.`),
    input:{t:'lines',lines:polyLines(`M${String.fromCharCode(8320+n)}(x) = `,n,0)},answer:c,
    solution:p_(`MacLaurinov polynóm je Taylorov polynóm so stredom 0: M<sub>n</sub>(x) = Σ f<sup>(k)</sup>(0)/k! · x<sup>k</sup>. Postupne derivujeme a dosadíme x = 0:`)+derivTable(f,0,n)+p_(`M<sub>${n}</sub>(x) = <b>${polyShow(c,0)}</b>`)}}

function gTaylor(){
  const L=[['ln(x)',1,3],['1/x',1,3],['1/x',2,2],['sqrt(x)',4,2],['sqrt(x)',1,3],['x*ln(x)',1,4],['x^3-2*x',1,3],['x^4-x',2,3],['1/(x+1)',1,2],['sqrt(x+1)',3,2],['1/x^2',1,3],['x^3',-1,3],['x*ln(x)',1,3],['ln(x)',1,4],['sqrt(x)',9,2],['1/(2-x)',1,3]];

  return{kind:'Taylorov polynóm v bode',prompt:p_(`Nájdi Taylorov polynóm ${n}. stupňa T<sub>${n}</sub>(x) funkcie ${FX(f)} so stredom x₀ = ${nn(x0)}. Zapíš koeficienty pri mocninách (x ${x0<0?'+':'−'} ${Math.abs(x0)}).`),

function gTaylorApprox(){
  const L=[['ln(x)',1,2,1.3,'ln 1,3'],['ln(x)',1,2,0.9,'ln 0,9'],['sqrt(x)',1,2,1.1,'√1,1'],['sqrt(x)',4,2,4.2,'√4,2'],['e^x',0,3,0.2,'e<sup>0,2</sup>'],['sin(x)',0,3,0.5,'sin 0,5'],['cos(x)',0,4,0.4,'cos 0,4'],['1/x',1,3,1.1,'1/1,1'],['ln(x)',1,3,1.1,'ln 1,1'],['arctg(x)',0,3,0.2,'arctg 0,2'],['e^(-x)',0,3,0.1,'e<sup>−0,1</sup>'],['sqrt(x)',9,2,9.3,'√9,3'],['ln(x)',1,2,0.8,'ln 0,8']];

function gLHop(){
  const a=rnd(2,4),b=rnd(2,4);
  const A_=[
    [`e^(${a}*x)-1`,`${b}*x`],[`x-sin(x)`,'x^3'],[`1-cos(${a}*x)`,'x^2'],['tg(x)-x','x^3'],['e^x-1-x','x^2'],['sin(x)-x*cos(x)','x^3'],['ln(1+x)-x','x^2'],['arctg(x)-x','x^3'],
    ['e^x-e^(-x)-2*x','x^3'],['cos(x)-1+x^2/2','x^4'],['e^x-1-x-x^2/2','x^3'],[`${a}*x-sin(${a}*x)`,'x^3'],[`sin(${a}*x)`,`ln(1+${b}*x)`],['1-cos(x)','x*sin(x)'],['x-ln(1+x)','x^2'],[`e^(${a}*x)-1-${a}*x`,'x^2'],['sin(x)-x','x^3']];
  if(Math.random()<0.6){
    const [ns,ds]=pick(A_);const Nn=P(ns),Dd=P(ds);let k=1,ans=null;
    for(;k<=5;k++){const nk=ev(Dn(Nn,k),0),dk=ev(Dn(Dd,k),0);
      const nl=ev(Dn(Nn,k-1),0),dl=ev(Dn(Dd,k-1),0);if(Math.abs(nl)>1e-9||Math.abs(dl)>1e-9){return null}
      if(Math.abs(dk)>1e-9){ans=nk/dk;break}}
    if(ans===null||!rat(ans))return null;
    let st='';for(let j=1;j<=k;j++){const nj=Dn(Nn,j),dj=Dn(Dd,j);const vn=ev(nj,0),vd=ev(dj,0);
      st+=eqh(`<span class="m">${j===1?'':'= '}${L2('x→0',frac(H(nj),H(dj)))}</span> <span class="muted">${Math.abs(vd)>1e-9?`dosadením: ${fv(vn)}/${fv(vd)}`:'opäť 0/0'}</span>`)}
    return{kind:"L'Hospitalovo pravidlo",prompt:p_(`Vypočítaj: ${L2('x→0',MQ(div(Nn,Dd)))}`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[ans],verify:()=>near(ev(div(Nn,Dd),0.04),ans,0.1),
      solution:p_('Dosadením x = 0 dostaneme 0/0, preto môžeme použiť l′Hospitalovo pravidlo: derivujeme čitateľa a menovateľa <b>osobitne</b> (nie ako podiel).')+st+p_(`Výsledok: <b>${fv(ans)}</b>.`)}}
  const n=rnd(2,4),k=rnd(1,2);
  const M=[
    ()=>({p:L2('x→∞',MQ(div(pow(X,N(n)),pow(E,X)))),ans:0,w:`Typ ∞/∞. Pravidlo použijeme ${n}-krát: x<sup>${n}</sup>/eˣ → ${n}x<sup>${n-1}</sup>/eˣ → … → ${fact(n)}/eˣ → 0.`}),
    ()=>({p:L2('x→∞',MQ(div(fn('ln',X),pow(X,N(k))))),ans:0,w:`Typ ∞/∞. Derivovaním: (1/x)/(${k===1?'1':k+'x<sup>'+(k-1)+'</sup>'}) = 1/(${k===1?'':k}x<sup>${k}</sup>) → 0.`}),
    ()=>({p:L2('x→0⁺',MQ(mul(X,fn('ln',X)))),ans:0,w:'Typ 0·(−∞). Prepíšeme na podiel: x ln x = ln x/(1/x), čo je typ −∞/∞. Potom (1/x)/(−1/x²) = −x → 0.'}),
    ()=>({p:L2('x→0⁺',MQ(mul(pow(X,N(2)),fn('ln',X)))),ans:0,w:'Typ 0·(−∞). Prepíšeme x² ln x = ln x/(1/x²). Potom (1/x)/(−2/x³) = −x²/2 → 0.'}),
    ()=>({p:L2('x→∞',MQ(pow(X,div(N(1),X)))),ans:1,w:'Typ ∞⁰. Logaritmovaním: ln y = (ln x)/x, a podľa l′Hospitala (1/x)/1 → 0. Preto y → e⁰ = 1.'}),
    ()=>({p:L2('x→0⁺',MQ(pow(X,X))),ans:1,w:'Typ 0⁰. ln y = x ln x → 0 (viď x ln x), preto y → e⁰ = 1.'}),
    ()=>({p:L2('x→0',MQ(pow(add(N(1),mul(N(a),X)),div(N(1),X)))),ans:A(Math.exp(a),`e<sup>${a}</sup>`,`e^${a}`),av:Math.exp(a),w:`Typ 1<sup>∞</sup>. ln y = ln(1 + ${a}x)/x je typ 0/0, a (${a}/(1 + ${a}x))/1 → ${a}. Preto y → e<sup>${a}</sup>.`}),
    ()=>({p:L2('x→0',MQ(pow(fn('cos',X),div(N(1),pow(X,N(2)))))),ans:A(Math.exp(-0.5),'e<sup>−1/2</sup>','e^(-1/2)'),av:Math.exp(-0.5),w:'Typ 1<sup>∞</sup>. ln y = ln(cos x)/x², typ 0/0. Derivovaním: (−tg x)/(2x) → −1/2, preto y → e<sup>−1/2</sup>.'}),
    ()=>({p:L2('x→∞',MQ(mul(X,pow(E,neg(X))))),ans:0,w:'Typ ∞·0. Prepíšeme x·e<sup>−x</sup> = x/eˣ (typ ∞/∞) a použijeme pravidlo: 1/eˣ → 0.'})];
  const t=pick(M)();
  return{kind:"L'Hospitalovo pravidlo",prompt:p_(`Vypočítaj: ${t.p}`)+p_('<span class="muted">Výsledok napíš číslom, alebo ako mocninu e (napr. <kbd>e^2</kbd>).</span>'),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[t.ans],
    solution:p_(t.w)+p_(`Výsledok: <b>${ahtml(t.ans)}</b>.`)}}

const concTay=conc('Teória: Taylor a l′Hospital',[

  {q:'Pre x blízke 0 platí sin x ≈',o:['x','1','x²','1 − x'],s:p_('M<sub>1</sub>(x) pre sin x je x, presnejšie M<sub>3</sub>(x) = x − x³/6.')},
  {q:'Lagrangeov tvar zvyšku R<sub>n</sub>(x) obsahuje:',o:['(n+1)-vú deriváciu v nejakom bode ξ medzi x₀ a x','n-tú deriváciu v bode x₀','druhú deriváciu v bode x','iba hodnotu f(x₀)'],s:p_('R<sub>n</sub>(x) = f<sup>(n+1)</sup>(ξ)/(n+1)! · (x − x₀)<sup>n+1</sup>. Určuje chybu aproximácie.')}
]);

/* ======================================================================
   8. PRIEBEH FUNKCIE

const LAST={};
function cubic(){
  let s1,s2;do{s1=rnd(-4,3);s2=rnd(-3,4)}while(s2<=s1||s2-s1>5);
  const k=pick([6,-6]);const c=rnd(-5,5);
  const co=[k/3,-(k/2)*(s1+s2),k*s1*s2,c];
  const o={co,s1,s2,k,c,f:polyAst(co),F:x=>polyEv(co,x)};LAST.cu=o;return o}
const ARR={u:'↗',d:'↘'};
function signTable(cu){ // tabuľka znamienka f′ pre kubickú funkciu
  const {s1,s2,k}=cu;const a=k>0?['+','−','+']:['−','+','−'];const ar=k>0?['↗','↘','↗']:['↘','↗','↘'];
  return tblh(['x',`(−∞, ${nn(s1)})`,nn(s1),`(${nn(s1)}, ${nn(s2)})`,nn(s2),`(${nn(s2)}, ∞)`],[['f′(x)',a[0],'0',a[1],'0',a[2]],['f(x)',ar[0],'',ar[1],'',ar[2]]])}
function cubPlot(cu,pts){const lo=cu.s1-2,hi=cu.s2+2;return`<div class="plotw">${plot({fns:[{f:cu.F,cls:'c1'}],xr:[lo,hi],pts,label:'graf funkcie'})}</div>`}

function gMonoRows(){
  const cu=cubic();const {s1,s2,k}=cu;
  const d=[k>0?0:1,k>0?1:0,k>0?0:1];const labs=[`(−∞, ${nn(s1)})`,`(${nn(s1)}, ${nn(s2)})`,`(${nn(s2)}, ∞)`];
  const f=cu.f;
  return{kind:'Monotónnosť funkcie',prompt:p_(`Vyšetri monotónnosť funkcie ${FX(f)}. Pre každý interval vyber, či funkcia rastie alebo klesá.`),
    input:{t:'rows',rows:labs.map(l=>({label:`na intervale <span class="m">${l}</span>`,opts:['rastie','klesá']}))},answer:d,
    solution:p_(`f′(x) = ${MQ(polyAst([k,-k*(s1+s2),k*s1*s2]))} = ${MQ(mul(N(k),mul(xm(s1),xm(s2))))}. Stacionárne body: x = ${nn(s1)} a x = ${nn(s2)}.`)+signTable(cu)+p_(`Funkcia ${d.map((v,i)=>`${v===0?'rastie':'klesá'} na ${labs[i]}`).join(', ')}.`)+cubPlot(cu,[{x:s1,y:cu.F(s1)},{x:s2,y:cu.F(s2)}])}}

function gLocalExt(){
  const cu=cubic();const {s1,s2,k}=cu;const mx=k>0?s1:s2,mn=k>0?s2:s1;
  return{kind:'Lokálne extrémy',prompt:p_(`Nájdi lokálne extrémy funkcie ${FX(cu.f)}. Zapíš súradnice bodu lokálneho maxima a lokálneho minima.`),
    input:{t:'lines',lines:[['lokálne maximum: x = ',null,'  f(x) = ',null],['lokálne minimum: x = ',null,'  f(x) = ',null]]},answer:[mx,cu.F(mx),mn,cu.F(mn)],
    solution:p_(`f′(x) = ${MQ(mul(N(k),mul(xm(s1),xm(s2))))}, stacionárne body ${nn(s1)} a ${nn(s2)}.`)+signTable(cu)+p_(`V bode ${nn(mx)} sa znamienko f′ mení z + na −, takže tam je lokálne maximum, f(${nn(mx)}) = <b>${nn(cu.F(mx))}</b>.`)+p_(`V bode ${nn(mn)} sa mení z − na +, čo je lokálne minimum, f(${nn(mn)}) = <b>${nn(cu.F(mn))}</b>.`)+

function gInflection(){
  const cu=cubic();const {s1,s2,k}=cu;const xi=(s1+s2)/2;const yi=cu.F(xi);
  const d=[k>0?1:0,k>0?0:1];const labs=[`(−∞, ${fv(xi)})`,`(${fv(xi)}, ∞)`];
  if(Math.random()<0.5)return{kind:'Inflexný bod',prompt:p_(`Nájdi inflexný bod grafu funkcie ${FX(cu.f)}.`),input:{t:'lines',lines:[['x = ',null,'  f(x) = ',null]]},answer:[xi,yi],
    solution:p_(`f′(x) = ${MQ(polyAst([k,-k*(s1+s2),k*s1*s2]))}, f″(x) = ${MQ(polyAst([2*k,-k*(s1+s2)]))}.`)+p_(`f″(x) = 0 pre x = ${fv(xi)}. Druhá derivácia tu mení znamienko, preto ide o inflexný bod.`)+p_(`f(${fv(xi)}) = ${fv(yi)}. Inflexný bod: <b>I = [${fv(xi)}; ${fv(yi)}]</b>.`)+cubPlot(cu,[{x:xi,y:yi,l:'I'}])};

      p_(`Ak f″ > 0, funkcia je konvexná, ak f″ < 0, je konkávna. Funkcia je ${d.map((v,i)=>`${v===0?'konvexná':'konkávna'} na ${labs[i]}`).join(', ')}.`)}}

function gGlobal(){
  const cu=cubic();const {s1,s2}=cu;
  let A_,B_;do{A_=s1-rnd(-1,3);B_=s2+rnd(-1,3)}while(B_-A_<2||B_-A_>8);
  const cand=[A_,B_,...[s1,s2].filter(s=>s>A_&&s<B_)];const vals=cand.map(x=>cu.F(x));const mx=Math.max(...vals),mn=Math.min(...vals);

    input:{t:'lines',lines:[['maximum: ',null,'  minimum: ',null]]},answer:[mx,mn],
    solution:p_(`Spojitá funkcia na uzavretom intervale nadobúda maximum aj minimum. Porovnáme hodnoty v krajných bodoch a v stacionárnych bodoch ležiacich vnútri intervalu.`)+p_(`f′(x) = ${MQ(mul(N(cu.k),mul(xm(s1),xm(s2))))}, stacionárne body ${nn(s1)} a ${nn(s2)}${[s1,s2].some(s=>s<=A_||s>=B_)?' (do intervalu patria len '+ (cand.length>2?[s1,s2].filter(s=>s>A_&&s<B_).map(nn).join(', '):'žiadne')+')':''}.`)+tab+p_(`Maximum: <b>${nn(mx)}</b>, minimum: <b>${nn(mn)}</b>.`)+cubPlot({...cu,s1:A_,s2:B_},cand.map(x=>({x,y:cu.F(x)})))}}

function gSpecExt(){
  const v=pick([1,2,3,4,5]);
  if(v===1){const a=pick([1,2,3]);const f=mul(X,pow(E,mul(N(-a),X)));const x0=1/a,y0=1/(a*Math.E);

      solution:p_(`f′(x) = (1 − ${a}x)·e<sup>−${a}x</sup>. Keďže e<sup>−${a}x</sup> > 0, znamienko určuje 1 − ${a}x.`)+tblh(['x',`(−∞, ${fv(x0)})`,fv(x0),`(${fv(x0)}, ∞)`],[['f′(x)','+','0','−'],['f(x)','↗','max','↘']])+p_(`Lokálne maximum: x = ${fv(x0)}, f(${fv(x0)}) = <b>1/(${a}e)</b> ≈ ${dec(y0,4)}.`)}}
  if(v===2){const m=pick([4,9,16]);const r=Math.sqrt(m);const f=add(X,div(N(m),X));
    LAST.f=f;return{kind:'Lokálne extrémy',prompt:p_(`Nájdi lokálne extrémy funkcie ${FX(f)} (D(f) = ℝ ∖ {0}).`),input:{t:'lines',lines:[['lokálne maximum: x = ',null,'  f(x) = ',null],['lokálne minimum: x = ',null,'  f(x) = ',null]]},answer:[-r,-2*r,r,2*r],
      solution:p_(`f′(x) = 1 − ${m}/x² = (x² − ${m})/x², stacionárne body x = ±${r}.`)+tblh(['x',`(−∞, ${-r})`,nn(-r),`(${-r}, 0)`,'0',`(0, ${r})`,nn(r),`(${r}, ∞)`],[['f′(x)','+','0','−','nedef.','−','0','+'],['f(x)','↗','max','↘','','↘','min','↗']])+p_(`Maximum: [${-r}; ${-2*r}], minimum: [${r}; ${2*r}]. Bod 0 nepatrí do D(f), ale rozdeľuje intervaly.`)}}
  if(v===3){const m=pick([1,2,3,4]);const f=add(fn('ln',X),div(N(m),X));
    LAST.f=f;return{kind:'Lokálne extrémy',prompt:p_(`Nájdi lokálny extrém funkcie ${FX(f)} na D(f) = (0, ∞).`),input:{t:'lines',lines:[['x = ',null,'  f(x) = ',null]]},answer:[m,A(Math.log(m)+1,m===1?'1':`ln ${m} + 1`,m===1?'1':`ln(${m})+1`)],
      solution:p_(`f′(x) = 1/x − ${m}/x² = (x − ${m})/x². Menovateľ je kladný, čitateľ mení znamienko z − na + v x = ${m}.`)+p_(`Funkcia klesá na (0, ${m}) a rastie na (${m}, ∞), preto má v bode ${m} lokálne minimum f(${m}) = <b>${m===1?'1':`ln ${m} + 1`}</b> ≈ ${dec(Math.log(m)+1,4)}.`)}}
  if(v===4){const f=mul(pow(X,N(2)),pow(E,neg(X)));
    LAST.f=f;return{kind:'Lokálne extrémy',prompt:p_(`Nájdi lokálne extrémy funkcie ${FX(f)}.`),input:{t:'lines',lines:[['lokálne minimum: x = ',null,'  f(x) = ',null],['lokálne maximum: x = ',null,'  f(x) = ',null]]},answer:[0,0,2,A(4/Math.E/Math.E,'4/e²','4/e^2')],
      solution:p_('f′(x) = (2x − x²)e<sup>−x</sup> = x(2 − x)e<sup>−x</sup>. Znamienko určuje x(2 − x), lebo e<sup>−x</sup> > 0.')+tblh(['x','(−∞, 0)','0','(0, 2)','2','(2, ∞)'],[['f′(x)','−','0','+','0','−'],['f(x)','↘','min','↗','max','↘']])+p_('Minimum: [0; 0], maximum: [2; 4/e²] ≈ [2; 0,541].')}}
  const a=pick([2,8,18]);const x0=1/Math.sqrt(2*a);const val=a*x0*x0-Math.log(x0);const f=sub(mul(N(a),pow(X,N(2))),fn('ln',X));
  const inv=Math.round(1/x0);
  LAST.f=f;return{kind:'Lokálne extrémy',prompt:p_(`Nájdi lokálny extrém funkcie ${FX(f)} na D(f) = (0, ∞).`),input:{t:'lines',lines:[['x = ',null,'  f(x) = ',null]]},answer:[x0,A(val,`${fv(a*x0*x0)} + ln ${inv}`,`${a*x0*x0}+ln(${inv})`)],
    solution:p_(`f′(x) = ${2*a}x − 1/x = (${2*a}x² − 1)/x. Nulový bod v D(f): x = 1/${inv}.`)+p_(`Funkcia klesá na (0, ${fv(x0)}) a rastie na (${fv(x0)}, ∞), preto je tam lokálne (aj globálne) minimum.`)+p_(`f(${fv(x0)}) = ${fv(a*x0*x0)} − ln ${fv(x0)} = <b>${fv(a*x0*x0)} + ln ${inv}</b> ≈ ${dec(val,4)}.`)}}

function gSaddle(){
  const n=pick([2,3,4,5,6]),c=pick([1,-1,2,-2]),s=pick([0,0,1,-1,2]),d=rnd(-2,3);
  const f=add(mul(N(c),pow(xm(s),N(n))),N(d));

function gQuartic(){
  let s1,s2;do{s1=rnd(-3,2);s2=rnd(-2,4)}while(s2<=s1||s2-s1>5);
  const co=[1,-2*(s1+s2),6*s1*s2,0,0];const f=polyAst(co);const d=[0,1,0];const labs=[`(−∞, ${nn(s1)})`,`(${nn(s1)}, ${nn(s2)})`,`(${nn(s2)}, ∞)`];
  return{kind:'Konvexnosť a konkávnosť',prompt:p_(`Vyšetri konvexnosť funkcie ${FX(f)}. Pre každý interval vyber, či je funkcia konvexná alebo konkávna.`),
    input:{t:'rows',rows:labs.map(l=>({label:`na intervale <span class="m">${l}</span>`,opts:['konvexná','konkávna']}))},answer:d,

      tblh(['x',`(−∞, ${nn(s1)})`,nn(s1),`(${nn(s1)}, ${nn(s2)})`,nn(s2),`(${nn(s2)}, ∞)`],[['f″(x)','+','0','−','0','+'],['f(x)','konvexná','inflexia','konkávna','inflexia','konvexná']])+

function gStudy(){
  const a=pick([3,6,-3,-6]);
  const F=x=>x*x*x-a*x*x;const xc=2*a/3;const ymaxmin=-4*a*a*a/27;
  const maxPt=a>0?[0,0]:[xc,ymaxmin],minPt=a>0?[xc,ymaxmin]:[0,0];
  const zeros=[0,a].sort((p,q)=>p-q);
  const ff=sub(pow(X,N(3)),mul(N(a),pow(X,N(2))));LAST.f=ff;
  const pl=plot({fns:[{f:F,cls:'c1'}],xr:[Math.min(0,a)-1.5,Math.max(0,a)+1.5],pts:[{x:maxPt[0],y:maxPt[1],l:'max'},{x:minPt[0],y:minPt[1],l:'min'},{x:a/3,y:F(a/3),l:'I'}],label:'graf funkcie'});
  return{kind:'Súhrnné vyšetrenie priebehu',prompt:p_(`Vyšetri priebeh funkcie ${FX(ff)}: zapíš nulové body, súradnice lokálneho maxima a minima a x-ovú súradnicu inflexného bodu.`),
    input:{t:'lines',lines:[['nulové body: ',{m:'set'}],['lokálne maximum: x = ',null,'  y = ',null],['lokálne minimum: x = ',null,'  y = ',null],['inflexný bod: x = ',null]]},answer:[zeros,maxPt[0],maxPt[1],minPt[0],minPt[1],a/3],
    solution:p_(`D(f) = ℝ. Nulové body: x²(x ${a>0?'−':'+'} ${Math.abs(a)}) = 0, teda x = 0 (dvojnásobný) a x = ${nn(a)}.`)+
      p_(`f′(x) = 3x² − ${nn(2*a)}x = x(3x − ${nn(2*a)}), stacionárne body 0 a ${fv(xc)}.`)+p_(`f″(x) = 6x − ${nn(2*a)}. f″(0) = ${nn(-2*a)} ${a>0?'< 0':'> 0'}, preto v 0 je lokálne ${a>0?'maximum':'minimum'}; f″(${fv(xc)}) = ${nn(2*a)} ${a>0?'> 0':'< 0'}, preto tam je lokálne ${a>0?'minimum':'maximum'} s hodnotou ${fv(ymaxmin)}.`)+
      p_(`f″(x) = 0 pre x = ${fv(a/3)}, druhá derivácia tu mení znamienko, takže tam je inflexný bod [${fv(a/3)}; ${fv(F(a/3))}].`)+`<div class="plotw">${pl}</div>`}}

THEORY.fun={

    ul(['<b>Definičný obor</b> D(f): všetky x, pre ktoré je funkcia definovaná. Ak nie je uvedené inak, je to najväčšia možná množina reálnych čísel.','<b>Obor hodnôt</b> H(f): všetky hodnoty y, ktoré funkcia skutočne nadobúda.','Funkciu možno zadať vzorcom, tabuľkou, po častiach (napr. |x|, sgn x), parametricky alebo implicitne.'])+

  tsec('Zložená funkcia',p_('Ak H(g) ⊆ D(f), definujeme (f ∘ g)(x) = f(g(x)). Funkcia f je vonkajšia, g vnútorná zložka.')+tex(p_(`g(x) = √x, f(x) = sin x: ${m_('(f ∘ g)(x) = sin √x')}, ale ${m_('(g ∘ f)(x) = √(sin x)')}. Poradie záleží na tom.`))+p_('<span class="muted">Pozor: niektorí autori definujú zloženie opačne, preto treba vždy skontrolovať definíciu.</span>'))+

 full:
  tsec('Čo je limita',p_('Limita opisuje, kam smerujú hodnoty f(x), keď sa x približuje k a. Skúmame x blízke a, nie samotné x = a. Preto môže limita existovať aj tam, kde funkcia nie je definovaná:')+
   tex(p_(`${m_(`${frac('x² − 4','x − 2')} = x + 2`)} pre x ≠ 2, preto ${m_(`lim<sub>x→2</sub> ${frac('x² − 4','x − 2')} = 4`)}.`))+
   p_('<b>Jednostranné limity</b> lim<sub>x→a⁻</sub> a lim<sub>x→a⁺</sub>. Obojstranná limita existuje práve vtedy, keď sa obe rovnajú. Napríklad pre sgn x sú jednostranné limity v 0 rovné −1 a 1, takže limita neexistuje.')+
   p_('<b>Presná definícia (ε–δ):</b> lim f(x) = L ⇔ ∀ε > 0 ∃δ > 0: 0 < |x − a| < δ ⇒ |f(x) − L| < ε. ε určuje cieľ (pás okolo L), δ okolie bodu a.')+
   tex(p_(`lim<sub>x→2</sub>(3x + 1) = 7: |(3x + 1) − 7| = 3|x − 2| < ε, stačí δ = ε/3.`)))+
  tsec('Spojitosť',p_('Funkcia f je spojitá v bode a ∈ D(f), ak lim<sub>x→a</sub> f(x) = f(a). To znamená tri veci: f(a) existuje, limita existuje a obe hodnoty sa rovnajú. Funkcia je spojitá, ak je spojitá v každom bode definičného oboru (napr. 1/x je spojitá, hoci sa graf nedá nakresliť jedným ťahom).')+
   ul(['Súčet, rozdiel, súčin, podiel (g(a) ≠ 0) a zloženie spojitých funkcií je spojité.','Inverzná funkcia k spojitej rýdzo monotónnej funkcii je spojitá.','Na ⟨a, b⟩ je spojitá funkcia ohraničená a nadobúda minimum aj maximum (Weierstrass).','<b>Veta o prekročení rieky:</b> ak f spojitá na ⟨a, b⟩ a f(a)·f(b) < 0, existuje c ∈ (a, b), f(c) = 0 (základ metódy polovičného delenia).']))+
  tsec('Ako počítať limity',ul(['<b>Spojitá funkcia</b>: stačí dosadiť.','<b>0/0 s polynómami</b>: rozložiť a skrátiť spoločný činiteľ.','<b>Odmocniny</b>: rozšíriť združeným výrazom (a − b)(a + b) = a² − b².','<b>x → ±∞, podiel polynómov</b> stupňov m a n: m < n ⇒ 0, m = n ⇒ podiel vedúcich koeficientov, m > n ⇒ ±∞.','<b>∞ − ∞</b>: racionalizácia, napr. √(x² + x) − x → 1/2.'])+
   tex(p_(`${m_(`lim<sub>x→2</sub> ${frac('x² − 4','x² − 3x + 2')} = lim ${frac('(x − 2)(x + 2)','(x − 2)(x − 1)')} = 4`)}`)+p_(`${m_(`lim<sub>x→0</sub> ${frac('√(1 + x) − 1','x')} = lim ${frac('1','√(1 + x) + 1')} = ${frac(1,2)}`)}`))+
   p_('<b>Sendvičová veta:</b> f ≤ g ≤ h a lim f = lim h = L ⇒ lim g = L. Dôsledok: ak f → 0 a g je ohraničená, f·g → 0 (napr. x² sin(1/x) → 0).'))+
  tsec('Významné limity',tex(p_(`${m_(`lim<sub>x→0</sub> ${frac('sin x','x')} = 1`)}, &nbsp; ${m_(`lim<sub>x→0</sub> ${frac('sin ax','x')} = a`)}, &nbsp; ${m_(`lim<sub>x→0</sub> ${frac('tg x','x')} = 1`)}`)+p_(`${m_(`lim<sub>x→0</sub> ${frac('1 − cos x','x²')} = ${frac(1,2)}`)}`)+p_(`${m_(`lim<sub>x→∞</sub> (1 + ${frac('k','x')})ˣ = eᵏ`)}, &nbsp; ${m_(`${frac('eˣ − 1','x')} → 1`)}, &nbsp; ${m_(`${frac('ln(1 + x)','x')} → 1`)}`))+
   p_('Typy 1<sup>∞</sup>, 0⁰, ∞⁰ pri kladnom základe: logaritmujeme, ln y = g(x)·ln f(x), a ak ln y → A, potom y → eᴬ.'))+
  tsec('Nevlastné limity a asymptoty',p_('Pravidlá: r/±∞ = 0, k/0⁺ = +∞, k/0⁻ = −∞ (k > 0), k·(±∞) = ±∞, r ± ∞ = ±∞. Symbol ∞ nie je reálne číslo, je to spôsob zápisu správania funkcie.')+
   ul(['<b>Zvislá asymptota x = a</b>: aspoň jedna jednostranná limita v a je ±∞.','<b>Šikmá asymptota y = kx + q</b> pre x → ±∞: k = lim f(x)/x, q = lim (f(x) − kx).','Pre k = 0 ide o vodorovnú asymptotu.'])+
   tex(p_(`${m_(`f(x) = ${frac('x² − 3x','x + 1')} = x − 4 + ${frac(4,'x + 1')}`)}: zvislá x = −1, šikmá y = x − 4.`)))
};

THEORY.der={
 theory:ul(['<b>Derivácia</b> f′(x₀) = lim (f(x₀ + h) − f(x₀))/h = smernica dotyčnice. Diferencovateľnosť ⇒ spojitosť (opak neplatí, napr. |x|).','(xⁿ)′ = nxⁿ⁻¹, (eˣ)′ = eˣ, (ln x)′ = 1/x, (sin x)′ = cos x, (cos x)′ = −sin x, (arctg x)′ = 1/(1 + x²).','(fg)′ = f′g + fg′, (f/g)′ = (f′g − fg′)/g², (f ∘ g)′ = f′(g)·g′.','Logaritmické derivovanie: (f<sup>g</sup>)′ = f<sup>g</sup>·(g ln f)′.']),
 full:
  tsec('Definícia a geometrický význam',p_('Diferenčný podiel Δf/Δx je smernica sečnice, a tiež priemerná rýchlosť. Limita pre Δx → 0 je okamžitá rýchlosť a smernica dotyčnice:')+tex(p_(`${m_(`f′(x₀) = lim<sub>h→0</sub> ${frac('f(x₀ + h) − f(x₀)','h')}`)}`))+
   p_('Označenie: f′(x), y′, df/dx, dy/dx. <b>Jednostranné derivácie</b> f′₊, f′₋. Derivácia existuje práve vtedy, keď f′₋(x₀) = f′₊(x₀) ∈ ℝ.')+
   ul(['<b>Roh</b>: |x| má v 0 jednostranné derivácie −1 a 1, derivácia neexistuje (funkcia je tam spojitá).','<b>Vertikálna dotyčnica</b>: √x v 0 má diferenčný podiel 1/√h → +∞, vlastná derivácia neexistuje.','<b>Diferencovateľnosť je silnejšia než spojitosť</b>: ak existuje f′(a), f je v a spojitá.'])+
   tex(p_(`Z definície: ${m_('(x²)′')}: ((a + h)² − a²)/h = 2a + h → 2a.`)))+
  tsec('Vzorce',tblh(['f(x)','f′(x)','f(x)','f′(x)'],[['c','0','sin x','cos x'],['xⁿ','n·xⁿ⁻¹','cos x','−sin x'],['eˣ','eˣ','tg x','1/cos² x'],['aˣ','aˣ ln a','cotg x','−1/sin² x'],['ln x','1/x','arcsin x','1/√(1 − x²)'],['log<sub>a</sub> x','1/(x ln a)','arccos x','−1/√(1 − x²)'],['√x','1/(2√x)','arctg x','1/(1 + x²)'],['1/x','−1/x²','arccotg x','−1/(1 + x²)']]))+
  tsec('Pravidlá derivovania',tex(p_(`${m_(`(f ± g)′ = f′ ± g′, &nbsp; (cf)′ = c·f′`)}`)+p_(`<b>Súčin:</b> ${m_('(fg)′ = f′g + fg′')} (pozor, (fg)′ ≠ f′g′)`)+p_(`<b>Podiel:</b> ${m_(`(${frac('f','g')})′ = ${frac('f′g − fg′','g²')}`)}`)+p_(`<b>Zložená funkcia:</b> ${m_('(f ∘ g)′(x) = f′(g(x))·g′(x)')}: derivujeme vonkajšiu (argument nemeníme) a vynásobíme deriváciou vnútornej.`))+
   p_(`Príklady: ${m_('(x² sin x)′ = 2x sin x + x² cos x')}, &nbsp; ${m_('((2 + 3x)¹⁷)′ = 51(2 + 3x)¹⁶')}, &nbsp; ${m_('(sin² x³)′ = 6x² sin x³ cos x³')}.`)+p_('Reťaz môže mať viac článkov; derivujeme od vonkajšej vrstvy dovnútra.'))+
  tsec('Logaritmické derivovanie',p_('Pre y = f(x)<sup>g(x)</sup> s f > 0 využijeme y = e<sup>g ln f</sup>:')+tex(p_(`${m_('(f<sup>g</sup>)′ = f<sup>g</sup>·(g·ln f)′')}`)+p_(`${m_('(xˣ)′ = xˣ(ln x + 1)')}, &nbsp; ${m_(`(x<sup>sin x</sup>)′ = x<sup>sin x</sup>(cos x·ln x + ${frac('sin x','x')})`)}`))+p_('Metóda zjednoduší aj derivovanie veľkého súčinu: logaritmovaním sa súčin zmení na súčet.'))
};

THEORY.app={
 theory:ul(['Dotyčnica v T = [x₀, f(x₀)]: y − f(x₀) = f′(x₀)(x − x₀). Normála: smernica −1/f′(x₀); ak f′(x₀) = 0, normála je x = x₀.','Rovnobežná s priamkou p: f′(x₀) = k<sub>p</sub>. Kolmá na p: f′(x₀)·k<sub>p</sub> = −1.','Diferenciál df = f′(x₀)Δx, f(x₀ + Δx) ≈ f(x₀) + f′(x₀)Δx.','f″ = (f′)′, f<sup>(n)</sup> = (f<sup>(n−1)</sup>)′.']),
 full:
  tsec('Derivácie vyšších rádov',p_('Ak príslušné derivácie existujú: f″ = (f′)′, f‴ = (f″)′, f<sup>(n)</sup> = (f<sup>(n−1)</sup>)′. Pri každom kroku derivujeme výsledok predchádzajúceho kroku.')+tex(p_(`f(x) = log₂(3x): ${m_(`f′ = ${frac(1,'x ln 2')}`)}, ${m_(`f″ = −${frac(1,'x² ln 2')}`)}, ${m_(`f‴ = ${frac(2,'x³ ln 2')}`)}.`)))+
  tsec('Dotyčnica a normála',p_(`Priamka so smernicou k cez bod (x₀, y₀): y − y₀ = k(x − x₀). Pre graf y = f(x) v bode T = [x₀, f(x₀)]:`)+
   tex(p_(`dotyčnica: ${m_('y − f(x₀) = f′(x₀)·(x − x₀)')}`)+p_(`normála (f′(x₀) ≠ 0): ${m_(`y − f(x₀) = −${frac(1,'f′(x₀)')}·(x − x₀)`)}`))+
   p_('Ak f′(x₀) = 0, dotyčnica je y = f(x₀) a normála zvislá x = x₀.')+
   tex(p_(`f(x) = x², x₀ = 2: T = [2, 4], k<sub>t</sub> = 4, dotyčnica y = 4x − 4, normála y = −x/4 + 9/2.`))+
   p_('<b>Rovnobežná alebo kolmá dotyčnica</b>: ak má dané priamka smernicu k<sub>p</sub>, tak pre rovnobežnosť riešime f′(x₀) = k<sub>p</sub>, pre kolmosť f′(x₀)·k<sub>p</sub> = −1. Potom dopočítame y₀ = f(x₀).'))+
  tsec('Diferenciál a lineárna aproximácia',p_('Pre malé Δx je zmena funkcie približne rovná zmene na dotyčnici:')+tex(p_(`Δf ≈ ${m_('df = f′(x₀)·Δx')}, &nbsp; ${m_('f(x) ≈ f(x₀) + f′(x₀)(x − x₀)')}`))+
   p_('Zvolíme blízky bod x₀, v ktorom poznáme f(x₀) aj f′(x₀), a dosadíme.')+tex(p_(`√80: f = √x, x₀ = 81: f(81) = 9, f′(81) = 1/18, Δx = −1 ⇒ √80 ≈ 9 − 1/18 = 8,9444 (presne 8,94427).`)+p_('Užitočné pre x blízke 0: sin x ≈ x, eˣ ≈ 1 + x, ln(1 + x) ≈ x (uhly v radiánoch).')))
};

THEORY.tay={
 theory:ul(['<b>Taylorov polynóm</b> T<sub>n</sub>(x) = Σ f<sup>(k)</sup>(x₀)/k! · (x − x₀)ᵏ. Pre x₀ = 0 je to MacLaurinov polynóm.','eˣ = 1 + x + x²/2! + x³/3! + …, sin x = x − x³/3! + x⁵/5! − …, cos x = 1 − x²/2! + x⁴/4! − …','<b>L′Hospital</b>: pre 0/0 alebo ∞/∞ platí lim f/g = lim f′/g′ (derivujeme osobitne). Ostatné tvary najprv upraviť na podiel.']),
 full:
  tsec('Taylorov polynóm',p_('Hľadáme polynóm T<sub>n</sub>, ktorý má v x₀ rovnakú hodnotu a prvých n derivácií ako f. Takým polynómom je práve:')+tex(p_(`${m_(`T<sub>n</sub>(x) = Σ<sub>k=0</sub><sup>n</sup> ${frac('f<sup>(k)</sup>(x₀)','k!')}·(x − x₀)ᵏ`)}`))+
   p_('Koeficienty nie sú uhádnuté, sú určené deriváciami: ak T<sub>n</sub> = a₀ + a₁(x − x₀) + …, tak T<sub>n</sub><sup>(k)</sup>(x₀) = k!·a<sub>k</sub>. Čím vyšší stupeň, tým lepšie sa polynóm priblíži k funkcii, najmä blízko stredu.')+
   p_('<b>Taylorova veta:</b> f(x) = T<sub>n</sub>(x) + R<sub>n</sub>(x), kde R<sub>n</sub>(x) = f<sup>(n+1)</sup>(ξ)/(n+1)! · (x − x₀)ⁿ⁺¹ pre nejaké ξ medzi x₀ a x.'))+
  tsec('MacLaurinove polynómy (x₀ = 0)',tex(p_(`${m_('eˣ = 1 + x + x²/2! + x³/3! + …')}`)+p_(`${m_('sin x = x − x³/3! + x⁵/5! − …')} (nepárna ⇒ len nepárne mocniny)`)+p_(`${m_('cos x = 1 − x²/2! + x⁴/4! − …')} (párna ⇒ len párne mocniny)`)+p_(`${m_('ln(1 + x) = x − x²/2 + x³/3 − …')}, &nbsp; ${m_('1/(1 − x) = 1 + x + x² + …')}, &nbsp; ${m_('arctg x = x − x³/3 + …')}`)+p_(`${m_('tg x = x + x³/3 + …')}`))+
   p_('Postup: vypíšeme f, f′, f″, … v bode x₀, vydelíme faktoriálmi a zložíme polynóm. Pri periodických deriváciách (sin, cos) sa hodnoty striedajú.'))+
  tsec('Približné výpočty',p_('Hodnotu ťažko počítateľnej funkcie približne vypočítame dosadením do T<sub>n</sub> so stredom v blízkom bode.')+tex(p_(`ln(1,3) ≈ T₂: f = ln x, x₀ = 1, T₂ = (x − 1) − (x − 1)²/2 ⇒ 0,3 − 0,045 = 0,255 (presne 0,262).`)))+
  tsec("L′Hospitalovo pravidlo",p_('Ak lim f = lim g = 0 alebo lim f = lim g = ±∞ a existuje lim f′/g′, potom lim f/g = lim f′/g′.')+
   ul(['Najprv dosadením určíme tvar limity. Pravidlo smie len pri 0/0 alebo ∞/∞.','Čitateľa a menovateľa derivujeme <b>osobitne</b>, nejde o podielové pravidlo.','Možno použiť opakovane, aj pri jednostranných limitách a v nevlastných bodoch.','Tvary 0·∞, ∞ − ∞, 1<sup>∞</sup>, 0⁰, ∞⁰ najprv upravíme: súčin na podiel (f·g = f/(1/g)), mocniny logaritmovaním.'])+
   tex(p_(`${m_(`lim<sub>x→0</sub> ${frac('x − sin x','x³')} = lim ${frac('1 − cos x','3x²')} = lim ${frac('sin x','6x')} = lim ${frac('cos x',6)} = ${frac(1,6)}`)}`)+p_(`${m_('lim<sub>x→0⁺</sub> x ln x')} = lim ln x / (1/x) = lim (1/x)/(−1/x²) = lim (−x) = 0.`)+p_(`${m_('lim<sub>x→∞</sub> x<sup>1/x</sup>')}: ln y = (ln x)/x → 0, preto y → e⁰ = 1.`)))
};

THEORY.prb={
 theory:ul(['<b>f′ > 0</b> ⇒ rastie, <b>f′ < 0</b> ⇒ klesá. Kritické body: f′ = 0 (stacionárne) alebo f′ neexistuje.','<b>f″ > 0</b> ⇒ konvexná, <b>f″ < 0</b> ⇒ konkávna. Inflexia: zmena znamienka f″.','Lokálny extrém: f′ mení znamienko (+→− max, −→+ min), alebo f′(a) = 0 a f″(a) ≠ 0.','Globálne extrémy na ⟨a, b⟩: porovnať hodnoty v stacionárnych a krajných bodoch.']),
 full:
  tsec('Postup vyšetrovania priebehu funkcie',ul(['Definičný obor, priesečníky s osami, symetria (párnosť, periodickosť).','Limity na hraniciach D(f), asymptoty.','f′: kritické body, intervaly monotónnosti, extrémy.','f″: intervaly konvexnosti a konkávnosti, inflexné body.','Zhrnutie do tabuľky a náčrt grafu.']))+
  tsec('Monotónnosť',p_('Ak f′(x) > 0 na (a, b), funkcia je tam ostro rastúca; ak f′(x) < 0, ostro klesajúca; ak f′ = 0 na celom intervale, je konštantná.')+
   p_('<b>Kritický bod</b> c ∈ D(f): f′(c) = 0 (stacionárny bod) alebo f′(c) neexistuje. Pri znamienkovej tabuľke delíme D(f) aj bodmi mimo D(f).')+
   tex(p_(`${m_('f(x) = 51 + 36x + 6x² − x³')}: f′ = −3(x + 2)(x − 6).`)+tblh(['x','(−∞, −2)','−2','(−2, 6)','6','(6, ∞)'],[['f′','−','0','+','0','−'],['f','↘','min','↗','max','↘']])+p_('Lokálne minimum f(−2) = 11, lokálne maximum f(6) = 267.')))+
  tsec('Konvexnosť a inflexné body',p_('f″ > 0 ⇒ f′ rastie, smernice dotyčníc rastú, graf je konvexný (nad dotyčnicami). f″ < 0 ⇒ konkávna. Rovnica f″(c) = 0 dá len kandidáta na inflexný bod, inflexiu potvrdí až zmena znamienka f″.')+
   tex(p_(`${m_('f(x) = x⁴')}: f″ = 12x², f″(0) = 0, ale f″ ≥ 0 na oboch stranách, 0 nie je inflexný bod. ${m_('g(x) = x³')}: g″ = 6x mení znamienko ⇒ 0 je inflexný bod.`)))+
  tsec('Lokálne a globálne extrémy',p_('Ak má f vo vnútornom bode a lokálny extrém a existuje f′(a), potom f′(a) = 0. Extrém môže byť aj tam, kde derivácia neexistuje (|x| v 0).')+
   tblh(['zmena znamienka f′ v okolí a','záver'],[['+ → −','lokálne maximum'],['− → +','lokálne minimum'],['+ → + alebo − → −','sedlový bod (nie je extrém)']])+
   p_(`<b>Test druhej derivácie:</b> f′(a) = 0 a f″(a) > 0 ⇒ minimum, f″(a) < 0 ⇒ maximum. Pri f″(a) = 0 test nerozhodne (x⁴ má v 0 minimum, x³ nemá extrém), treba použiť test prvej derivácie.`)+
   p_('<b>Globálne extrémy spojitej funkcie na ⟨a, b⟩:</b> nájdeme stacionárne body v (a, b), vypočítame f v nich aj v krajných bodoch a vyberieme najväčšiu a najmenšiu hodnotu.')+
   tex(p_(`${m_('f(x) = x³ − 3x')} na ⟨−2, 2⟩: f′ = 3(x² − 1) = 0 pre x = ±1. Hodnoty: f(−2) = −2, f(−1) = 2, f(1) = −2, f(2) = 2. Maximum 2 (v −1 aj 2), minimum −2 (v −2 aj 1).`)))+
  tsec('Príklad: f(x) = x³ − 3x²',ul(['D(f) = ℝ; nuly: x²(x − 3) = 0 ⇒ 0, 3.','f′ = 3x(x − 2): max v 0 (f = 0), min v 2 (f = −4).','f″ = 6(x − 1): konkávna na (−∞, 1), konvexná na (1, ∞), inflexný bod [1; −2].','Nemá asymptoty (polynóm); lim = ∞ pre x → ∞ a −∞ pre x → −∞.']))
};

 {o:{fns:[{f:x=>x*x*x,cls:'c1'}],xr:[-2.2,2.2],yr:[-8,8]},c:'y = x³: nepárna, rastúca, prostá'},
 {o:{fns:[{f:x=>1/x,cls:'c1'}],xr:[-4,4],yr:[-5,5],vl:[0],hl:[0]},c:'y = 1/x: nepárna, D = ℝ ∖ {0}, asymptoty'},
 {o:{fns:[{f:x=>Math.sqrt(x),cls:'c1'}],xr:[-1,9],yr:[-1,4]},c:'y = √x: D = ⟨0, ∞), rastúca'},

THEORY.pol.full+=tsec('Grafy polynómov a lomených funkcií',p_('Korene polynómu sú priesečníky grafu s osou x. Stupeň a znamienko vedúceho koeficientu určujú správanie na okrajoch.')+gal([

let U={view:'practice',topic:'mix',q:null,qt:null,sel:null,rows:[],counted:false,done:false,shown:false};

const totals=()=>Object.values(ST.stats).reduce((a,s)=>({ok:a.ok+s.ok,total:a.total+s.total}),{ok:0,total:0});

/* ---------- navigácia ---------- */
function renderNav(){
  const all=totals();
  const btn=(id,name,short,st)=>`<button class="tbtn" data-id="${id}" aria-pressed="${U.topic===id}"><span class="n"><span>${name}</span><em>${st.ok}/${st.total}</em></span><span class="s">${short}</span><div class="bar"><i style="width:${st.total?Math.round(100*st.ok/st.total):0}%"></i></div></button>`;
  $('#nav').innerHTML=(U.view==='theory'?'':btn('mix','Všetko dokopy','náhodná téma',all))+TOPICS.map(t=>btn(t.id,t.name,t.short,tstat(t.id))).join('')+`<button class="reset" id="reset">Vynulovať štatistiku</button>`;
  $('#nav').querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{U.topic=b.dataset.id;renderTheory();if(U.view==='theory')window.scrollTo({top:0});next()});
  $('#reset').onclick=()=>{ST={stats:{},streak:0,best:0};save();renderNav()};
  renderScore()}
function renderScore(){const a=totals();
  $('#score').innerHTML=`<div><b>${a.ok}/${a.total}</b><span>správne na 1. pokus</span></div><div><b>${ST.streak}</b><span>v rade</span></div><div><b>${ST.best}</b><span>najlepšia séria</span></div>`}
function renderTheory(){
  const t=TOPICS.find(x=>x.id===U.topic),d=$('#theory'),p=$('#tpane');
  if(!t){d.hidden=true;p.innerHTML='';return}
  d.hidden=false;d.querySelector('summary').textContent='Zhrnutie z prednášok: '+t.name;d.querySelector('.in').innerHTML=t.theory;
  p.innerHTML=`<h3>${t.name}</h3>${t.full}`}
function setView(v){
  U.view=v;$('#app').dataset.view=v;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(v==='theory'&&U.topic==='mix'){U.topic='fun';renderTheory();next()}else{renderTheory();renderNav()}
  $('#tpane').scrollTop=0}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ---------- otázky ---------- */
function next(){
  const pool=U.topic==='mix'?TOPICS:TOPICS.filter(t=>t.id===U.topic);
  let q=null,t=null;
  for(let k=0;k<8&&!q;k++){try{t=pick(pool);q=pickGen(t)()}catch(e){q=null}}
  U={...U,q,qt:t,sel:null,rows:q&&q.input.t==='rows'?q.input.rows.map(()=>null):[],counted:false,done:false,shown:false};
  renderNav();renderCard();
  const cd=$('#card');if(cd.getBoundingClientRect().top<0)cd.scrollIntoView({block:'start',behavior:'auto'});
  const f=$('#card input.cell');if(f&&matchMedia('(hover:hover)').matches)f.focus({preventScroll:true})}
const CELL='autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"';
const cellHtml=(k,m,label)=>`<input class="cell ${m==='set'?'wide':''}" id="c${k}" data-m="${m}" aria-label="${label}" ${CELL} inputmode="text">`;
function inputsHtml(inp){
  if(inp.t==='lines'){let k=0;return`<div class="answer"><span class="lbl2">Tvoja odpoveď</span>${inp.lines.map(l=>`<div class="ln">${l.map(x=>{if(x===null)return cellHtml(k++,'num','pole '+k);if(typeof x==='object')return cellHtml(k++,x.m,'pole '+k);return`<span class="t">${x}</span>`}).join('')}</div>`).join('')}</div>`}
  if(inp.t==='expr'){return`<div class="answer"><span class="lbl2">Tvoja odpoveď</span><div class="ln"><input class="cell expr" id="c0" data-m="expr" aria-label="výraz" ${CELL} inputmode="text" placeholder="napr. 2x*cos(x)"></div>
    <div class="insbar" aria-label="Vloženie znaku">${['^','(',')','/','√(','π','e'].map(c=>`<button type="button" class="ib" data-ins="${c}" aria-label="vložiť ${c}">${c}</button>`).join('')}</div>
    <div class="muted">Premenná je <kbd>x</kbd>. Funkcie: <kbd>sin(x)</kbd>, <kbd>cos(x)</kbd>, <kbd>tg(x)</kbd>, <kbd>e^x</kbd>, <kbd>ln(x)</kbd>, <kbd>sqrt(x)</kbd>, <kbd>arctg(x)</kbd>. Uúčin môžeš písať bez znaku (<kbd>2x</kbd>). Argumenty a zlomky daj do zátvoriek.</div></div>`}
  if(inp.t==='rows')return`<div class="rowsq">${inp.rows.map((r,i)=>`<div class="rq"><div class="rl">${r.label}</div><div class="ro" role="radiogroup">${r.opts.map((o,j)=>`<button class="opt sm" role="radio" aria-checked="false" data-r="${i}" data-i="${j}">${o}</button>`).join('')}</div></div>`).join('')}</div>`;
  return`<div class="opts" role="radiogroup" aria-label="Možnosti">${inp.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-i="${i}">${o}</button>`).join('')}</div>`}
function hintFor(inp){
  if(inp.t!=='lines')return'';
  const sp=specsOf(inp),h=[];
  h.push('čísla, zlomky <kbd>2/7</kbd>, desatinné, výrazy ako <kbd>sqrt(3)/2</kbd>, <kbd>pi/6</kbd>, <kbd>e^2</kbd>; nekonečno <kbd>inf</kbd>, neexistuje <kbd>nex</kbd>');
  if(sp.includes('set'))h.push('zoznam čísel oddelených čiarkou, prázdna množina <kbd>-</kbd>');
  return`<div class="muted">Zápis: ${h.join('; ')}. Enter skočí na ďalšie pole.</div>`}
function renderCard(){
  const q=U.q,c=$('#card');
  if(!q){c.innerHTML='<p>Príklad sa nepodarilo vytvoriť. Skús ďalší.</p><div class="actions"><button class="btn main" id="nx">Ďalší príklad</button></div>';$('#nx').onclick=next;return}
  c.innerHTML=`<div class="meta"><span class="chip">${q.kind}</span><span>${U.qt.name}</span></div>
   <div class="prompt">${q.prompt}</div>${inputsHtml(q.input)}${hintFor(q.input)}
   <div id="fb" role="status" aria-live="polite"></div>
   <div class="actions"><button class="btn main" id="chk">Skontrolovať</button><button class="btn" id="shw">Ukáž riešenie</button><button class="btn" id="nx">Ďalší príklad</button></div>
   <div id="sol" class="sol" hidden></div>`;
  $('#chk').onclick=check;$('#shw').onclick=reveal;$('#nx').onclick=next;
  c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(U.done||U.shown)return;
    if(b.dataset.r!==undefined){const r=+b.dataset.r;U.rows[r]=+b.dataset.i;c.querySelectorAll(`.opt[data-r="${r}"]`).forEach(o=>{o.setAttribute('aria-checked',o===b);o.classList.remove('bad','ok')})}
    else{U.sel=+b.dataset.i;c.querySelectorAll('.opt').forEach(o=>{o.setAttribute('aria-checked',o===b);o.classList.remove('bad','ok')})}});
  const ins=[...c.querySelectorAll('input.cell')];
  ins.forEach((el,i)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(U.done||U.shown)return next();if(i<ins.length-1)ins[i+1].focus();else check()}}));
  c.querySelectorAll('.ib').forEach(b=>b.onclick=()=>{const el=$('#c0');if(!el||el.readOnly)return;const a=el.selectionStart??el.value.length,z=el.selectionEnd??a;el.value=el.value.slice(0,a)+b.dataset.ins+el.value.slice(z);el.focus();const p=a+b.dataset.ins.length;try{el.setSelectionRange(p,p)}catch(e){}})}
function fb(cls,txt){$('#fb').innerHTML=`<div class="fb ${cls}">${txt}</div>`}
function record(ok){const s=tstat(U.qt.id);s.total++;if(ok){s.ok++;ST.streak++;ST.best=Math.max(ST.best,ST.streak)}else ST.streak=0;U.counted=true;save();renderNav()}
function finishOk(){U.done=true;fb('ok','Správne.');lockInputs();showSol(false);$('#chk').disabled=true;$('#nx').classList.add('main');$('#chk').classList.remove('main');$('#nx').focus({preventScroll:true})}
function check(){
  if(U.done||U.shown)return;
  const q=U.q,inp=q.input,card=$('#card');
  const ins=[...card.querySelectorAll('input.cell')];
  const raw=inp.t==='choice'?U.sel:inp.t==='rows'?U.rows:inp.t==='expr'?ins[0].value:ins.map(e=>e.value);
  const r=grade(q,raw);
  if(r.hold){if(inp.t==='expr'){ins[0].classList.add('warn');ins[0].classList.remove('bad')}fb('warn',r.msg);return}
  if(!U.counted)record(r.ok);
  if(inp.t==='choice'){card.querySelectorAll('.opt').forEach((o,i)=>{if(i===U.sel)o.classList.add(r.ok?'ok':'bad')});if(r.ok)finishOk();else fb('bad','Zatiaľ nie. Skús inú možnosť alebo si zobraz riešenie.');return}
  if(inp.t==='rows'){card.querySelectorAll('.opt').forEach(o=>{const rr=+o.dataset.r,i=+o.dataset.i;if(U.rows[rr]===i)o.classList.add(i===q.answer[rr]?'ok':'bad')});if(r.ok)finishOk();else fb('bad',`Správne ${r.hit} z ${r.total} riadkov. Červené oprav alebo si zobraz riešenie.`);return}
  if(inp.t==='expr'){ins[0].classList.remove('warn');ins[0].classList.toggle('ok',!!r.ok);ins[0].classList.toggle('bad',!r.ok);if(r.ok)finishOk();else fb('bad',r.msg||'Výraz nesedí. Skús ho upraviť alebo si zobraz riešenie.');return}
  ins.forEach((el,i)=>{el.classList.toggle('ok',r.per[i]);el.classList.toggle('bad',!r.per[i])});
  if(r.ok)finishOk();else fb('bad',r.total>1?`Správne ${r.hit} z ${r.total} polí. Červené polia oprav alebo si zobraz riešenie.`:'Zatiaľ nie. Skús znova alebo si zobraz riešenie.')}
function lockInputs(){$('#card').querySelectorAll('input.cell').forEach(i=>i.readOnly=true);$('#card').querySelectorAll('.opt').forEach(o=>o.disabled=true)}
function showSol(open){const s=$('#sol');s.hidden=false;s.innerHTML=`<h3>Postup</h3>${U.q.solution}`;if(open)s.scrollIntoView({block:'nearest',behavior:'smooth'})}
function reveal(){
  if(!U.counted)record(false);
  U.shown=true;const q=U.q,inp=q.input;
  if(inp.t==='choice')$('#card').querySelectorAll('.opt').forEach((o,i)=>{o.disabled=true;if(i===q.answer[0])o.classList.add('ok')});
  else if(inp.t==='rows')$('#card').querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===q.answer[+o.dataset.r])o.classList.add('ok')});
  else if(inp.t==='expr'){const el=$('#c0');el.readOnly=true;el.value='';el.placeholder='riešenie je nižšie';el.classList.remove('bad','warn')}
  else{const ins=[...$('#card').querySelectorAll('input.cell')];ins.forEach((el,i)=>{el.value=atext(q.answer[i]);el.classList.remove('bad');el.classList.add('ok');el.readOnly=true})}
  if(!U.done)fb('warn','Riešenie je zobrazené, tento príklad sa počíta ako nesprávny.');

 sin:{t:'Sínusovka: hýb parametrami',ctrls:[
   {k:'a',l:'amplitúda a',min:-3,max:3,step:.1,v:1.5},{k:'b',l:'frekvencia b',min:.2,max:3,step:.1,v:1},
   {k:'c',l:'posun fázy c',min:-3.2,max:3.2,step:.1,v:0},{k:'d',l:'posun d',min:-2,max:2,step:.1,v:0}],
  run:p=>({o:{fns:[{f:x=>p.a*Math.sin(p.b*x+p.c)+p.d,cls:'c1'},{f:Math.sin,cls:'c3'}],xr:[-7,7],yr:[-5.5,5.5],label:'f(x) = a·sin(bx + c) + d'},
   txt:`f(x) = ${lf(p.a,1)}·sin(${lf(p.b,1)}x ${p.c<0?'−':'+'} ${lf(Math.abs(p.c),1)}) ${p.d<0?'−':'+'} ${lf(Math.abs(p.d),1)}<br>Amplitúda ${lf(Math.abs(p.a),1)}, perióda 2π/b = ${lf(2*Math.PI/Math.abs(p.b),2)}. Zelená je základné sin x.`})},
 tan:{t:'Dotyčnica: posúvaj bod dotyku',ctrls:[{k:'f',l:'funkcia',sel:fnOpts,v:'x2'},{k:'x',l:'bod x₀',min:-3,max:6,step:.1,v:1}],
  run:p=>{const g=FN8[p.f],x0=p.x,y0=g.f(x0),k=g.d(x0);
   if(!Number.isFinite(y0)||!Number.isFinite(k))return{o:{fns:[{f:g.f,cls:'c1'}],xr:g.xr,yr:g.yr},txt:'V bode x₀ nie je funkcia definovaná alebo nemá deriváciu.'};
   const q=y0-k*x0;
   return{o:{fns:[{f:g.f,cls:'c1'}],xr:g.xr,yr:g.yr,lines:[{k,q,cls:'ln2'}],pts:[{x:x0,y:y0,l:'T'}],label:'dotyčnica'},
    txt:`f(x₀) = ${lf(y0,3)}, f′(x₀) = ${lf(k,3)}.<br>Dotyčnica: y = ${lf(k,3)}·x ${q<0?'−':'+'} ${lf(Math.abs(q),3)}.${Math.abs(k)>1e-9?` Normála má smernicu ${lf(-1/k,3)}.`:' Smernica je 0, dotyčnica je vodorovná.'}`}}},
 deriv:{t:'Funkcia a jej derivácia',ctrls:[{k:'f',l:'funkcia',sel:fnOpts,v:'sin'},{k:'x',l:'bod x₀',min:-3,max:6,step:.1,v:1}],
  run:p=>{const g=FN8[p.f],x0=p.x,y0=g.f(x0),k=g.d(x0);
   const pts=[];if(Number.isFinite(y0))pts.push({x:x0,y:y0,l:'f'});if(Number.isFinite(k))pts.push({x:x0,y:k,l:'f′',cls:''});
   return{o:{fns:[{f:g.f,cls:'c1'},{f:g.d,cls:'c2'}],xr:g.xr,yr:[Math.min(g.yr[0],-3),Math.max(g.yr[1],3)],pts,label:'f a f′'},
    txt:!Number.isFinite(k)?'V tomto bode derivácia neexistuje.':`Modrá: f, červená: f′. V x₀ = ${lf(x0,1)} je f′ = ${lf(k,3)}: ${k>1e-9?'f rastie.':k<-1e-9?'f klesá.':'smernica je nulová (možný extrém).'}`}}},
 taylor:{t:'Taylorov polynóm: zvyšuj stupeň',ctrls:[{k:'f',l:'funkcia',sel:Object.entries(TAY).map(([k,v])=>[k,v.n]),v:'sin'},{k:'n',l:'stupeň n',min:0,max:11,step:1,v:3},{k:'x',l:'dosadiť x',min:-2,max:2,step:.1,v:1}],
  run:p=>{const g=TAY[p.f],n=p.n,c=[];for(let k=0;k<=n;k++)c.push(g.c(k));
   const T=x=>c.reduce((s,v,k)=>s+v*Math.pow(x,k),0);
   const tl=c.map((v,k)=>({v,k})).filter(o=>o.v).slice(0,6);
   const terms=tl.map((o,i)=>{const av=Math.abs(o.v),co=(Math.abs(av-1)<1e-9&&o.k>0)?'':lf(av,4),xp=o.k?'x'+(o.k>1?'<sup>'+o.k+'</sup>':''):'';return(i?(o.v<0?' − ':' + '):(o.v<0?'−':''))+co+xp}).join('');
   const fx=g.f(p.x),tx=T(p.x);
   return{o:{fns:[{f:g.f,cls:'c1'},{f:T,cls:'c2'}],xr:g.xr,yr:g.yr,pts:Number.isFinite(fx)?[{x:p.x,y:fx}]:[],label:'Taylorov polynóm'},
    txt:`T<sub>${n}</sub>(x) = ${terms||'0'}${c.filter(Boolean).length>6?' + …':''}<br>Pri x = ${lf(p.x,1)}: f = ${Number.isFinite(fx)?lf(fx,5):'—'}, T<sub>${n}</sub> = ${lf(tx,5)}${Number.isFinite(fx)?`, chyba ${lf(Math.abs(fx-tx),5)}`:''}.`}}},
 cubic:{t:'Priebeh: kubická funkcia ax³ + bx² + cx + d',ctrls:[
   {k:'a',l:'a',min:-2,max:2,step:.1,v:1},{k:'b',l:'b',min:-4,max:4,step:.1,v:-3},{k:'c',l:'c',min:-6,max:6,step:.1,v:0},{k:'d',l:'d',min:-4,max:4,step:.1,v:0}],
  run:p=>{const{a,b,c,d}=p,f=x=>a*x*x*x+b*x*x+c*x+d,f1=x=>3*a*x*x+2*b*x+c;
   const A=3*a,B=2*b,C=c;let roots=[];
   if(Math.abs(A)<1e-9){if(Math.abs(B)>1e-9)roots=[-C/B]}else{const D=B*B-4*A*C;if(D>0)roots=[(-B-Math.sqrt(D))/(2*A),(-B+Math.sqrt(D))/(2*A)];else if(Math.abs(D)<1e-9)roots=[-B/(2*A)]}
   const pts=[],lines=[];roots.forEach(r=>{const s2=6*a*r+2*b;pts.push({x:r,y:f(r),l:s2<-1e-9?'max':s2>1e-9?'min':'sedlo'})});
   let inf='';if(Math.abs(a)>1e-9){const xi=-b/(3*a);pts.push({x:xi,y:f(xi),l:'inflexia'});inf=`Inflexný bod x = ${lf(xi,2)}.`}
   return{o:{fns:[{f,cls:'c1'},{f:f1,cls:'c3'}],xr:[-5,5],yr:[-15,15],pts,label:'kubická funkcia'},
    txt:`f′(x) = ${lf(3*a,1)}x² ${2*b<0?'−':'+'} ${lf(Math.abs(2*b),1)}x ${c<0?'−':'+'} ${lf(Math.abs(c),1)} (zelená).<br>${roots.length?'Kritické body: '+roots.map(r=>'x = '+lf(r,2)).join(', ')+'. ':'f′ nemá reálne korene, funkcia nemá extrémy. '}${inf}`}}},
 eps:{t:'Limita: ε a δ',ctrls:[{k:'f',l:'funkcia',sel:Object.entries(epsDefs).map(([k,v])=>[k,v.n]),v:'lin'},{k:'e',l:'ε',min:.1,max:3,step:.05,v:1}],
  run:p=>{const d=epsDefs[p.f],e=p.e,del=epsDelta(d,e);
   return{o:{fns:[{f:d.f,cls:'c1'}],xr:d.xr,yr:d.yr,hl:[d.L-e,d.L+e],vl:[d.a-del,d.a+del],pts:[{x:d.a,y:d.L}],label:'ε–δ'},
    txt:`Limita je L = ${d.L}. Pre ε = ${lf(e,2)} stačí δ ≈ ${lf(del,3)}: ak je |x − ${d.a}| < δ, tak |f(x) − ${d.L}| < ε. Menšie ε vyžaduje menšie δ.`}}}
};
function initLabs(){
  document.querySelectorAll('.lab[data-lab]').forEach(el=>{
    const d=LABDEF[el.dataset.lab];if(!d||el.dataset.ready)return;el.dataset.ready='1';
    el.innerHTML=`<h5>${d.t}</h5><div class="plotw"></div><div class="ctr">${d.ctrls.map(c=>c.sel?
      `<label>${c.l}<select data-k="${c.k}">${c.sel.map(([v,n])=>`<option value="${v}" ${v===c.v?'selected':''}>${n}</option>`).join('')}</select><span></span></label>`:
      `<label>${c.l}<input type="range" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.v}"><b data-for="${c.k}"></b></label>`).join('')}</div><div class="out" role="status"></div>`;
    const upd=()=>{const p={};
      el.querySelectorAll('[data-k]').forEach(c=>{p[c.dataset.k]=c.type==='range'?+c.value:c.value;const b=el.querySelector(`b[data-for="${c.dataset.k}"]`);if(b)b.textContent=lf(c.value,2)});
      const r=d.run(p);el.querySelector('.plotw').innerHTML=plot(r.o)||'';el.querySelector('.out').innerHTML=r.txt};
    el.querySelectorAll('[data-k]').forEach(c=>c.addEventListener('input',upd));upd()})}
const _rtl=renderTheory;renderTheory=function(){_rtl();initLabs()};
renderTheory();
</script>
