<style>
/* Layout: ľavý panel s témami, vpravo karta s príkladom. Farby skupín v mape sú tokeny --g1 až --g6 */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1c2331; --muted:#5d6678; --rule:#dfe6f0; --line:#cfd8e6;
  --red:#c42a3c; --blue:#1d5fc4; --green:#1b8450; --amber:#b86e00;
  --ok-bg:#e3f4ea; --bad-bg:#fbe6e8; --soft:#e9eef7;
  --g1:#d6336c; --g2:#12875a; --g3:#d9730d; --g4:#6a4fd1; --g5:#0f86c4; --g6:#9a7b00; --wire:#44506a;
  --f-display:'Caveat','Segoe Print','Bradley Hand',cursive; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111620; --card:#192030; --fg:#e7ebf3; --muted:#9aa5ba; --rule:#202a3c; --line:#33415a;
  --red:#ff7f8c; --blue:#80aaff; --green:#58d28e; --amber:#f0b14a;
  --ok-bg:#16382a; --bad-bg:#44212a; --soft:#222c40; --g1:#ff7ab0; --g2:#4fd69e; --g3:#ffa94d; --g4:#a99bff; --g5:#5cc6ff; --g6:#e6c24a; --wire:#9fb0cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111620; --card:#192030; --fg:#e7ebf3; --muted:#9aa5ba; --rule:#202a3c; --line:#33415a;
  --red:#ff7f8c; --blue:#80aaff; --green:#58d28e; --amber:#f0b14a;
  --ok-bg:#16382a; --bad-bg:#44212a; --soft:#222c40; --g1:#ff7ab0; --g2:#4fd69e; --g3:#ffa94d; --g4:#a99bff; --g5:#5cc6ff; --g6:#e6c24a; --wire:#9fb0cf; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 40px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px}
.app{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 2.6rem/1 var(--f-display);color:var(--red);margin:0;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.score{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;line-height:1.2}
.score b{font:600 1.4rem var(--f-body)}
.score span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
nav.topics{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px}
.tbtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,background .15s}
.tbtn:hover{border-color:var(--blue)}
.tbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--soft)}
.tbtn .n{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.tbtn .n em{font-style:normal;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.tbtn .s{font-size:.8rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--rule);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}
.reset{all:unset;cursor:pointer;font-size:.8rem;color:var(--muted);text-decoration:underline;padding:4px 2px}
.reset:focus-visible{outline:3px solid var(--blue)}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
details.theory{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:0}
details.theory summary{cursor:pointer;padding:10px 14px;font:700 1.35rem var(--f-display);color:var(--green);list-style:none}
details.theory summary::before{content:"＋ ";font-family:var(--f-body);font-size:.9rem}
details.theory[open] summary::before{content:"− "}
details.theory .in{padding:0 16px 12px;font-size:.93rem}
details.theory ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.card{scroll-margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.chip{background:var(--soft);color:var(--blue);padding:3px 10px;border-radius:99px;font-weight:600}
.prompt{font-size:1.05rem;min-width:0}
.prompt p{margin:.5em 0}.muted{color:var(--muted);font-size:.88rem}
.eq{margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;overflow-x:auto;max-width:100%;padding-block:4px}
.gap{display:inline-block;width:14px}
.lbl{color:var(--blue);font-weight:600;white-space:nowrap}
.sys{display:inline-flex;flex-direction:column;gap:2px;margin:8px 0;padding:4px 0 4px 14px;border-left:3px solid var(--blue);font-size:1.1rem;font-variant-numeric:tabular-nums}
.op{display:inline-block;background:var(--soft);color:var(--red);padding:1px 8px;border-radius:6px;font-family:var(--f-mono);font-size:.88em;white-space:nowrap}
.mx{display:inline-block;position:relative;padding:4px 10px;margin:0 3px;vertical-align:middle}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:7px;border:2px solid currentColor}
.mx::before{left:0;border-right:0}.mx::after{right:0;border-left:0}
.mx table{border-collapse:collapse}
.mx td{padding:3px 9px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx td.aug{border-left:2px solid currentColor}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.85em;line-height:1.15;margin:0 .15em}
.fr>span{padding:0 .25em;text-align:center}.fr>span:first-child{border-bottom:1.5px solid currentColor}
.answer{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--soft);border-radius:10px;max-width:100%;overflow-x:auto}
.answer .lbl2{font:700 1.25rem var(--f-display);color:var(--red)}
.cell{font:500 1rem var(--f-mono);width:4.6em;padding:6px 6px;text-align:center;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg)}
.cell:focus{outline:3px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.cell.ok{border-color:var(--green);background:var(--ok-bg)}.cell.bad{border-color:var(--red);background:var(--bad-bg)}
.cell:read-only{cursor:default}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ln .t{white-space:nowrap}
.mx.in td{padding:3px 4px}
.opts{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:520px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:10px 14px;display:block}
.opt:hover{border-color:var(--blue)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--soft)}
.opt.ok{border-color:var(--green);background:var(--ok-bg)}.opt.bad{border-color:var(--red);background:var(--bad-bg)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:9px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--fg)}
.btn:hover{border-color:var(--blue)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.main{color:#0d1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#0d1424}}
.btn[disabled]{opacity:.45;cursor:default}
.fb{padding:10px 14px;border-radius:9px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--green)}.fb.bad{background:var(--bad-bg);color:var(--red)}.fb.warn{background:var(--soft);color:var(--amber)}
.sol{border-top:2px dashed var(--line);padding-top:12px}
.sol h3{font:700 1.4rem var(--f-display);color:var(--green);margin:0 0 4px}
.sol p{margin:.4em 0}.sol ul{margin:.4em 0;padding-left:1.2em}
.steps{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;overflow-x:auto;max-width:100%}
.st .op{min-width:8.5em}
kbd{font:500 .8em var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:5px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--line)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 16px;font-weight:600;color:var(--muted);border:2px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;margin-bottom:-2px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--blue);background:var(--card);border-color:var(--line)}
.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.split{display:flex;flex-direction:column;gap:14px;min-width:0}
.tpane{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 20px 18px;min-width:0}
.tpane h3{font:700 2rem/1.1 var(--f-display);color:var(--red);margin:12px 0 0}
.tsec{padding-top:14px}
.tsec h4{font:700 1.45rem/1.1 var(--f-display);color:var(--green);margin:0 0 4px}
.tsec p{margin:.4em 0}.tsec ul,.tsec ol{margin:.4em 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tex{border-left:3px solid var(--blue);background:var(--soft);border-radius:0 8px 8px 0;padding:6px 12px;margin:8px 0;overflow-x:auto;max-width:100%}
.tex p{margin:.3em 0}
.app[data-view="theory"]{max-width:1320px}
.app[data-view="theory"] details.theory{display:none}
.app[data-view="theory"] .tpane{display:block}
@media (min-width:1100px){
  .app[data-view="theory"] .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:18px}
  .app[data-view="theory"] .card{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
}

sub{font-size:.72em;line-height:0}
.ov{text-decoration:overline;text-decoration-thickness:1.5px;text-underline-offset:0}
.ttwrap{overflow-x:auto;max-width:100%;margin:8px 0}
.tt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tt th,.tt td{border:1px solid var(--line);padding:3px 10px;text-align:center}
.tt th{background:var(--soft);font-weight:600}
.tt td.de{color:var(--muted)}
.tt td.o.one{color:var(--blue);font-weight:600}
.tt.tl td,.tt.tl th{text-align:left}
.duo{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-start}
details.gl{margin:4px 0}details.gl summary{cursor:pointer;color:var(--muted);font-size:.85rem}
details.gl ul,ul.gl2{margin:4px 0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 22px}
.cell.wide{width:11em;text-align:left}
.cell.expr{width:min(100%,26em);text-align:left;font-size:1.05rem}
.cell.warn{border-color:var(--amber)}
.insbar{display:flex;gap:6px;flex-wrap:wrap}
.ib{all:unset;box-sizing:border-box;cursor:pointer;min-width:2.4rem;text-align:center;padding:5px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);font:500 1rem var(--f-mono)}
.ib:hover{border-color:var(--blue)}.ib:focus-visible{outline:3px solid var(--blue)}
.rowsq{display:flex;flex-direction:column;gap:10px}
.rq{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:8px}
.rl{flex:1 1 18em;min-width:0}
.ro{display:flex;gap:6px}
.opt.sm{padding:6px 12px;font-size:.9rem;white-space:nowrap}
code.w{font:500 1rem var(--f-mono);background:var(--soft);padding:1px 8px;border-radius:6px;letter-spacing:.1em}
.mx.in th{font:500 .8rem var(--f-mono);color:var(--muted);padding:2px 6px}
.cell{width:3.6em}
.ln .cell.expr{width:min(100%,26em)}
/* --- MA: výrazy, limity, odmocniny, grafy --- */
.m{font-family:'STIX Two Text','Cambria Math','Times New Roman',serif;font-size:1.08em;white-space:nowrap}
.m em.vx,em.vx{font-style:italic}
.limw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:.25em}
.lims{font-size:.72em;margin-top:.15em}
.rt{display:inline-flex;align-items:stretch}
.rs{padding-right:1px}
.rb{border-top:1.5px solid currentColor;padding:0 .12em;margin-top:.12em}
div.rb{border-top:0;margin:.3em 0}
.plotw{max-width:460px;margin:8px 0}
svg.plot{display:block;width:100%;height:auto;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:8px}
svg.plot .gr{stroke:var(--rule);stroke-width:1}
svg.plot .ax{stroke:var(--fg);stroke-width:1.4}
svg.plot .as{stroke:var(--amber);stroke-width:1.3;stroke-dasharray:5 4;fill:none}
svg.plot .ln2{stroke:var(--green);stroke-width:1.8;fill:none}
svg.plot .fn{fill:none;stroke-width:2.2}
svg.plot .fn.c1,svg.plot .fn{stroke:var(--blue)}
svg.plot .fn.c2{stroke:var(--red)}
svg.plot .fn.c3{stroke:var(--green)}
svg.plot .fn.c4{stroke:var(--amber)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0}
.gf{margin:0;min-width:0}
.gf .plotw{margin:0}
.gf figcaption{font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.3}
svg.plot .pt{fill:var(--red);stroke:var(--card);stroke-width:1.5}
svg.plot .pl{fill:var(--fg);font:600 11px var(--f-body)}
svg.plot .tk{fill:var(--muted);font:10px var(--f-mono)}
.cell.wide{width:11em;text-align:left}
.cell.expr{width:min(100%,26em);text-align:left;font-size:1.05rem}
.cell.warn{border-color:var(--amber)}
.cell{width:5.2em}
.insbar{display:flex;gap:6px;flex-wrap:wrap}
.ib{all:unset;box-sizing:border-box;cursor:pointer;min-width:2.4rem;text-align:center;padding:5px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);font:500 1rem var(--f-mono)}
.ib:hover{border-color:var(--blue)}.ib:focus-visible{outline:3px solid var(--blue)}
.rowsq{display:flex;flex-direction:column;gap:10px}
.rq{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:8px}
.rl{flex:1 1 18em;min-width:0}
.ro{display:flex;gap:6px;flex-wrap:wrap}
.opt.sm{padding:6px 12px;font-size:.9rem;white-space:nowrap}
.ln .cell.expr{width:min(100%,26em)}
.opt .m{white-space:normal}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.topics{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;gap:8px}
  .tbtn{flex:0 0 auto;min-width:170px}
  .tbtn .s{display:none}
  h1{font-size:2.2rem}.card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>.backlink{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;padding:6px 12px 6px 10px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);transition:border-color .15s,color .15s}.backlink:hover{color:var(--blue);border-color:var(--blue)}.backlink:focus-visible{outline:3px solid var(--blue);outline-offset:2px}</style>
<div class="app" id="app" data-view="practice">
  <a class="backlink" href="../">← Cvičebnice</a>
  <header class="top">
    <div>
      <h1>Cvičebnica MA</h1>
      <p class="sub">Funkcie, limity, derivácie, Taylorov polynóm a priebeh funkcie. Každý príklad je nový.</p>
    </div>
    <div class="score" id="score"></div>
  </header>
  <div class="tabs" role="tablist" aria-label="Zobrazenie"><button class="tab" role="tab" id="tab-practice" aria-selected="true" data-v="practice">Cvičenie</button><button class="tab" role="tab" id="tab-theory" aria-selected="false" data-v="theory">Teória + cvičenie</button></div>
  <div class="layout">
    <nav class="topics" id="nav" aria-label="Témy"></nav>

      <details class="theory" id="theory"><summary></summary><div class="in"></div></details>
      <div class="split"><article class="tpane" id="tpane" aria-label="Teória"></article><section class="card" id="card" aria-live="off"></section></div>

  </div>
</div>
<style>
/* --- nadstavby: skúška, ťahák, kartičky, tlač --- */
.xv,#printarea{display:none}
.app[data-view="exam"] #xv-exam,.app[data-view="sheet"] #xv-sheet,.app[data-view="cards"] #xv-cards{display:block}
.app[data-view="exam"] .layout,.app[data-view="sheet"] .layout,.app[data-view="cards"] .layout{display:none}
.xcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px 20px;margin-bottom:14px}
.xcard h3,.xv h4{font:700 1.7rem/1.1 var(--f-display);color:var(--red);margin:0 0 6px}
.xv h4{font-size:1.3rem;color:var(--green);margin:14px 0 6px}
.xgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.xgrid{grid-template-columns:minmax(0,1fr)}}
.chks{display:flex;flex-direction:column;gap:4px}
.chk,.fld{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.chk input{margin-top:.3em;accent-color:var(--blue)}
.fld{flex-direction:column;gap:4px;margin:8px 0;font-weight:600}
.fld select{font:500 1rem var(--f-body);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:100%}
.xhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px;padding:10px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.xtime{font:600 1.3rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--blue)}.xtime.low{color:var(--red)}
.weak{margin:4px 0;padding-left:1.2em}
details.rev{background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin:8px 0;padding:0 14px}
details.rev summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none}
details.rev .mark{display:inline-block;width:1.5em;text-align:center;font-weight:700}
details.rev.ok{border-color:var(--green)}details.rev.ok .mark{color:var(--green)}
details.rev.bad{border-color:var(--red)}details.rev.bad .mark{color:var(--red)}
details.rev[open]{padding-bottom:12px}
.chl{margin:6px 0;padding-left:1.2em}.chl .right{color:var(--green)}
.golink{all:unset;cursor:pointer;margin-left:12px;color:var(--blue);text-decoration:underline;font-weight:500}
.golink:focus-visible{outline:3px solid var(--blue)}
label.focus{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:var(--muted);padding:6px 2px}
label.focus input{accent-color:var(--blue);margin-top:.2em}
.io{display:flex;flex-direction:column;gap:2px}
.sheetgrid{columns:2 320px;column-gap:20px}
.sheetgrid section{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:2px 14px 10px;margin:0 0 14px;font-size:.9rem}
.sheetgrid ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.flash{background:var(--soft);border-radius:12px;padding:18px 20px;margin:12px 0;min-height:7em}
.flash.back{border:2px solid var(--green)}
.flash .ans{margin:12px 0;padding:8px 12px;background:var(--ok-bg);border-radius:8px}
.lab{border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 14px 14px;margin:14px 0}
.lab h5{font:700 1.25rem var(--f-display);color:var(--red);margin:0 0 6px}
.lab .ctr{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:8px}
.lab label{display:grid;grid-template-columns:minmax(7em,auto) minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:.9rem}
.lab label b{font:500 .85rem var(--f-mono);text-align:right}
.lab input[type=range]{width:100%;accent-color:var(--blue)}
.lab select{font:500 .95rem var(--f-body);padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);max-width:100%}
.lab .out{margin-top:6px;font-size:.92rem;min-height:2.6em}
.lab .plotw{margin:0 auto}
.apl{border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 14px 14px;margin:12px 0}
.apl h5{font:700 1.25rem var(--f-display);color:var(--red);margin:0 0 6px}
.apl .wd{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.apl .wd span{min-width:2em;text-align:center;padding:3px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font:500 1rem var(--f-mono)}
.apl .wd span.cur{border-color:var(--blue);background:var(--blue);color:#fff}
.apl .wd span.done{color:var(--muted)}
.apl .st-out{font-size:.92rem;min-height:2.2em;margin:4px 0}
.apl .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.apl .ctl button{all:unset;cursor:pointer;padding:6px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-weight:600;font-size:.9rem}
.apl .ctl button:hover{border-color:var(--blue)}
.apl .ctl button:focus-visible{outline:3px solid var(--blue)}
svg.aut .st.on{fill:var(--blue);stroke:var(--blue)}
svg.aut .st.on ~ .sn,svg.aut .st.on ~ .so{fill:#fff}
svg.aut .e.on{stroke:var(--blue);stroke-width:3}
@media print{
  body{background:#fff!important;color:#000!important;padding:0!important;background-image:none!important}
  .app[data-view="sheet"]>*:not(#xv-sheet){display:none!important}
  .noprint{display:none!important}
  .sheetgrid{columns:2;column-gap:14px;font-size:9.5pt}
  .sheetgrid section{border:1px solid #888;background:#fff}
  body.ws .app{display:none!important}
  body.ws #printarea{display:block;font-size:11pt}
  #printarea h2{font:700 18pt var(--f-body);margin:0 0 6px}
  .wsq{break-inside:avoid;margin:0 0 14px;padding-bottom:8px;border-bottom:1px dashed #999}
  .wsl{margin-top:12px}
  .pbreak{break-after:page}
  #printarea .sol{display:none}
}

<script>
'use strict';
/* ===== Matematické jadro: výrazy (AST), parser, derivovanie, vykresľovanie vzorcov a grafov ===== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};

const sgn=v=>v>0?1:v<0?-1:0;

/* ---------- racionálne čísla pre zobrazenie ---------- */
function rat(v,maxq=5040,eps=1e-9){

  for(let i=0;i<40;i++){const a=Math.floor(b);[h1,h0]=[a*h1+h0,h1];[k1,k0]=[a*k1+k0,k1];
    if(k1>maxq)return null;
    if(Math.abs(x-h1/k1)<eps*Math.max(1,x))return{p:s*h1,q:k1};
    const f=b-a;if(f<1e-12)return null;b=1/f}
  return null}
const num=v=>String(v).replace('-','−').replace('.',',');
const dec=(v,d=6)=>num(+v.toFixed(d));
const frac=(p,q)=>`<span class="fr"><span>${p}</span><span>${q}</span></span>`;
/* číslo ako HTML: celé, zlomok alebo desatinné */
function fv(v,o={}){
  if(v===Infinity)return'∞';if(v===-Infinity)return'−∞';
  const r=rat(v);if(r){if(r.q===1)return num(r.p);return(r.p<0?'−':'')+frac(Math.abs(r.p),r.q)}
  return dec(v)}
/* číslo ako text do poľa */
function ftxt(v){if(v===Infinity)return'∞';if(v===-Infinity)return'-∞';const r=rat(v);if(r)return r.q===1?String(r.p):r.p+'/'+r.q;return String(+v.toFixed(6))}
/* násobok π ako HTML */
function fpi(v){const r=rat(v/Math.PI,360);if(!r)return dec(v);if(r.p===0)return'0';
  const sg=r.p<0?'−':'',p=Math.abs(r.p);
  if(r.q===1)return sg+(p===1?'':p)+'π';
  return sg+frac((p===1?'':p)+'π',r.q)}
function fpiTxt(v){const r=rat(v/Math.PI,360);if(!r)return String(+v.toFixed(6));if(r.p===0)return'0';const p=Math.abs(r.p);return(r.p<0?'-':'')+(p===1?'':p+'*')+'pi'+(r.q===1?'':'/'+r.q)}

/* ---------- AST ---------- */
const N=v=>({t:'n',v});
const X={t:'v'};
const C=n=>({t:'c',n});
const isN=(a,v)=>a.t==='n'&&(v===undefined||a.v===v);
const isInt=a=>a.t==='n'&&Number.isInteger(a.v);
const hasX=a=>a.t==='v'?true:a.t==='n'||a.t==='c'?false:a.t==='neg'?hasX(a.a):a.t==='f'?hasX(a.a):hasX(a.a)||hasX(a.b);

function neg(a){if(a.t==='n')return N(-a.v);if(a.t==='neg')return a.a;return{t:'neg',a}}
function add(a,b){

  if(isInt(a)&&isInt(b))return N(a.v+b.v);

const sameAst=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function factors(a,out){if(a.t==='op'&&a.o==='*'){factors(a.a,out);factors(a.b,out)}else out.push(a);return out}
const fcls=f=>(f.t==='v'||f.t==='c'||(f.t==='op'&&f.o==='^'&&f.a.t==='v'))?0:1;

  const fs=factors(b,factors(a,[]));let c=1;const rest=[];
  fs.forEach(f=>{if(f.t==='n')c*=f.v;else rest.push(f)});

  if(c<0)return neg(mulList(-c,rest));
  return mulList(c,rest)}
function mulList(c,rest){
  rest=rest.map((f,i)=>({f,i})).sort((x,y)=>fcls(x.f)-fcls(y.f)||x.i-y.i).map(o=>o.f);
  const arr=c===1?rest:[N(c),...rest];
  if(!arr.length)return N(1);
  return arr.reduce((x,y)=>({t:'op',o:'*',a:x,b:y}))}
function coefOf(a){if(a.t==='n'&&Number.isInteger(a.v))return[a.v,[]];if(a.t==='op'&&a.o==='*'){const fs=factors(a,[]);if(fs[0].t==='n'&&Number.isInteger(fs[0].v))return[fs[0].v,fs.slice(1)]}return null}
function div(a,b){
  if(isN(a,0))return N(0);if(isN(b,1))return a;
  if(b.t==='neg')return neg(div(a,b.a));if(a.t==='neg')return neg(div(a.a,b));
  if(sameAst(a,b))return N(1);
  {const ca=coefOf(a),cb=coefOf(b);if(ca&&cb&&!(isInt(a)&&isInt(b))){const g=gcd(ca[0],cb[0]);if(g>1)return div(mulList(ca[0]/g,ca[1]),mulList(cb[0]/g,cb[1]))}}

    if(q===1)return N(p);return p<0?neg({t:'op',o:'/',a:N(-p),b:N(q)}):{t:'op',o:'/',a:N(p),b:N(q)}}
  return{t:'op',o:'/',a,b}}
function pow(a,b){
  if(isN(b,0))return N(1);if(isN(b,1))return a;
  if(isN(a,1))return N(1);
  if(isInt(a)&&isInt(b)&&b.v>0&&Math.abs(Math.pow(a.v,b.v))<1e9)return N(Math.pow(a.v,b.v));
  return{t:'op',o:'^',a,b}}
const fn=(n,a)=>({t:'f',n,a});

const PI=C('pi');
const sqrtN=a=>fn('sqrt',a);

/* ---------- číselné vyhodnotenie ---------- */
const FJS={sin:Math.sin,cos:Math.cos,tg:Math.tan,ctg:u=>1/Math.tan(u),ln:Math.log,sqrt:Math.sqrt,abs:Math.abs,
  arcsin:Math.asin,arccos:Math.acos,arctg:Math.atan,arccotg:u=>Math.PI/2-Math.atan(u),
  sinh:Math.sinh,cosh:Math.cosh,th:Math.tanh,cth:u=>1/Math.tanh(u)};
function powN(u,v){
  if(u<0&&!Number.isInteger(v)){const r=rat(v,99);if(r&&r.q%2===1)return(r.p%2===0?1:-1)*Math.pow(-u,v);return NaN}
  return Math.pow(u,v)}
function ev(a,x){
  switch(a.t){
    case'n':return a.v;case'v':return x;case'c':return a.n==='pi'?Math.PI:Math.E;
    case'neg':return-ev(a.a,x);
    case'op':{const u=ev(a.a,x),v=ev(a.b,x);
      switch(a.o){case'+':return u+v;case'-':return u-v;case'*':return u*v;case'/':return u/v;default:return powN(u,v)}}
    case'f':return FJS[a.n](ev(a.a,x))}}
const fnOf=a=>x=>ev(a,x);

/* ---------- parser (vstup od používateľa aj zápis šablón) ---------- */
const NAMES=['arccotg','arcctg','arcsin','arccos','arctan','arctg','arccot','sinh','cosh','tanh','coth','sqrt','cotg','sin','cos','tan','ctg','cot','abs','exp','th','cth','tg','ln','pi','e','x'];
const FNMAP={sin:'sin',cos:'cos',tg:'tg',tan:'tg',ctg:'ctg',cotg:'ctg',cot:'ctg',ln:'ln',sqrt:'sqrt',abs:'abs',arcsin:'arcsin',arccos:'arccos',arctg:'arctg',arctan:'arctg',arccotg:'arccotg',arcctg:'arccotg',arccot:'arccotg',sinh:'sinh',cosh:'cosh',th:'th',tanh:'th',cth:'cth',coth:'cth',exp:'exp'};
function tokenize(src){
  let s=String(src).toLowerCase().replace(/[−–—]/g,'-').replace(/[·×⋅]/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'');
  const out=[];let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/[0-9.]/.test(ch)){const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(!m)throw new Error('zlé číslo');out.push({k:'num',v:parseFloat(m[1])});i+=m[1].length;continue}
    if('+-*/^()'.includes(ch)){out.push({k:'op',v:ch});i++;continue}
    if(/[a-z]/.test(ch)){const nm=NAMES.find(n=>s.startsWith(n,i));if(!nm)throw new Error(`neznámy symbol „${s.slice(i).match(/^[a-z]+/)[0]}“`);out.push({k:'id',v:nm});i+=nm.length;continue}
    throw new Error(`neznámy znak „${ch}“`)}
  return out}
function parseExpr(src){
  const T=tokenize(src);let i=0;
  if(!T.length)throw new Error('prázdny výraz');
  const peek=()=>T[i],eat=()=>T[i++];
  const isOp=(t,v)=>t&&t.k==='op'&&t.v===v;
  const starts=t=>t&&(t.k==='num'||t.k==='id'||isOp(t,'('));
  function expr(){let a=term();for(;;){const t=peek();if(isOp(t,'+')){eat();a=add(a,term())}else if(isOp(t,'-')){eat();a=sub(a,term())}else break}return a}
  function term(){let a=unary();for(;;){const t=peek();if(!t)break;
    if(isOp(t,'*')){eat();a=mul(a,unary())}else if(isOp(t,'/')){eat();a=div(a,unary())}
    else if(starts(t)){a=mul(a,unary())}else break}return a}
  function unary(){const t=peek();if(isOp(t,'-')){eat();return neg(unary())}if(isOp(t,'+')){eat();return unary()}return power()}
  function expo(){const t=peek();if(isOp(t,'-')){eat();return neg(expo())}if(isOp(t,'+')){eat();return expo()}return power()}
  function power(){const b=primary();if(isOp(peek(),'^')){eat();return pow(b,expo())}return b}
  function arg(){if(isOp(peek(),'(')){eat();const a=expr();if(!isOp(peek(),')'))throw new Error('chýba zátvorka )');eat();return a}return power()}
  function primary(){
    const t=eat();if(!t)throw new Error('výraz sa náhle končí');
    if(t.k==='num')return N(t.v);
    if(isOp(t,'(')){const a=expr();if(!isOp(peek(),')'))throw new Error('chýba zátvorka )');eat();return a}
    if(t.k==='id'){
      if(t.v==='x')return X;if(t.v==='pi')return PI;if(t.v==='e')return E;

      if(isOp(peek(),'^')&&name!=='exp'){eat();ex=expo()}

  const r=expr();if(i<T.length)throw new Error(`nečakaný znak „${T[i].v}“`);return r}
const P=s=>parseExpr(s);

/* hodnota konštantného výrazu pre číselné polia: čísla, zlomky, odmocniny, π, e, ln, ±∞ */
function parseVal(s){
  s=String(s).trim();if(!s)return null;
  const t=s.toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'');
  if(/^(\+?(inf|oo|∞))$/.test(t))return Infinity;if(/^-(inf|oo|∞)$/.test(t))return-Infinity;
  if(/^(nex|neexistuje|∄|dne)$/.test(t))return'nex';
  try{const a=parseExpr(s);if(hasX(a))return null;const v=ev(a,0);return Number.isFinite(v)?v:null}catch(e){return null}}

/* ---------- derivovanie ---------- */
const fprime={
  sin:(u)=>fn('cos',u),cos:(u)=>neg(fn('sin',u)),
  tg:(u)=>div(N(1),pow(fn('cos',u),N(2))),ctg:(u)=>neg(div(N(1),pow(fn('sin',u),N(2)))),
  sinh:(u)=>fn('cosh',u),cosh:(u)=>fn('sinh',u),th:(u)=>div(N(1),pow(fn('cosh',u),N(2))),cth:(u)=>neg(div(N(1),pow(fn('sinh',u),N(2))))};
function D(a){
  switch(a.t){
    case'n':case'c':return N(0);
    case'v':return N(1);
    case'neg':return neg(D(a.a));
    case'op':{const u=a.a,v=a.b;
      if(a.o==='+')return add(D(u),D(v));
      if(a.o==='-')return sub(D(u),D(v));

      if(isConst(u)){const k=(u.t==='c'&&u.n==='e')?N(1):fn('ln',u);return mul(mul(a,k),D(v))}
      return mul(a,add(mul(D(v),fn('ln',u)),div(mul(v,D(u)),u)))}
    case'f':{const u=a.a,du=D(u);
      let g;
      switch(a.n){
        case'ln':return div(du,u);
        case'sqrt':return div(du,mul(N(2),a));
        case'arcsin':return div(du,sqrtN(sub(N(1),pow(u,N(2)))));
        case'arccos':return neg(div(du,sqrtN(sub(N(1),pow(u,N(2))))));
        case'arctg':return div(du,add(N(1),pow(u,N(2))));
        case'arccotg':return neg(div(du,add(N(1),pow(u,N(2)))));

      return mul(du,g)}}}
const Dn=(a,n)=>{for(let i=0;i<n;i++)a=D(a);return a};
function subst(a,r){
  switch(a.t){case'v':return r;case'n':case'c':return a;case'neg':return neg(subst(a.a,r));
    case'f':return fn(a.n,subst(a.a,r));
    case'op':{const x=subst(a.a,r),y=subst(a.b,r);return a.o==='+'?add(x,y):a.o==='-'?sub(x,y):a.o==='*'?mul(x,y):a.o==='/'?div(x,y):pow(x,y)}}}
/* polynóm z koeficientov (od najvyššieho) */
function polyAst(co){const n=co.length-1;let r=N(0);
  co.forEach((c,i)=>{const k=n-i;if(c===0)return;let t=k===0?N(Math.abs(c)):mul(N(Math.abs(c)),k===1?X:pow(X,N(k)));if(c<0&&r.t==='n'&&r.v===0)r=neg(t);else r=c<0?sub(r,t):add(r,t)});return r}

/* ---------- zobrazenie vzorcov (HTML) ---------- */
const fmtNum=v=>num(v);

function leftmost(a){return a.t==='op'&&(a.o==='*'||a.o==='^')?leftmost(a.a):a}
function H(a,p=0){
  let s,q;
  switch(a.t){
    case'n':if(a.v<0){s='−'+fmtNum(-a.v);q=1.5}else{s=fmtNum(a.v);q=5}break;
    case'v':s='<em class="vx">x</em>';q=5;break;

    case'neg':s='−'+H(a.a,2);q=1.5;break;
    case'f':
      if(a.n==='sqrt'){s=`<span class="rt"><span class="rs">√</span><span class="rb">${H(a.a,0)}</span></span>`;q=5;break}
      {const nm=FNAME[a.n]||a.n;const ar=a.a.t==='v'||(a.a.t==='n'&&a.a.v>=0)?H(a.a,5):`(${H(a.a,0)})`;s=`${nm}&#8239;${ar}`;q=4.8}break;
    case'op':{
      const x=a.a,y=a.b;
      if(a.o==='+'){const yn=y.t==='neg'||(y.t==='n'&&y.v<0);s=yn?`${H(x,1)} − ${H(y.t==='neg'?y.a:N(-y.v),2)}`:`${H(x,1)} + ${H(y,1)}`;q=1;break}
      if(a.o==='-'){s=`${H(x,1)} − ${H(y,2)}`;q=1;break}
      if(a.o==='*'){const l=leftmost(y);const dig=l.t==='n'||(l.t==='op'&&l.o==='/');
        const sep=(x.t==='n'&&!dig)?'':dig?' · ':'&#8239;';
        s=`${H(x,2)}${sep}${H(y,2.1)}`;q=2;break}
      if(a.o==='/'){s=frac(H(x,0),H(y,0));q=4;break}
      // mocnina

function niceStep(r){const raw=r/5,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
/* o: {fns:[{f,cls}], xr:[a,b], yr?:[c,d], pts:[{x,y,l,cls}], vl:[x], hl:[y], lines:[{k,q,cls}] } */
function plot(o){
  const W=o.W||420,Hh=o.H||250,pad={l:30,r:12,t:12,b:22};
  const [x0,x1]=o.xr;let ymin=Infinity,ymax=-Infinity;
  const samp=(f)=>{const out=[];const n=320;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;let y;try{y=f(x)}catch(e){y=NaN}out.push([x,y])}return out};
  const all=o.fns.map(g=>({g,pts:samp(g.f)}));
  if(o.yr){[ymin,ymax]=o.yr}else{
    const ys=all[0].pts.map(p=>p[1]).filter(Number.isFinite).sort((a,b)=>a-b);
    if(!ys.length)return'';const lo=ys[Math.floor(ys.length*0.03)],hi=ys[Math.ceil(ys.length*0.97)-1];
    ymin=lo;ymax=hi;(o.pts||[]).forEach(p=>{ymin=Math.min(ymin,p.y);ymax=Math.max(ymax,p.y)});
    const m=(ymax-ymin||1)*0.12;ymin-=m;ymax+=m}
  if(ymin>0&&ymin<(ymax-ymin)*0.5)ymin=Math.min(ymin,-0.05*(ymax-ymin));
  if(ymax<0&&-ymax<(ymax-ymin)*0.5)ymax=Math.max(ymax,0.05*(ymax-ymin));
  const sx=x=>pad.l+(x-x0)/(x1-x0)*(W-pad.l-pad.r),sy=y=>Hh-pad.b-(y-ymin)/(ymax-ymin)*(Hh-pad.t-pad.b);
  const clipY=y=>Math.max(-1e4,Math.min(1e4,y));
  let s=`<svg class="plot" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${o.label||'graf funkcie'}">`;
  const sxs=niceStep(x1-x0),sys=niceStep(ymax-ymin);
  for(let x=Math.ceil(x0/sxs)*sxs;x<=x1+1e-9;x+=sxs){const X_=sx(x);s+=`<line class="gr" x1="${X_}" y1="${pad.t}" x2="${X_}" y2="${Hh-pad.b}"/>`;if(Math.abs(x)>1e-9)s+=`<text class="tk" x="${X_}" y="${Hh-pad.b+13}" text-anchor="middle">${+x.toFixed(6)}</text>`}
  for(let y=Math.ceil(ymin/sys)*sys;y<=ymax+1e-9;y+=sys){const Y_=sy(y);s+=`<line class="gr" x1="${pad.l}" y1="${Y_}" x2="${W-pad.r}" y2="${Y_}"/>`;if(Math.abs(y)>1e-9)s+=`<text class="tk" x="${pad.l-4}" y="${Y_+3}" text-anchor="end">${+y.toFixed(6)}</text>`}
  if(x0<0&&x1>0)s+=`<line class="ax" x1="${sx(0)}" y1="${pad.t}" x2="${sx(0)}" y2="${Hh-pad.b}"/>`;
  if(ymin<0&&ymax>0)s+=`<line class="ax" x1="${pad.l}" y1="${sy(0)}" x2="${W-pad.r}" y2="${sy(0)}"/>`;
  (o.vl||[]).forEach(x=>{s+=`<line class="as" x1="${sx(x)}" y1="${pad.t}" x2="${sx(x)}" y2="${Hh-pad.b}"/>`});
  (o.hl||[]).forEach(y=>{s+=`<line class="as" x1="${pad.l}" y1="${sy(y)}" x2="${W-pad.r}" y2="${sy(y)}"/>`});
  (o.lines||[]).forEach(l=>{const a1=l.k*x0+l.q,a2=l.k*x1+l.q;s+=`<path class="${l.cls||'as'}" d="M${sx(x0)} ${sy(a1)}L${sx(x1)} ${sy(a2)}"/>`});
  all.forEach(({g,pts})=>{let d='',pen=false,prev=null;
    pts.forEach(([x,y])=>{
      if(!Number.isFinite(y)||y>ymax+(ymax-ymin)*3||y<ymin-(ymax-ymin)*3){pen=false;prev=null;return}
      if(prev!==null&&Math.abs(y-prev)>(ymax-ymin)*1.5){pen=false}
      d+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(clipY(y)).toFixed(1);pen=true;prev=y});
    s+=`<path class="fn ${g.cls||''}" d="${d}"/>`});
  (o.inv||[]).forEach(g=>{let d='',pen=false;samp(g.f).forEach(([t,y])=>{if(!Number.isFinite(y)||y<x0-(x1-x0)||y>x1+(x1-x0)){pen=false;return}d+=(pen?'L':'M')+sx(y).toFixed(1)+' '+sy(t).toFixed(1);pen=true});s+=`<path class="fn ${g.cls||''}" d="${d}"/>`});
  (o.pts||[]).forEach(p=>{s+=`<circle class="pt ${p.cls||''}" cx="${sx(p.x)}" cy="${sy(p.y)}" r="4"/>`;if(p.l)s+=`<text class="pl" x="${sx(p.x)+6}" y="${sy(p.y)-6}">${p.l}</text>`});
  return s+'</svg>'}

function gParity(){
  const ev_=['x^2','x^4','cos(x)','cosh(x)','x*sin(x)','x^2+1','e^(x^2)','ln(x^2+1)','1/(x^2+1)','x^6-x^2'];
  const od_=['x','x^3','x^5','sin(x)','tg(x)','arctg(x)','sinh(x)','x*cos(x)','x/(x^2+1)','x^3-x'];
  const ne_=['e^x','x+1','x^2+x','sqrt(x+4)','ln(x+3)','(x-1)^2','x^3+x^2','sin(x)+2'];
  const co=()=>rnd(1,3);
  const wc=(s,c)=>c===1?`(${s})`:`${c}*(${s})`;
  const kind=pick(['e','e','o','o','n','n']);
  let s,why;
  if(kind==='e'){const v=rnd(0,2);
    if(v===0){const [a,b]=shuffle(ev_).slice(0,2);s=`${wc(a,co())}+${wc(b,co())}`;why='Súčet dvoch párnych funkcií je párna funkcia.'}
    else if(v===1){const [a,b]=shuffle(ev_.slice(0,5)).slice(0,2);s=`${wc(a,1)}*${wc(b,1)}`;why='Súčin dvoch párnych funkcií je párna funkcia.'}
    else{const [a,b]=shuffle(od_).slice(0,2);s=`${wc(a,1)}*${wc(b,1)}`;why='Súčin dvoch nepárnych funkcií je párna funkcia (mínus krát mínus je plus).'}}
  else if(kind==='o'){
    if(rnd(0,1)===0){const [a,b]=shuffle(od_).slice(0,2);s=`${wc(a,co())}+${wc(b,co())}`;why='Súčet dvoch nepárnych funkcií je nepárna funkcia.'}
    else{const a=pick(ev_.slice(0,5)),b=pick(od_.slice(0,7));s=`${wc(a,1)}*${wc(b,1)}`;why='Súčin párnej a nepárnej funkcie je nepárna funkcia.'}}
  else{
    if(rnd(0,1)===0){s=pick(ne_);why='Po dosadení −x nevznikne ani f(x), ani −f(x).'}
    else{const a=pick(ev_.slice(0,5)),b=pick(od_.slice(0,7));s=`${a}+${b}`;why='Súčet párnej a nepárnej funkcie (ani jedna nie je nulová) nie je ani párna, ani nepárna.'}}
  const f=P(s),F=fnOf(f);let isE=true,isO=true,fin=true;
  [0.4,0.9,1.3,1.7,2.2].forEach(x=>{const u=F(x),w=F(-x);if(!isFinite(u)||!isFinite(w)){fin=false;return}
    if(Math.abs(u-w)>1e-9*Math.max(1,Math.abs(u)))isE=false;if(Math.abs(u+w)>1e-9*Math.max(1,Math.abs(u)))isO=false});
  if(!fin||(isE&&isO))return null;
  const ans=isE?0:isO?1:2;
  const mf=subst(f,neg(X));
  const concl=['f(−x) = f(x), funkcia je párna.','f(−x) = −f(x), funkcia je nepárna.','Neplatí ani f(−x) = f(x), ani f(−x) = −f(x), funkcia nie je ani párna, ani nepárna.'][ans];
  return fixedChoice('Párnosť funkcie',`Rozhodni, či je funkcia ${FX(f)} párna, nepárna, alebo ani jedno.`,['párna','nepárna','ani párna, ani nepárna'],ans,
    p_(`Dosadíme −x: ${MQ(mf)}.`)+p_(why)+p_(concl)+gfig({fns:[{f:x=>ev(f,x),cls:'c1'}],xr:[-4,4],label:'graf funkcie'},ans===0?'Graf je súmerný podľa osi y.':ans===1?'Graf je súmerný podľa počiatku.':'Graf nemá ani jednu z týchto súmerností.'))}

function gCompose(){

function gInverse(){
  const T=[
    ()=>{const a=pick([2,3,4,-2,-3]),b=rnd(-5,5)||1;const f=add(mul(N(a),X),N(b));const g=div(sub(X,N(b)),N(a));
      return{f,g,st:[`y = ${H(f)}`,`${nn(a)}x = y ${b>0?'−':'+'} ${Math.abs(b)}`,`x = (y ${b>0?'−':'+'} ${Math.abs(b)}) / ${par(a)}`]}},
    ()=>{let a,b,c,d;do{a=rnd(-3,4);b=rnd(-3,4);c=pick([1,2,3,-1,-2]);d=rnd(-3,3)}while(!a||a*d-b*c===0||!b);
      const f=div(add(mul(N(a),X),N(b)),add(mul(N(c),X),N(d)));const g=div(sub(mul(N(d),X),N(b)),sub(N(a),mul(N(c),X)));
      return{f,g,st:['y(cx + d) = ax + b','y·cx + y·d = ax + b','x(cy − a) = b − dy','x = (dy − b)/(a − cy)']}},
    ()=>{const a=pick([1,2,3]),b=rnd(-3,-1);const f=add(mul(N(a),pow(E,X)),N(b));const g=fn('ln',div(sub(X,N(b)),N(a)));
      return{f,g,st:['y = a·eˣ + b','eˣ = (y − b)/a','x = ln((y − b)/a)']}},
    ()=>{const a=rnd(1,4),b=rnd(-3,3);const f=add(fn('ln',add(X,N(a))),N(b));const g=sub(pow(E,sub(X,N(b))),N(a));
      return{f,g,st:['y = ln(x + a) + b','y − b = ln(x + a)','x + a = e<sup>y − b</sup>','x = e<sup>y − b</sup> − a']}},
    ()=>{const a=rnd(1,5);const f=sqrtN(sub(X,N(a)));const g=add(pow(X,N(2)),N(a));
      return{f,g,st:['y = √(x − a), y ≥ 0','y² = x − a','x = y² + a'],note:'Funkcia je definovaná pre x ≥ '+a+' a má hodnoty y ≥ 0, preto f⁻¹ uvažujeme na x ≥ 0.'}},
    ()=>{const b=rnd(-4,4)||2;const f=add(pow(X,N(3)),N(b));const g=pow(sub(X,N(b)),div(N(1),N(3)));
      return{f,g,st:['y = x³ + b','x³ = y − b','x = ∛(y − b)']}},
    ()=>{const b=rnd(1,4);const f=sub(pow(X,N(2)),N(b));const g=sqrtN(add(X,N(b)));
      return{f,g,st:['y = x² − b, x ≥ 0','x² = y + b','x = √(y + b)'],note:'Funkcia je daná pre x ≥ 0 (inak by nebola prostá), preto berieme kladnú odmocninu.',dom:0}},
    ()=>{const a=rnd(1,4),b=rnd(-3,3);const f=add(div(N(1),add(X,N(a))),N(b));const g=sub(div(N(1),sub(X,N(b))),N(a));
      return{f,g,st:['y = 1/(x + a) + b','y − b = 1/(x + a)','x + a = 1/(y − b)','x = 1/(y − b) − a']}}
  ];
  let t,tries=0;
  do{t=pick(T)();tries++;
    const ok=XS.filter(x=>{const y=ev(t.g,x);return isFinite(y)&&Math.abs(ev(t.f,y)-x)<1e-7*Math.max(1,x)}).length;
    if(ok>=10)break;t=null}while(tries<30);
  if(!t)return null;
  return{kind:'Inverzná funkcia',prompt:p_(`Nájdi inverznú funkciu f⁻¹(<i>x</i>) k funkcii ${FX(t.f)}.`)+(t.note?p_(`<span class="muted">${t.note}</span>`):'')+p_(`<span class="muted">Zápis napríklad <kbd>ln(x-1)</kbd>, <kbd>(x-3)/2</kbd>, <kbd>sqrt(x+2)</kbd>.</span>`),
    input:{t:'expr'},check:s=>checkFn(s,x=>ev(t.g,x)),ref:MQ(t.g),refAst:t.g,
    solution:p_('Rovnicu y = f(x) vyriešime vzhľadom na x a potom premenné <i>x</i> a <i>y</i> vymeníme.')+t.st.map(x=>`<div class="eq"><span class="m">${x}</span></div>`).join('')+p_(`Po výmene premenných: f⁻¹(<i>x</i>) = ${MQ(t.g)}.`)+p_('<span class="muted">Kontrola: f⁻¹(f(x)) = x. Grafy f a f⁻¹ sú súmerné podľa priamky y = x.</span>')+gfig({W:280,H:280,xr:[-6,6],yr:[-6,6],fns:[{f:x=>(t.dom!=null&&x<t.dom)?NaN:ev(t.f,x),cls:'c1'}],inv:[{f:x=>(t.dom!=null&&x<t.dom)?NaN:ev(t.f,x),cls:'c2'}],lines:[{k:1,q:0,cls:'as'}],label:'graf funkcie, inverznej funkcie a priamky y = x'},'Modrá: f, červená: f⁻¹, prerušovaná: y = x.')}}

function gEqualFn(){
  const a=rnd(2,5),b=rnd(1,4);
  const T=[
    {f:div(sub(pow(X,N(2)),N(a*a)),sub(X,N(a))),g:add(X,N(a)),eq:false,why:`D(f) = ℝ ∖ {${a}}, ale D(g) = ℝ. Definičné obory sa líšia, funkcie sa nerovnajú (graf f má v bode ${a} „dieru“).`},
    {f:add(pow(fn('sin',X),N(2)),pow(fn('cos',X),N(2))),g:N(1),eq:true,why:'Obe majú D = ℝ a sin²x + cos²x = 1 pre každé x.'},
    {f:sqrtN(pow(X,N(2))),g:X,eq:false,why:'D(f) = D(g) = ℝ, ale √(x²) = |x|. Pre x < 0 je f(x) ≠ g(x), napríklad f(−1) = 1, g(−1) = −1.'},
    {f:sqrtN(pow(X,N(2))),g:fn('abs',X),eq:true,why:'Obe majú D = ℝ a √(x²) = |x| pre každé x.'},
    {f:fn('ln',pow(X,N(2))),g:mul(N(2),fn('ln',X)),eq:false,why:'D(f) = ℝ ∖ {0}, ale D(g) = (0, ∞). Definičné obory sa líšia.'},
    {f:fn('ln',pow(X,N(2))),g:mul(N(2),fn('ln',fn('abs',X))),eq:true,why:'Obe majú D = ℝ ∖ {0} a ln(x²) = 2 ln|x| pre každé x ≠ 0.'},
    {f:pow(E,fn('ln',X)),g:X,eq:false,why:'D(f) = (0, ∞), ale D(g) = ℝ. Definičné obory sa líšia.'},
    {f:fn('ln',pow(E,X)),g:X,eq:true,why:'Obe majú D = ℝ a ln(eˣ) = x.'},
    {f:div(X,X),g:N(1),eq:false,why:'D(f) = ℝ ∖ {0}, ale D(g) = ℝ. Definičné obory sa líšia.'},
    {f:div(sub(pow(X,N(2)),N(1)),add(X,N(1))),g:sub(X,N(1)),eq:false,why:'D(f) = ℝ ∖ {−1}, ale D(g) = ℝ. Definičné obory sa líšia.'},
    {f:pow(sqrtN(X),N(2)),g:X,eq:false,why:'D(f) = ⟨0, ∞), ale D(g) = ℝ. Definičné obory sa líšia.'},
    {f:fn('tg',X),g:div(fn('sin',X),fn('cos',X)),eq:true,why:'Obe sú definované práve pre cos x ≠ 0 a tg x = sin x / cos x.'},
    {f:pow(add(X,N(b)),N(2)),g:polyAst([1,2*b,b*b]),eq:true,why:`Obe majú D = ℝ a (x + ${b})² = x² + ${2*b}x + ${b*b}.`}
  ];
  const t=pick(T);
  return fixedChoice('Rovnosť funkcií',`Rovnajú sa funkcie ${FX(t.f,'f')} a ${FX(t.g,'g')}?`,['Áno, funkcie sa rovnajú','Nie, funkcie sa nerovnajú'],t.eq?0:1,
    p_('Funkcie sa rovnajú, ak majú rovnaký definičný obor a pre každé x z neho rovnakú hodnotu.')+p_(t.why))}

const concFun=conc('Teória: funkcie',[
  {q:'Funkcia f je prostá, ak pre všetky x₁, x₂ ∈ D(f) platí:',o:['f(x₁) = f(x₂) ⇒ x₁ = x₂','x₁ = x₂ ⇒ f(x₁) = f(x₂)','x₁ < x₂ ⇒ f(x₁) < f(x₂)','f(−x₁) = f(x₁)'],s:p_('Prostá funkcia nadobúda každú hodnotu najviac raz: z rovnosti obrazov vyplýva rovnosť vzorov. Implikácia „x₁ = x₂ ⇒ f(x₁) = f(x₂)“ platí pre každú funkciu.')},
  {q:'Ktorá z týchto funkcií nie je prostá?',o:['f(x) = x²','f(x) = 2x + 1','f(x) = eˣ','f(x) = x³'],s:p_('Vodorovná priamka y = 4 pretne graf x² v dvoch bodoch (x = ±2), preto x² na ℝ nie je prostá.')},
  {q:'Grafy navzájom inverzných funkcií sú súmerné podľa:',o:['priamky y = x','osi y','začiatku súradníc','osi x'],s:p_('Inverzná funkcia vymení úlohu x a y, preto sú grafy súmerné podľa osi prvého a tretieho kvadrantu, y = x.')},
  {q:'Pre inverznú funkciu f⁻¹ platí:',o:['D(f⁻¹) = H(f)','D(f⁻¹) = D(f)','H(f⁻¹) = H(f)','D(f⁻¹) = ℝ'],s:p_('Definičný obor inverznej funkcie je obor hodnôt pôvodnej funkcie a naopak: D(f⁻¹) = H(f), H(f⁻¹) = D(f).')},
  {q:'Graf nepárnej funkcie je súmerný podľa:',o:['začiatku súradníc','osi y','osi x','priamky y = x'],s:p_('Nepárna funkcia spĺňa f(−x) = −f(x), preto bod [x, y] leží na grafe spolu s bodom [−x, −y]. Graf párnej funkcie je súmerný podľa osi y.')},
  {q:'Je funkcia f(x) = 1/x klesajúca na celom definičnom obore ℝ ∖ {0}?',o:['Nie, klesá len na (−∞, 0) a na (0, ∞) zvlášť','Áno, na celom D(f)','Nie, je rastúca','Áno, lebo je nepárna'],s:p_('Pre −1 < 1 máme f(−1) = −1 < 1 = f(1), takže na zjednotení intervalov klesajúca nie je. Klesá na každom z intervalov zvlášť.')},
  {q:'Funkcia f je periodická s periódou T > 0, ak pre všetky x ∈ D(f) platí:',o:['f(x + T) = f(x)','f(x + T) = f(x) + T','f(T·x) = f(x)','f(x + T) = −f(x)'],s:p_('Periodická funkcia sa po posunutí o T opakuje. Najmenšie také T je základná perióda.')},
  {q:'Funkcia je konvexná na intervale I, ak spojnica ľubovoľných dvoch bodov grafu leží:',o:['nad grafom','pod grafom','na grafe','pod osou x'],s:p_('Konvexná funkcia (napr. x²) leží pod svojimi sečnicami. Konkávna (napr. ln x) nad nimi.')},
  {q:'Existuje funkcia, ktorá je párna aj nepárna súčasne?',o:['Áno, napríklad f(x) = 0','Nie, žiadna','Áno, napríklad f(x) = 1','Áno, každá konštantná funkcia'],s:p_('Z f(−x) = f(x) a f(−x) = −f(x) vyplýva f(x) = −f(x), teda f(x) = 0 pre každé x ∈ D(f). Funkcia f(x) = 0 je jediná taká.')},
  {q:'Každá vodorovná priamka pretne graf prostej funkcie:',o:['najviac v jednom bode','aspoň v jednom bode','práve v dvoch bodoch','v nekonečne veľa bodoch'],s:p_('To je geometrický test prostosti: ak by niektorá vodorovná priamka pretla graf dvakrát, funkcia by nadobúdala jednu hodnotu pre dve rôzne x.')},
  {q:'Čo znamená zápis (f ∘ g)(x) v prednáškach?',o:['f(g(x))','g(f(x))','f(x) · g(x)','f(x) + g(x)'],s:p_('Vonkajšia zložka je f, vnútorná g. Niektorí autori používajú opačné poradie, preto treba vždy skontrolovať definíciu.')},
  {q:'Inflexný bod funkcie f je bod, v ktorom:',o:['sa mení konvexnosť na konkávnosť alebo naopak','má funkcia lokálne maximum','je funkcia nespojitá','sa mení rastúcosť na klesanie'],s:p_('Inflexia je zmena zakrivenia grafu. Zmena rastu na klesanie je lokálny extrém.')},
  {q:'Funkcia f je rastúca na I, ak pre x₁, x₂ ∈ I platí:',o:['x₁ < x₂ ⇒ f(x₁) < f(x₂)','x₁ < x₂ ⇒ f(x₁) > f(x₂)','f(x₁) = f(x₂)','f(x₁) < f(x₂) ⇒ x₁ > x₂'],s:p_('Väčšiemu argumentu zodpovedá väčšia hodnota. Pri „≤“ hovoríme o neklesajúcej funkcii.')}
]);

/* ======================================================================
   2. POLYNÓMY A RACIONÁLNE FUNKCIE
   ====================================================================== */
function powTxt(k){return k===0?'':k===1?'x':`x<sup>${k}</sup>`}
function gHorner(){
  const n=rnd(3,4);let co;
  do{co=Array.from({length:n+1},()=>rnd(-6,6))}while(co[0]===0||co.slice(1).every(c=>c===0));
  if(co[0]<0&&Math.random()<.6)co=co.map(c=>-c);
  const r=pick([-3,-2,-1,1,2,3]);
  const b=[co[0]];for(let i=1;i<=n;i++)b.push(co[i]+r*b[i-1]);
  const lines=[['Koeficienty podielu (od najvyššieho stupňa): ',...Array(n).fill(null)],[`Zvyšok, teda P(${nn(r)}) = `,null]];
  const head=[''].concat(co.map(c=>nn(c)));
  const row2=[nn(r)].concat(b.map((v,i)=>i===n?`<b>${nn(v)}</b>`:nn(v)));
  const steps=b.map((v,i)=>i===0?`${nn(co[0])}`:`${nn(co[i])} + ${par(r)}·${par(b[i-1])} = ${nn(v)}`).join(';&nbsp; ');
  return{kind:'Hornerova schéma',prompt:p_(`Pomocou Hornerovej schémy vydeľ polynóm ${FX(polyAst(co),'P')} výrazom ${MQ(xm(r))}. Zisti aj hodnotu P(${nn(r)}).`),
    input:{t:'lines',lines},answer:b,
    solution:p_('Pod koeficienty napíšeme prvý koeficient. Každé ďalšie číslo je koeficient plus násobok r predchádzajúceho čísla v spodnom riadku.')+tblh(head,[row2])+p_(`<span class="muted">${steps}</span>`)+
      p_(`Podiel: ${MQ(polyAst(b.slice(0,n)))}, zvyšok ${nn(b[n])}, teda P(${nn(r)}) = ${nn(b[n])}.`)+(b[n]===0?p_(`Keďže zvyšok je 0, číslo ${nn(r)} je koreňom polynómu a P(x) = (x ${sg(-r)} ${Math.abs(r)})·(${H(polyAst(b.slice(0,n)))}).`):'')}}

const divisors=n=>{n=Math.abs(n);const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d};
function gIntRoots(){
  const k=pick([3,3,4]);let roots;
  do{roots=uniq(Array.from({length:k},()=>pick([-5,-4,-3,-2,-1,1,2,3,4,5,6])))}while(roots.length<k);
  roots.sort((a,b)=>a-b);
  const lead=pick([1,1,-1]);const co=polyFromRoots(roots).map(c=>c*lead);
  const a0=co[co.length-1],ds=divisors(a0);
  const cand=ds.flatMap(d=>[d,-d]).sort((a,b)=>a-b);
  const good=cand.filter(c=>polyEv(co,c)===0);
  return{kind:'Celočíselné korene',prompt:p_(`Nájdi všetky reálne korene polynómu ${FX(polyAst(co),'P')}. (Všetky sú celé čísla.)`),
    input:{t:'lines',lines:[['Korene (oddeľ čiarkou): ',{m:'set'}]]},answer:[roots],
    solution:p_(`Celočíselný koreň musí deliť absolútny člen ${Math.abs(a0)}. Kandidáti: ${cand.map(nn).join(', ')}.`)+
      p_(`Hornerovou schémou (alebo dosadením) overíme: P = 0 pre ${good.map(nn).join(', ')}.`)+
      p_(`Teda P(x) = ${lead<0?'−':''}${roots.map(r=>`(x ${sg(-r)} ${Math.abs(r)})`).join('')}`)+p_(`Korene: ${roots.map(nn).join(', ')}.`)}}

function polyDivmod(n,d){n=n.slice();const out=[],steps=[];const dn=d.length;
  while(n.length>=dn){const c=n[0]/d[0];out.push(c);const sub_=d.map(x=>x*c);steps.push({c,cur:n.slice(),sub:sub_});for(let i=0;i<dn;i++)n[i]-=c*d[i];n.shift()}
  return{q:out,r:n,steps}}
function gPolyDiv(){
  const p=rnd(-3,3),q=pick([-4,-3,-2,-1,1,2,3,4]);let co;
  do{co=Array.from({length:5},()=>rnd(-5,5))}while(co[0]===0);
  if(co[0]<0)co=co.map(c=>-c);
  const d=[1,p,q];const res=polyDivmod(co,d);
  const lines=[['Podiel: koeficienty (od x² po absolútny člen): ',null,null,null],['Zvyšok: koeficient pri x a absolútny člen: ',null,null]];
  const stepsHtml=res.steps.map((s,i)=>{const deg=co.length-1-i;return `<div class="eq"><span class="m">${powTxt(deg)}${deg>2?' : x² = '+(s.c===1?'':nn(s.c))+powTxt(deg-2):' : x² = '+nn(s.c)}</span><span class="muted">odpočítame ${nn(s.c)}·(x² ${sg(p)} ${Math.abs(p)}x ${sg(q)} ${Math.abs(q)})</span></div>`}).join('');
  return{kind:'Delenie polynómov',prompt:p_(`Vydeľ polynómy: (${MQ(polyAst(co))}) : (${MQ(polyAst(d))}). Zapíš podiel a zvyšok.`),
    input:{t:'lines',lines},answer:[...res.q,...res.r],
    solution:p_('Písomné delenie: vždy vydelíme vedúci člen aktuálneho polynómu vedúcim členom deliteľa, výsledok vynásobíme deliteľom a odpočítame.')+stepsHtml+
      p_(`Podiel: ${MQ(polyAst(res.q))}, zvyšok: ${MQ(polyAst(res.r))}.`)+p_(`<span class="muted">Skúška: deliteľ · podiel + zvyšok = pôvodný polynóm.</span>`)}}

function gFactor(){
  const v=pick(['A','A','B','C']);let co,roots,cnt,fac;
  if(v==='A'){let a,b;do{a=rnd(-4,4);b=rnd(-4,4)}while(a===b||!a||!b);const pp=rnd(-2,2),qq=rnd(Math.floor(pp*pp/4)+1,5);
    co=polyMul(polyFromRoots([a,b]),[1,pp,qq]);roots=[a,b].sort((x,y)=>x-y);cnt=2;
    fac=`${H(xm(a))}${H(xm(b))}(${H(polyAst([1,pp,qq]))})`;
    var why=`Kvadratický činiteľ ${H(polyAst([1,pp,qq]))} má diskriminant ${pp*pp-4*qq} < 0, preto nemá reálne korene (je ireducibilný).`}
  else if(v==='B'){let a,b,c;do{a=rnd(-3,3);b=rnd(-3,4);c=rnd(-3,4)}while(!a||new Set([a,b,c]).size<3);
    co=polyMul(polyMul(polyFromRoots([a,a]),[1,-b]),[1,-c]);roots=[a,b,c].sort((x,y)=>x-y);cnt=4;
    fac=`${H(pow(xm(a),N(2)))}${H(xm(b))}${H(xm(c))}`;var why=`Koreň ${nn(a)} je dvojnásobný (násobnosť 2): graf sa v ňom dotýka osi x.`}
  else{let a,b;do{a=rnd(-3,3);b=rnd(-3,4)}while(!a||a===b);
    co=polyMul(polyFromRoots([a,a]),[1,-b]);roots=[a,b].sort((x,y)=>x-y);cnt=3;
    fac=`${H(pow(xm(a),N(2)))}${H(xm(b))}`;var why=`Koreň ${nn(a)} je dvojnásobný, koreň ${nn(b)} je jednoduchý.`}
  return{kind:'Rozklad na súčin',prompt:p_(`Rozlož polynóm ${FX(polyAst(co),'P')} na súčin lineárnych činiteľov a ireducibilných kvadratických činiteľov.`)+p_('Zapíš všetky <b>rôzne</b> reálne korene a počet všetkých reálnych koreňov, ak každý počítame toľkokrát, aká je jeho násobnosť.'),
    input:{t:'lines',lines:[['Rôzne reálne korene: ',{m:'set'}],['Počet koreňov s násobnosťou: ',null]]},answer:[roots,cnt],
    solution:p_(`Nájdeme celočíselné korene ako deliteľov absolútneho člena a polynóm postupne vydelíme.`)+eqh(`<span class="m">P(x) = ${fac}</span>`)+p_(why)+p_(`Rôzne reálne korene: ${roots.map(nn).join(', ')}; počet s násobnosťou: ${cnt}.`)}}

function gPartial(){
  const v=pick(['a','a','b','c']);
  if(v==='a'){let a,b;do{a=rnd(-4,4);b=rnd(-4,4)}while(a===b);let A,B;do{A=rnd(-5,5);B=rnd(-5,5)}while(!A||!B);
    const num=[A+B,-(A*b+B*a)],den=polyFromRoots([a,b]);
    return{kind:'Parciálne zlomky',prompt:p_(`Rozlož na parciálne zlomky: ${MQ(div(polyAst(num),polyAst(den)))}`)+p_(`Hľadaj tvar <span class="m">${frac('<i>A</i>',H(xm(a)))} + ${frac('<i>B</i>',H(xm(b)))}</span>`),
      input:{t:'lines',lines:[['A = ',null,'  B = ',null]]},answer:[A,B],
      solution:p_(`Menovateľ rozložíme: ${MQ(polyAst(den))} = ${MQ(mul(xm(a),xm(b)))}.`)+p_(`Vynásobíme (x ${sg(-a)} ${Math.abs(a)})(x ${sg(-b)} ${Math.abs(b)}): ${H(polyAst(num))} = A(x ${sg(-b)} ${Math.abs(b)}) + B(x ${sg(-a)} ${Math.abs(a)}).`)+

const lg=(b,arg)=>`log${sub_(b)}&#8239;${arg}`;

    if(t===2)return{kind:'Logaritmy',prompt:p_(`Vypočítaj: <span class="m">${lg(b,`${Math.pow(b,i)}<sup>${j+1}</sup>`)}</span>`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[i*(j+1)],solution:p_(`log<sub>b</sub> x<sup>r</sup> = r · log<sub>b</sub> x, teda ${j+1} · ${i} = <b>${i*(j+1)}</b>.`)}
    return{kind:'Logaritmy',prompt:p_(`Vypočítaj: <span class="m">${lg(b,`<span class="rt"><span class="rs">√</span><span class="rb">${Math.pow(b,2*i)}</span></span>`)}</span>`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[i],solution:p_(`√${Math.pow(b,2*i)} = ${b}<sup>${i}</sup>, teda log<sub>${b}</sub> = <b>${i}</b>.`)}}
  const bb=pick([2,3,5]),m=pick([2,3]);let n;do{n=rnd(1,4)}while(n===m);

  const b=pick([2,3,5]),k=rnd(2,4),prod=Math.pow(b,k);const pairs=[];for(let n=1;n*n<prod;n++)if(prod%n===0&&prod/n>n)pairs.push([prod/n,n]);

const limNum=(f,a,side=0)=>{ // numerická kontrola limity zľava (-1), sprava (+1), alebo z oboch strán
  const hs=[1e-3,1e-4,1e-5];const out=hs.map(h=>f(a+(side||1)*h));return out};
const near=(u,v,tol)=>Math.abs(u-v)<=tol*Math.max(1,Math.abs(v));
const L2=(sub,body)=>LIM(sub,body);
function lineHtml(k,q){let h='';
  if(k!==0){h+=(Math.abs(k)===1?(k<0?'−':''):fv(k))+'x'}
  if(q!==0||k===0){h+=k===0?fv(q):(q<0?' − ':' + ')+fv(Math.abs(q))}
  return h}
const infTxt=v=>v===Infinity?'∞':v===-Infinity?'−∞':fv(v);

/* ======================================================================
   4. LIMITY A SPOJITOSŤ
   ====================================================================== */
function gLimFactor(){
  if(Math.random()<0.25){const a=pick([-3,-2,-1,1,2,3]);const f=div(polyAst([1,0,0,-a*a*a]),xm(a));
    return{kind:'Limita: rozklad a krátenie',prompt:p_(`Vypočítaj: ${L2(`x→${nn(a)}`,MQ(f))}`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[3*a*a],verify:()=>near(ev(f,a+1e-5),3*a*a,1e-3),
      solution:p_('Dosadením dostaneme 0/0. Použijeme vzorec x³ − a³ = (x − a)(x² + ax + a²).')+eqh(`<span class="m">${H(f)} = ${H(div(mul(xm(a),P(`x^2+(${a})*x+${a*a}`)),xm(a)))} = ${H(P(`x^2+(${a})*x+${a*a}`))}</span>`)+p_(`Po dosadení x = ${nn(a)}: ${nn(a*a)} + ${par(a*a)} + ${a*a} = <b>${3*a*a}</b>.`)}}
  let a,c,d;do{a=rnd(-4,4);c=rnd(-4,4);d=rnd(-4,4)}while(c===a||d===a||c===d);
  const nu=polyFromRoots([a,c]),de=polyFromRoots([a,d]);const f=div(polyAst(nu),polyAst(de));const ans=(a-c)/(a-d);
  return{kind:'Limita: rozklad a krátenie',prompt:p_(`Vypočítaj: ${L2(`x→${nn(a)}`,MQ(f))}`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[ans],verify:()=>near(ev(f,a+1e-6),ans,1e-3),
    solution:p_(`Priame dosadenie x = ${nn(a)} dá neurčitý výraz 0/0. Čitateľ aj menovateľ rozložíme na činitele a skrátime (x − ${nn(a)}):`)+eqh(`<span class="m">${H(f)} = ${H(div(mul(xm(a),xm(c)),mul(xm(a),xm(d))))} = ${H(div(xm(c),xm(d)))}</span>`)+p_(`Dosadením: ${frac(nn(a-c),nn(a-d))} = <b>${fv(ans)}</b>.`)}}

function gLimConj(){
  const v=pick(['a','b','c','d','e']);let f,ans,pt,txt;
  if(v==='a'){const m=rnd(2,6);f=div(sub(sqrtN(add(X,N(m*m))),N(m)),X);pt=0;ans=1/(2*m);txt=`√(x + ${m*m}) − ${m}`;
    var how=`Rozšírime združeným výrazom √(x + ${m*m}) + ${m}: čitateľ sa zmení na (x + ${m*m}) − ${m*m} = x, a x sa skráti s menovateľom. Zostane 1/(√(x + ${m*m}) + ${m}) → 1/(${m}+${m}) = ${fv(ans)}.`}
  else if(v==='b'){const k=rnd(2,5);f=div(sub(sqrtN(X),N(k)),sub(X,N(k*k)));pt=k*k;ans=1/(2*k);
    how=`Rozložíme x − ${k*k} = (√x − ${k})(√x + ${k}). Po skrátení zostane 1/(√x + ${k}) → 1/(${k}+${k}) = ${fv(ans)}.`}
  else if(v==='c'){const k=rnd(2,5);f=div(sub(X,N(k*k)),sub(sqrtN(X),N(k)));pt=k*k;ans=2*k;
    how=`x − ${k*k} = (√x − ${k})(√x + ${k}). Po skrátení zostane √x + ${k} → ${2*k}.`}
  else if(v==='d'){const s=rnd(2,4),a0=rnd(1,6);const m=s*s-a0;if(m<1)return null;f=div(sub(sqrtN(add(X,N(m))),N(s)),sub(X,N(a0)));pt=a0;ans=1/(2*s);
    how=`Rozšírime združeným výrazom √(x + ${m}) + ${s}. V čitateli vznikne (x + ${m}) − ${s*s} = x − ${a0}, ktoré sa skráti. Zostane 1/(√(x + ${m}) + ${s}) → 1/(${s}+${s}) = ${fv(ans)}.`}
  else{let a,b;do{a=rnd(-4,5);b=rnd(-4,5)}while(a===b);f=div(sub(sqrtN(add(N(1),mul(N(a),X))),sqrtN(add(N(1),mul(N(b),X)))),X);pt=0;ans=(a-b)/2;
    how=`Rozšírime združeným výrazom (súčtom odmocnín). V čitateli vznikne (1 + ${a}x) − (1 + ${b}x) = ${nn(a-b)}x. Po skrátení x zostane ${nn(a-b)}/(√1 + √1) = <b>${fv(ans)}</b>.`}
  return{kind:'Limita: rozšírenie združeným výrazom',prompt:p_(`Vypočítaj: ${L2(`x→${pt}`,MQ(f))}`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[ans],verify:()=>near(ev(f,pt+(pt===0?1e-5:1e-5)),ans,2e-3),
    solution:p_('Dosadením dostaneme neurčitý výraz 0/0 a v zlomku sú odmocniny, preto použijeme rozšírenie združeným výrazom.')+p_(how)+p_(`Výsledok: <b>${fv(ans)}</b>.`)}}

function gLimInf(){
  const v=pick(['rat','rat','irr']);
  if(v==='rat'){const m=rnd(1,3),n=rnd(1,3);let p,q;do{p=rnd(-5,5);q=rnd(-4,4)}while(!p||!q);
    const co1=[p,...Array.from({length:m},()=>rnd(-4,4))],co2=[q,...Array.from({length:n},()=>rnd(-4,4))];
    const dir=pick([1,-1]);let ans;if(m<n)ans=0;else if(m===n)ans=p/q;else ans=Math.sign(p/q)*Math.pow(dir,m-n)*Infinity;
    const f=div(polyAst(co1),polyAst(co2));
    return{kind:'Limita v nekonečne',prompt:p_(`Vypočítaj: ${L2(`x→${dir>0?'∞':'−∞'}`,MQ(f))}`)+p_('<span class="muted">Nekonečno napíš ako <kbd>inf</kbd> alebo <kbd>-inf</kbd>.</span>'),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[ans],
      solution:p_(`Stupeň čitateľa je ${m}, stupeň menovateľa ${n}. Čitateľ aj menovateľ vydelíme najvyššou mocninou x<sup>${Math.max(m,n)}</sup>. Rozhodujú vedúce členy: ${nn(p)}x<sup>${m}</sup> a ${nn(q)}x<sup>${n}</sup>.`)+
        p_(m<n?'Stupeň čitateľa je menší, limita je <b>0</b>.':m===n?`Stupne sú rovnaké, limita je podiel vedúcich koeficientov ${nn(p)}/${nn(q)} = <b>${fv(p/q)}</b>.`:`Stupeň čitateľa je väčší. Podiel vedúcich členov ${H(div(mul(N(p),pow(X,N(m))),mul(N(q),pow(X,N(n)))))} = ${fv(p/q)}·x<sup>${m-n}</sup> ide do <b>${infTxt(ans)}</b>.`)}}
  const a=pick([2,4,6,-2,-4,-6]),c=rnd(0,1)?pick([0,2,-2,4]):null;
  if(c!==null&&c!==a){const f=sub(sqrtN(add(pow(X,N(2)),mul(N(a),X))),sqrtN(add(pow(X,N(2)),mul(N(c),X))));const ans=(a-c)/2;
    return{kind:'Limita v nekonečne',prompt:p_(`Vypočítaj: ${L2('x→∞',MQ(f))}`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[ans],verify:()=>near(ev(f,1e5),ans,1e-3),
      solution:p_('Typ ∞ − ∞. Rozšírime súčtom odmocnín:')+eqh(`<span class="m">${frac(`(x² ${sg(a)} ${Math.abs(a)}x) − (x² ${sg(c)} ${Math.abs(c)}x)`,`√(x² ${sg(a)} ${Math.abs(a)}x) + √(x² ${sg(c)} ${Math.abs(c)}x)`)}</span>`)+
        p_(`Čitateľ je ${nn(a-c)}x. Vydelíme x: ${frac(nn(a-c),`√(1 ${sg(a)} ${Math.abs(a)}/x) + √(1 ${sg(c)} ${Math.abs(c)}/x)`)} → ${nn(a-c)}/2 = <b>${fv(ans)}</b>.`)}}
  const f=sub(sqrtN(add(pow(X,N(2)),mul(N(a),X))),X);const ans=a/2;
  return{kind:'Limita v nekonečne',prompt:p_(`Vypočítaj: ${L2('x→∞',MQ(f))}`),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[ans],verify:()=>near(ev(f,1e5),ans,1e-3),
    solution:p_('Typ ∞ − ∞. Rozšírime súčtom (združeným výrazom):')+eqh(`<span class="m">${frac(`(x² ${sg(a)} ${Math.abs(a)}x) − x²`,`√(x² ${sg(a)} ${Math.abs(a)}x) + x`)} = ${frac(`${nn(a)}x`,`√(x² ${sg(a)} ${Math.abs(a)}x) + x`)}</span>`)+
      p_(`Vydelíme x: ${frac(nn(a),`√(1 ${sg(a)} ${Math.abs(a)}/x) + 1`)} → ${nn(a)}/2 = <b>${fv(ans)}</b>.`)}}

function gLimSig(){
  const a=rnd(2,6),b=rnd(2,6);const k=rnd(1,4),m=rnd(1,3);
  const T=[
    ()=>{const f=div(fn('sin',mul(N(a),X)),mul(N(b),X));return{f,pt:'x→0',ans:a/b,how:`Použijeme sin(u)/u → 1: ${frac(`sin ${a}x`,`${b}x`)} = ${frac(a,b)}·${frac(`sin ${a}x`,`${a}x`)} → ${frac(a,b)}·1.`,ev:x=>ev(f,x),at:1e-4}},
    ()=>{const f=div(fn('tg',mul(N(a),X)),mul(N(b),X));return{f,pt:'x→0',ans:a/b,how:`tg u = sin u / cos u, cos(${a}x) → 1 a sin(${a}x)/(${a}x) → 1, preto limita je ${a}/${b}.`,ev:x=>ev(f,x),at:1e-4}},
    ()=>{let c=a;while(c===b)c=rnd(2,6);const f=div(fn('sin',mul(N(c),X)),fn('sin',mul(N(b),X)));return{f,pt:'x→0',ans:c/b,how:`Rozšírime: ${frac(`sin ${c}x`,`sin ${b}x`)} = ${frac(`sin ${c}x`,`${c}x`)}·${frac(`${b}x`,`sin ${b}x`)}·${frac(c,b)} → 1·1·${frac(c,b)}.`,ev:x=>ev(f,x),at:1e-4}},
    ()=>{const f=div(sub(N(1),fn('cos',mul(N(a),X))),pow(X,N(2)));return{f,pt:'x→0',ans:a*a/2,how:`Rozšírime (1 + cos ${a}x): čitateľ sa zmení na sin²(${a}x), takže limita je (${a}²)·(sin ${a}x/${a}x)²/(1 + cos ${a}x) → ${a*a}·1/2 = ${fv(a*a/2)}.`,ev:x=>ev(f,x),at:1e-3}},
    ()=>{const f=div(fn('ln',add(N(1),mul(N(a),X))),mul(N(b),X));return{f,pt:'x→0',ans:a/b,how:`Použijeme ln(1 + u)/u → 1 s u = ${a}x: dostaneme ${a}/${b}.`,ev:x=>ev(f,x),at:1e-5}},
    ()=>{const f=div(sub(pow(E,mul(N(a),X)),N(1)),mul(N(b),X));return{f,pt:'x→0',ans:a/b,how:`Použijeme (e<sup>u</sup> − 1)/u → 1 s u = ${a}x: dostaneme ${a}/${b}.`,ev:x=>ev(f,x),at:1e-5}},
    ()=>{const f=pow(add(N(1),div(N(k),X)),mul(N(m),X));return{f,pt:'x→∞',ans:A(Math.exp(k*m),`e<sup>${k*m}</sup>`,`e^${k*m}`),av:Math.exp(k*m),how:`Typ 1<sup>∞</sup>. Použijeme (1 + k/x)<sup>x</sup> → e<sup>k</sup>. Tu je k = ${k} a exponent ${m}x, preto výsledok je e<sup>${k}·${m}</sup> = e<sup>${k*m}</sup>.`,ev:x=>ev(f,x),at:1e6,big:true}},
    ()=>{const f=pow(add(N(1),mul(N(a),X)),div(N(1),X));return{f,pt:'x→0',ans:A(Math.exp(a),`e<sup>${a}</sup>`,`e^${a}`),av:Math.exp(a),how:`Typ 1<sup>∞</sup>. Substitúcia t = 1/x vedie na (1 + ${a}/t)<sup>t</sup> pre t → ∞, čo je e<sup>${a}</sup>.`,ev:x=>ev(f,x),at:1e-5}},
    ()=>{const f=mul(X,fn('sin',div(N(1),X)));return{f,pt:'x→∞',ans:1,how:'Substitúcia t = 1/x: x·sin(1/x) = sin t / t → 1 pre t → 0⁺.',ev:x=>ev(f,x),at:1e6,big:true}}
  ];
  const t=pick(T)();const av_=t.av!==undefined?t.av:av(t.ans);
  return{kind:'Významné limity',prompt:p_(`Vypočítaj: ${L2(t.pt,MQ(t.f))}`)+p_('<span class="muted">Ak je výsledok mocnina čísla e, napíš ho napríklad ako <kbd>e^3</kbd>.</span>'),input:{t:'lines',lines:[['Hodnota: ',null]]},answer:[t.ans],
    verify:()=>{const y=t.ev(t.at);return near(y,av_,t.big?2e-3:2e-3)},
    solution:p_(t.how)+p_(`Výsledok: <b>${ahtml(t.ans)}</b>.`)}}

function gLimOne(){
  const a=rnd(-3,3),b=rnd(-4,4);
  const T=[
    ()=>({f:div(N(1),xm(a)),l:-Infinity,r:Infinity,w:'Menovateľ x − a je zľava záporný a malý, sprava kladný a malý.'}),
    ()=>({f:div(N(1),pow(xm(a),N(2))),l:Infinity,r:Infinity,w:'Druhá mocnina je z oboch strán kladná a malá, preto 1/0⁺ = +∞ z oboch strán.'}),
    ()=>({f:div(fn('abs',xm(a)),xm(a)),l:-1,r:1,w:'Zľava je |x − a| = −(x − a), takže podiel je −1. Sprava je |x − a| = x − a, podiel je 1.'}),
    ()=>({f:fn('arctg',div(N(1),xm(a))),l:A(-Math.PI/2,'−π/2','-pi/2'),r:A(Math.PI/2,'π/2','pi/2'),w:'Argument 1/(x − a) ide zľava do −∞ a sprava do +∞, a arctg(±∞) = ±π/2.'}),
    ()=>({f:pow(E,div(N(1),xm(a))),l:0,r:Infinity,w:'Zľava ide exponent do −∞, a e<sup>−∞</sup> = 0. Sprava ide exponent do +∞, a e<sup>+∞</sup> = +∞.'}),
    ()=>{if(a+b===0)return null;const s=Math.sign(a+b);return{f:div(add(X,N(b)),xm(a)),l:-s*Infinity,r:s*Infinity,w:`Čitateľ má v bode ${a} hodnotu ${a+b}, čo je ${s>0?'kladné':'záporné'} číslo, a menovateľ mení znamienko z − na +.`}},
    ()=>({f:div(N(1),pow(xm(a),N(3))),l:-Infinity,r:Infinity,w:'Tretia mocnina zachová znamienko, preto zľava −∞ a sprava +∞.'})];
  let t;do{t=pick(T)()}while(!t);
  const ft=v=>v===Infinity?'+∞':v===-Infinity?'−∞':ahtml(v);
  return{kind:'Jednostranné limity',prompt:p_(`Vypočítaj jednostranné limity funkcie ${FX(t.f)} v bode x = ${nn(a)}.`)+p_('<span class="muted">Nekonečno napíš ako <kbd>inf</kbd> alebo <kbd>-inf</kbd>, π ako <kbd>pi</kbd>.</span>'),
    input:{t:'lines',lines:[[`zľava: lim x→${nn(a)}⁻ f(x) = `,null],[`sprava: lim x→${nn(a)}⁺ f(x) = `,null]]},answer:[t.l,t.r],
    verify:()=>{const fl=ev(t.f,a-1e-6),fr=ev(t.f,a+1e-6);const chk=(y,v)=>v===Infinity?y>1e4:v===-Infinity?y<-1e4:near(y,av(v),1e-3);return chk(fl,t.l)&&chk(fr,t.r)},
    solution:p_(t.w)+p_(`Zľava: <b>${ft(t.l)}</b>, sprava: <b>${ft(t.r)}</b>.`)+p_(t.l===t.r?'Jednostranné limity sa rovnajú, preto existuje aj obojstranná limita.':'Jednostranné limity sú rôzne, preto obojstranná limita v tomto bode neexistuje.')}}

function gAsym(){
  const v=pick(['a','b','c','d']);
  if(v==='a'){let a,b,c,d;do{a=pick([1,2,3,-1,-2]);b=rnd(-4,4);c=rnd(-5,5);d=rnd(-3,3)}while(!d||polyEv([a,b,c],-d)===0);
    const f=div(polyAst([a,b,c]),add(X,N(d)));const k=a,q=b-a*d;
    return{kind:'Asymptoty',prompt:p_(`Nájdi asymptoty grafu funkcie ${FX(f)}.`),input:{t:'lines',lines:[['zvislá asymptota x = ',null],['šikmá asymptota y = k·x + q:  k = ',null,'  q = ',null]]},answer:[-d,k,q],verify:()=>near(ev(f,1e5)-(k*1e5+q),0,1e-3),
      solution:p_(`Zvislá: menovateľ x ${sg(d)} ${Math.abs(d)} = 0 pre x = ${nn(-d)}. Čitateľ je tam nenulový (${nn(polyEv([a,b,c],-d))}), preto ide naozaj o asymptotu.`)+
        p_(`Stupeň čitateľa je o 1 väčší, preto existuje šikmá asymptota. Vydelíme polynómy: ${H(f)} = ${H(add(mul(N(k),X),N(q)))} + zvyšok/(x ${sg(d)} ${Math.abs(d)}).`)+
        p_(`Zvyšný zlomok ide do 0, preto y = <b>${H(polyAst([k,q]))}</b> (k = ${nn(k)}, q = ${nn(q)}).`)+gfig({xr:[-d-6,-d+6],yr:[-14,14],fns:[{f:x=>ev(f,x),cls:'c1'}],vl:[-d],lines:[{k,q,cls:'as'}],label:'graf s asymptotami'},'Prerušované čiary sú asymptoty.')}}
  if(v==='b'){let a,b,c,d;do{a=rnd(-4,4);b=rnd(-4,4);c=pick([1,2,3,-1,-2]);d=rnd(-5,5)}while(!a||a*d-b*c===0);
    const f=div(add(mul(N(a),X),N(b)),add(mul(N(c),X),N(d)));
    return{kind:'Asymptoty',prompt:p_(`Nájdi asymptoty grafu funkcie ${FX(f)}.`),input:{t:'lines',lines:[['zvislá asymptota x = ',null],['vodorovná asymptota y = ',null]]},answer:[-d/c,a/c],
      solution:p_(`Zvislá: ${nn(c)}x ${sg(d)} ${Math.abs(d)} = 0 pre x = ${fv(-d/c)}.`)+p_(`Vodorovná: ${L2('x→±∞',MQ(f))} = ${frac(nn(a),nn(c))} = <b>${fv(a/c)}</b>.`)+gfig({xr:[-d/c-6,-d/c+6],yr:[a/c-6,a/c+6],fns:[{f:x=>ev(f,x),cls:'c1'}],vl:[-d/c],hl:[a/c],label:'graf s asymptotami'},'Prerušované čiary sú asymptoty.')}}
  if(v==='c'){const k=rnd(1,4);const f=add(X,div(N(k),X));
    return{kind:'Asymptoty',prompt:p_(`Nájdi asymptoty grafu funkcie ${FX(f)}.`),input:{t:'lines',lines:[['zvislá asymptota x = ',null],['šikmá asymptota y = k·x + q:  k = ',null,'  q = ',null]]},answer:[0,1,0],
      solution:p_(`Zvislá: v bode x = 0 ide funkcia do ±∞ (${nn(k)}/x → ±∞), preto x = 0 je asymptota.`)+p_(`Šikmá: k = lim f(x)/x = lim (1 + ${k}/x²) = 1, q = lim (f(x) − x) = lim ${k}/x = 0. Teda y = x.`)+gfig({xr:[-6,6],yr:[-8,8],fns:[{f:x=>ev(f,x),cls:'c1'}],vl:[0],lines:[{k:1,q:0,cls:'as'}],label:'graf s asymptotami'},'Prerušované čiary sú asymptoty.')}}
  const a=rnd(1,3),d=pick([1,2,3,-1,-2]);const f=div(sqrtN(add(mul(N(a*a),pow(X,N(2))),N(1))),xm(d));
  return{kind:'Asymptoty',prompt:p_(`Nájdi asymptoty grafu funkcie ${FX(f)}.`),input:{t:'lines',lines:[['zvislá asymptota x = ',null],['vodorovná asymptota pre x → ∞:  y = ',null],['vodorovná asymptota pre x → −∞:  y = ',null]]},answer:[d,a,-a],
    solution:p_(`Zvislá: x − ${nn(d)} = 0, čitateľ je v tomto bode kladný, preto x = ${nn(d)}.`)+p_(`Pre x → +∞: √(${a*a}x² + 1) = x·√(${a*a} + 1/x²) → ${a}x, preto f → ${a}.`)+p_(`Pre x → −∞ je √(…) = |x|·√(…) = −x·√(…), preto f → <b>${nn(-a)}</b>. Dve rôzne vodorovné asymptoty: y = ${a} a y = ${nn(-a)}.`)+gfig({xr:[d-8,d+8],yr:[-3*a-1,3*a+1],fns:[{f:x=>ev(f,x),cls:'c1'}],vl:[d],hl:[a,-a],label:'graf s asymptotami'},'Prerušované čiary sú asymptoty.')}}

function gContParam(){
  const a=rnd(2,6),b=rnd(2,5),k=rnd(1,5);
  const T=[
    ()=>({f:div(fn('sin',mul(N(a),X)),mul(N(b),X)),x0:0,p:a/b,w:`Hodnota v bode 0 sa musí rovnať limite: ${L2('x→0',MQ(div(fn('sin',mul(N(a),X)),mul(N(b),X))))} = ${frac(a,b)}.`}),

const coef=(a,first=false)=>first?(a<0?`-${-a}`:`${a}`):(a<0?`-${-a}`:`+${a}`);
const sc=()=>pick([1,-1]);
function famPoly(){const n=rnd(3,6),m=rnd(2,n-1);const a=rnd(1,6),b=rnd(1,6),c=rnd(1,8),d=rnd(1,9);
  return `${a}*x^${n}${coef(sc()*b)}*x^${m}${coef(sc()*c)}*x${coef(sc()*d)}`}
function famPoly2(){const a=rnd(1,5),b=rnd(1,6),c=rnd(1,5);return pick([`${a}*x^4${coef(-b)}/x${coef(c)}*sqrt(x)`,`${a}/x^2${coef(b)}*sqrt(x)${coef(-c)}*x^3`,`${a}*sqrt(x)${coef(sc()*b)}/x${coef(sc()*c)}*x^2`])}
function famSum(){const T=['sin(x)','cos(x)','e^x','ln(x)','sqrt(x)','1/x','x^3','arctg(x)','tg(x)','x^2'];const t=shuffle(T).slice(0,3);return t.map((s,i)=>`${i===0?'':coef(sc()*rnd(1,5))}${i===0?rnd(1,5)+'*':'*'}${s}`).join('')}
function famProd(){const u=pick(['x^2','x^3','x','sqrt(x)','ln(x)','e^x']);let v;do{v=pick(['sin(x)','cos(x)','e^x','ln(x)','arctg(x)','x^2','tg(x)'])}while(v===u);return`${u}*${v}`}
function famQuot(){const a=rnd(1,5),b=rnd(-4,5),c=rnd(1,4),d=rnd(-4,4);
  return pick([`(${a}*x+${b})/(${c}*x+${d+5})`,`x^2/(x+${rnd(3,6)})`,`sin(x)/x`,`(x^2+1)/(x+${rnd(3,6)})`,`e^x/x^2`,`ln(x)/x`,`x/(1+x^2)`,`(x^2-1)/(x^2+1)`,`cos(x)/(1+sin(x))`,`(x^2+${a})/(x^2+${c})`,`x^${rnd(2,3)}/e^x`,`(1+x)/sqrt(x)`])}
function famChain(){const a=rnd(2,5),b=rnd(1,6),n=rnd(3,9);
  return pick([`(${a}*x+${b})^${n}`,`sin(${a}*x+${b})`,`cos(x^2)`,`e^(${a}*x^2)`,`ln(x^2+${b})`,`sqrt(x^2+${b})`,`arctg(${a}*x)`,`sin(x)^2`,`e^(-x^2)`,`ln(sin(x))`,`tg(${a}*x)`,`cos(x^3)`,`(x^2+1)^3`,`sqrt(1+e^x)`,`ln(1+x^2)`,`1/(x^2+${b})`,`e^(sin(x))`,`sin(e^x)`,`arcsin(x/4)`,`cos(${a}*x)^2`,`ln(x+sqrt(x^2+1))`,`(sin(x))^3`])}
function famMix(){const a=rnd(2,5);
  return pick([`x^2*e^(${a}*x)`,`x*sin(${a}*x)`,`e^x*cos(x)`,`sin(x)*cos(${a}*x)`,`x*sqrt(x^2+${a})`,`x^2*arctg(x)`,`ln(x)*sin(x)`,`(x^2+1)*ln(x)`,`sqrt(x)*e^x`,`e^(-x)*sin(x)`,`x*ln(x^2+1)`,`x^3*cos(${a}*x)`,`x*e^(x^2)`])}
function famLog(){return pick(['x^x','x^sin(x)','sin(x)^x','x^ln(x)','(1+x)^x','x^(1/x)','(1+x^2)^x','x^(x^2)'])}
function gDiff(){
  const fam=pick([famPoly,famPoly2,famSum,famSum,famProd,famProd,famProd,famQuot,famQuot,famQuot,famChain,famChain,famChain,famChain,famChain,famMix,famMix,famMix,famLog]);
  const s=fam();const f=P(s);const d=D(f);
  const ok=XS.filter(x=>isFinite(ev(d,x))&&Math.abs(ev(d,x))<1e8).length;if(ok<10)return null;
  return{kind:'Derivácia funkcie',prompt:p_(`Vypočítaj deriváciu funkcie ${FX(f)}.`)+p_(`<span class="muted">Zápis: <kbd>x^2</kbd>, <kbd>sin(x)</kbd>, <kbd>e^x</kbd>, <kbd>ln(x)</kbd>, <kbd>sqrt(x)</kbd>, <kbd>arctg(x)</kbd>, násobenie môžeš vynechať (<kbd>2x</kbd>). Zlomky a argumenty funkcií daj do zátvoriek.</span>`),
    input:{t:'expr'},check:x=>checkFn(x,t=>ev(d,t)),ref:MQ(d),refAst:d,fAst:f,
    solution:explain(f)}}

/* ---- vysvetlenie postupu derivovania podľa tvaru výrazu ---- */
const dL=a=>`(${H(a)})′`;
const lineM=s=>`<div class="eq"><span class="m">${s}</span></div>`;
const fpName={sin:'cos x',cos:'−sin x',tg:'1/cos²x',ctg:'−1/sin²x',ln:'1/x',arcsin:'1/√(1 − x²)',arccos:'−1/√(1 − x²)',arctg:'1/(1 + x²)',arccotg:'−1/(1 + x²)',sqrt:'1/(2√x)',sinh:'cosh x',cosh:'sinh x',th:'1/cosh²x'};
function sumTerms(a,s=1,out=[]){if(a.t==='op'&&a.o==='+'){sumTerms(a.a,s,out);sumTerms(a.b,s,out)}else if(a.t==='op'&&a.o==='-'){sumTerms(a.a,s,out);sumTerms(a.b,-s,out)}else out.push({s,a});return out}
function subLine(a,dep){ // krátky popis derivovania podčasti
  const d=D(a);let h=`<div class="eq"><span class="m">${dL(a)} = ${H(d)}</span></div>`;
  return h}
function rule(a,dep=0){
  const d=D(a);
  if(a.t==='n'||a.t==='c')return`<p>Konštanta: ${MQ(a)}′ = 0.</p>`;
  if(a.t==='v')return`<p>(x)′ = 1.</p>`;
  if(a.t==='neg')return`<p>Mínus vyberieme pred deriváciu: (−u)′ = −u′.</p>`+rule(a.a,dep+1);
  if(a.t==='op'&&a.o==='*'){
    if(isConst(a.a))return`<p>Konštantný násobok vyberieme pred deriváciu: (c·u)′ = c·u′.</p>`+lineM(`${dL(a.a.t==='n'?a.b:a.a)} = ${H(D(a.a.t==='n'?a.b:a.a))}`)+(dep<2?rule(a.a.t==='n'?a.b:a.a,dep+1):'')+lineM(`${dL(a)} = ${H(d)}`);
    const u=a.a,v=a.b;
    return`<p><b>Súčinové pravidlo</b>: (u·v)′ = u′·v + u·v′, kde u = ${MQ(u)}, v = ${MQ(v)}.</p>`+lineM(`u′ = ${H(D(u))}, &nbsp; v′ = ${H(D(v))}`)+lineM(`${dL(a)} = ${H(mul(D(u),v))} + ${H(mul(u,D(v)))} = ${H(d)}`)}
  if(a.t==='op'&&a.o==='/'){
    if(isConst(a.b))return`<p>Delenie konštantou: (u/c)′ = u′/c.</p>`+lineM(`${dL(a)} = ${H(d)}`);
    const u=a.a,v=a.b;
    return`<p><b>Podielové pravidlo</b>: (u/v)′ = (u′v − uv′)/v², kde u = ${MQ(u)}, v = ${MQ(v)}.</p>`+lineM(`u′ = ${H(D(u))}, &nbsp; v′ = ${H(D(v))}`)+lineM(`${dL(a)} = ${frac(`${H(mul(D(u),v))} − ${H(mul(u,D(v)))}`,H(pow(v,N(2))))} = ${H(d)}`)}
  if(a.t==='op'&&a.o==='^'){
    if(isConst(a.b)){
      if(a.a.t==='v')return`<p>Mocninové pravidlo: (x<sup>n</sup>)′ = n·x<sup>n−1</sup>.</p>`+lineM(`${dL(a)} = ${H(d)}`);
      return`<p><b>Reťazové pravidlo</b>: (u<sup>n</sup>)′ = n·u<sup>n−1</sup>·u′, kde u = ${MQ(a.a)} (vnútorná funkcia), u′ = ${MQ(D(a.a))}.</p>`+lineM(`${dL(a)} = ${H(d)}`)+(dep<2&&!isSimple(a.a)?rule(a.a,dep+1):'')}
    if(isConst(a.a)){const isE=a.a.t==='c';return`<p>Exponenciálna funkcia: (${isE?'e':'a'}<sup>u</sup>)′ = ${isE?'e':'a'}<sup>u</sup>${isE?'':'·ln a'}·u′, kde u = ${MQ(a.b)}.</p>`+lineM(`${dL(a)} = ${H(d)}`)}
    return`<p><b>Logaritmické derivovanie</b>: premenná je v základe aj v exponente. Použijeme f<sup>g</sup> = e<sup>g·ln f</sup>, teda (f<sup>g</sup>)′ = f<sup>g</sup>·(g·ln f)′, kde f = ${MQ(a.a)}, g = ${MQ(a.b)}.</p>`+lineM(`(${H(mul(a.b,fn('ln',a.a)))})′ = ${H(D(mul(a.b,fn('ln',a.a))))}`)+lineM(`${dL(a)} = ${H(d)}`)}
  if(a.t==='f'){
    if(a.a.t==='v')return`<p>Základný vzorec: (${H(a)})′ = ${fpName[a.n]||'…'}.</p>`+lineM(`${dL(a)} = ${H(d)}`);
    return`<p><b>Reťazové pravidlo</b>: vonkajšia funkcia ${FNAME[a.n]||a.n}, vnútorná funkcia u = ${MQ(a.a)}. Derivujeme vonkajšiu (argument zatiaľ nemeníme) a vynásobíme deriváciou vnútornej: u′ = ${MQ(D(a.a))}.</p>`+lineM(`${dL(a)} = ${H(d)}`)+(dep<2&&!isSimple(a.a)?rule(a.a,dep+1):'')}
  return lineM(`${dL(a)} = ${H(d)}`)}
const isSimple=a=>a.t==='v'||a.t==='n'||a.t==='c'||(a.t==='op'&&(a.o==='+'||a.o==='-')&&sumTerms(a).every(t=>isSimple2(t.a)));
const isSimple2=a=>a.t==='v'||a.t==='n'||(a.t==='op'&&a.o==='*'&&a.a.t==='n'&&a.b.t==='v')||(a.t==='op'&&a.o==='^'&&a.a.t==='v'&&a.b.t==='n')||(a.t==='op'&&a.o==='*'&&a.a.t==='n'&&a.b.t==='op'&&a.b.o==='^'&&a.b.a.t==='v');
function explain(f){
  const ts=sumTerms(f);let h='';
  if(ts.length>1){h+=p_('Funkcia je súčet (rozdiel) viacerých členov, derivujeme člen po člene: (u ± v)′ = u′ ± v′.');
    ts.forEach(t=>{h+=`<div class="rb">${rule(t.s<0?neg(t.a):t.a,1)}</div>`})}
  else h+=rule(f,0);
  return h+p_(`Výsledok: f′(x) = ${MQ(D(f))}`)}

function gDiffPoint(){
  const L=[['x^3-2*x^2+5',[-2,-1,1,2,3]],['(x^2+1)/(x+1)',[0,1,2,3]],['sqrt(x)*(x+1)',[1,4,9]],['x*e^x',[0]],['ln(x)*x^2',[1]],['e^(2*x)*(x+1)',[0]],['sin(x)+x^2',[0]],['x^2/(x+2)',[0,1,2,-1]],['x^4-3*x^2+x',[-1,1,2]],['(x-1)/(x+1)',[0,1,2,3]],['1/x+x^2',[1,2,-1,-2]],['sqrt(x^2+9)',[0,4,-4]],['e^x*cos(x)',[0]],['x*ln(x)',[1]],['(2*x+1)^3',[0,1,-1]],['x*sqrt(x+1)',[0,3,8]]];
  const [s,xs]=pick(L);const f=P(s),x0=pick(xs),d=D(f);const v=ev(d,x0);if(!rat(v))return null;
  return{kind:'Derivácia v bode',prompt:p_(`Vypočítaj hodnotu derivácie funkcie ${FX(f)} v bode x₀ = ${nn(x0)}.`),input:{t:'lines',lines:[[`f′(${nn(x0)}) = `,null]]},answer:[v],
    solution:explain(f)+p_(`Dosadíme x = ${nn(x0)}: f′(${nn(x0)}) = <b>${fv(v)}</b>.`)}}

function gDefDeriv(){
  if(Math.random()<0.45){let al,be,ga,a;do{al=rnd(-3,3);be=rnd(-4,4);ga=rnd(-3,3);a=rnd(-3,3)}while(!al);
    const f=polyAst([al,be,ga]);const A_=2*al*a+be;
    return{kind:'Derivácia z definície',prompt:p_(`Z definície vypočítaj f′(${nn(a)}) pre ${FX(f)}. Najprv uprav diferenčný podiel <span class="m">${frac(`f(${nn(a)} + h) − f(${nn(a)})`,'h')}</span> do tvaru <i>A</i> + <i>B</i>·h.`),
      input:{t:'lines',lines:[['A = ',null,'  B = ',null],['f′('+nn(a)+') = ',null]]},answer:[A_,al,A_],
      solution:p_(`f(${nn(a)} + h) = ${nn(al)}(${nn(a)} + h)² ${sg(be)} ${Math.abs(be)}(${nn(a)} + h) ${sg(ga)} ${Math.abs(ga)} = ${nn(al*a*a+be*a+ga)} + ${nn(A_)}h + ${nn(al)}h².`)+
        p_(`f(${nn(a)}) = ${nn(al*a*a+be*a+ga)}. Po odčítaní a delení h: diferenčný podiel = ${nn(A_)} + ${nn(al)}h.`)+p_(`Limita pre h → 0 je <b>${nn(A_)}</b>.`)}}
  const b=pick([-3,-2,-1,1,2,3]);
  return{kind:'Jednostranné derivácie',prompt:p_(`Pre ktorú hodnotu a existuje derivácia funkcie f v bode 0?`)+`<div class="sys"><div><span class="m">f(x) = x² ${b>0?'+':'−'} ${Math.abs(b)}x, &nbsp; x ≥ 0</span></div><div><span class="m">f(x) = ax, &nbsp; x < 0</span></div></div>`,
    input:{t:'lines',lines:[['a = ',null]]},answer:[b],
    solution:p_(`Derivácia sprava: f′₊(0) = lim (h² ${sg(b)} ${Math.abs(b)}h)/h = ${nn(b)}.`)+p_('Derivácia zľava: f′₋(0) = lim (a·h)/h = a.')+p_(`Derivácia v bode existuje práve vtedy, keď sa jednostranné derivácie rovnajú: <b>a = ${nn(b)}</b>.`)}}

const concDer=conc('Teória: derivácie',[
  {q:'Pre deriváciu súčinu platí:',o:['(fg)′ = f′g + fg′','(fg)′ = f′g′','(fg)′ = f′g − fg′','(fg)′ = (f′g′)/2'],s:p_('Súčinové pravidlo: (fg)′ = f′g + fg′. Platí (fg)′ ≠ f′g′, napríklad (x·x)′ = 2x, no x′·x′ = 1.')},

  {q:'Pre zloženú funkciu platí (f ∘ g)′(x) =',o:['f′(g(x))·g′(x)','f′(x)·g′(x)','f′(g′(x))','f(g′(x))'],s:p_('Reťazové pravidlo: deriváciu vonkajšej funkcie vyhodnotíme v g(x) a vynásobíme deriváciou vnútornej.')},
  {q:'Ktoré pravidlo použiješ pri derivovaní funkcie y = sin(x²)?',o:['reťazové pravidlo','súčinové pravidlo','podielové pravidlo','iba vzorec pre (sin x)′'],s:p_('sin je vonkajšia a x² vnútorná funkcia, preto (sin x²)′ = cos(x²)·2x.')},

const TANF=[['x^2-3*x+1',[-1,0,1,2,3]],['x^3-2*x',[-1,0,1,2]],['1/x',[1,2,-1,-2]],['sqrt(x)',[1,4,9]],['e^x',[0]],['e^(2*x)',[0]],['ln(x)',[1]],['x*e^x',[0]],['sin(x)',[0]],['arctg(x)',[0]],['x*ln(x)',[1]],['x/(x+1)',[0,1,2]],['x^2+2*x',[-3,-1,2]],['(x^2+1)/x',[1,2,-1]],['x^3',[1,-1,2]],['cos(2*x)+x',[0]],['x^4-x^2',[1,2,-1]],['2/(x+1)',[0,1,2]]];
