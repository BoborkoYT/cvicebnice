<title>Cvičebnica PRPR</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Cvičebnica PRPR">
<meta property="og:description" content="Procedurálne programovanie v C: výstup programov, operátory, cykly, funkcie, súbory, ukazovatele, reťazce a dynamická pamäť.">
<meta property="og:url" content="https://boborkoyt.github.io/cvicebnice/prpr/">
<meta property="og:image" content="https://boborkoyt.github.io/cvicebnice/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#c42a3c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ľavý panel s témami, vpravo karta s príkladom. Farby skupín v mape sú tokeny --g1 až --g6 */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1c2331; --muted:#5d6678; --rule:#dfe6f0; --line:#cfd8e6;
  --red:#c42a3c; --blue:#1d5fc4; --green:#1b8450; --amber:#b86e00;
  --ok-bg:#e3f4ea; --bad-bg:#fbe6e8; --soft:#e9eef7;
  --g1:#d6336c; --g2:#12875a; --g3:#d9730d; --g4:#6a4fd1; --g5:#0f86c4; --g6:#9a7b00; --wire:#44506a;
  --f-display:'Caveat','Segoe Print','Bradley Hand',cursive; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111620; --card:#192030; --fg:#e7ebf3; --muted:#9aa5ba; --rule:#202a3c; --line:#33415a;
  --red:#ff7f8c; --blue:#80aaff; --green:#58d28e; --amber:#f0b14a;
  --ok-bg:#16382a; --bad-bg:#44212a; --soft:#222c40; --g1:#ff7ab0; --g2:#4fd69e; --g3:#ffa94d; --g4:#a99bff; --g5:#5cc6ff; --g6:#e6c24a; --wire:#9fb0cf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111620; --card:#192030; --fg:#e7ebf3; --muted:#9aa5ba; --rule:#202a3c; --line:#33415a;
  --red:#ff7f8c; --blue:#80aaff; --green:#58d28e; --amber:#f0b14a;
  --ok-bg:#16382a; --bad-bg:#44212a; --soft:#222c40; --g1:#ff7ab0; --g2:#4fd69e; --g3:#ffa94d; --g4:#a99bff; --g5:#5cc6ff; --g6:#e6c24a; --wire:#9fb0cf; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 40px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px}
.app{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 2.6rem/1 var(--f-display);color:var(--red);margin:0;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.score{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.score div{display:flex;flex-direction:column;line-height:1.2}
.score b{font:600 1.4rem var(--f-body)}
.score span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
nav.topics{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px}
.tbtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,background .15s}
.tbtn:hover{border-color:var(--blue)}
.tbtn:focus-visible,.btn:focus-visible,.opt:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tbtn[aria-pressed="true"]{border-color:var(--blue);background:var(--soft)}
.tbtn .n{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.tbtn .n em{font-style:normal;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.tbtn .s{font-size:.8rem;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--rule);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}
.reset{all:unset;cursor:pointer;font-size:.8rem;color:var(--muted);text-decoration:underline;padding:4px 2px}
.reset:focus-visible{outline:3px solid var(--blue)}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
details.theory{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:0}
details.theory summary{cursor:pointer;padding:10px 14px;font:700 1.35rem var(--f-display);color:var(--green);list-style:none}
details.theory summary::before{content:"＋ ";font-family:var(--f-body);font-size:.9rem}
details.theory[open] summary::before{content:"− "}
details.theory .in{padding:0 16px 12px;font-size:.93rem}
details.theory ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.card{scroll-margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.chip{background:var(--soft);color:var(--blue);padding:3px 10px;border-radius:99px;font-weight:600}
.prompt{font-size:1.05rem;min-width:0}
.prompt p{margin:.5em 0}.muted{color:var(--muted);font-size:.88rem}
.eq{margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;overflow-x:auto;max-width:100%;padding-block:4px}
.gap{display:inline-block;width:14px}
.lbl{color:var(--blue);font-weight:600;white-space:nowrap}
.sys{display:inline-flex;flex-direction:column;gap:2px;margin:8px 0;padding:4px 0 4px 14px;border-left:3px solid var(--blue);font-size:1.1rem;font-variant-numeric:tabular-nums}
.op{display:inline-block;background:var(--soft);color:var(--red);padding:1px 8px;border-radius:6px;font-family:var(--f-mono);font-size:.88em;white-space:nowrap}
.mx{display:inline-block;position:relative;padding:4px 10px;margin:0 3px;vertical-align:middle}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:7px;border:2px solid currentColor}
.mx::before{left:0;border-right:0}.mx::after{right:0;border-left:0}
.mx table{border-collapse:collapse}
.mx td{padding:3px 9px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx td.aug{border-left:2px solid currentColor}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.1;margin:0 .1em}
.fr i{font-style:normal;padding:0 .2em}.fr i:first-child{border-bottom:1.5px solid currentColor}
.answer{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--soft);border-radius:10px;max-width:100%;overflow-x:auto}
.answer .lbl2{font:700 1.25rem var(--f-display);color:var(--red)}
.cell{font:500 1rem var(--f-mono);width:4.6em;padding:6px 6px;text-align:center;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg)}
.cell:focus{outline:3px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.cell.ok{border-color:var(--green);background:var(--ok-bg)}.cell.bad{border-color:var(--red);background:var(--bad-bg)}
.cell:read-only{cursor:default}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ln .t{white-space:nowrap}
.mx.in td{padding:3px 4px}
.opts{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:520px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:10px 14px;display:block}
.opt:hover{border-color:var(--blue)}
.opt[aria-checked="true"]{border-color:var(--blue);background:var(--soft)}
.opt.ok{border-color:var(--green);background:var(--ok-bg)}.opt.bad{border-color:var(--red);background:var(--bad-bg)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:9px;font-weight:600;border:1.5px solid var(--line);background:var(--card);color:var(--fg)}
.btn:hover{border-color:var(--blue)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.main{color:#0d1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#0d1424}}
.btn[disabled]{opacity:.45;cursor:default}
.fb{padding:10px 14px;border-radius:9px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--green)}.fb.bad{background:var(--bad-bg);color:var(--red)}.fb.warn{background:var(--soft);color:var(--amber)}
.sol{border-top:2px dashed var(--line);padding-top:12px}
.sol h3{font:700 1.4rem var(--f-display);color:var(--green);margin:0 0 4px}
.sol p{margin:.4em 0}.sol ul{margin:.4em 0;padding-left:1.2em}
.steps{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;overflow-x:auto;max-width:100%}
.st .op{min-width:8.5em}
kbd{font:500 .8em var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:5px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--line)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 16px;font-weight:600;color:var(--muted);border:2px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;margin-bottom:-2px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--blue);background:var(--card);border-color:var(--line)}
.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.split{display:flex;flex-direction:column;gap:14px;min-width:0}
.tpane{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 20px 18px;min-width:0}
.tpane h3{font:700 2rem/1.1 var(--f-display);color:var(--red);margin:12px 0 0}
.tsec{padding-top:14px}
.tsec h4{font:700 1.45rem/1.1 var(--f-display);color:var(--green);margin:0 0 4px}
.tsec p{margin:.4em 0}.tsec ul,.tsec ol{margin:.4em 0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tex{border-left:3px solid var(--blue);background:var(--soft);border-radius:0 8px 8px 0;padding:6px 12px;margin:8px 0;overflow-x:auto;max-width:100%}
.tex p{margin:.3em 0}
.app[data-view="theory"]{max-width:1320px}
.app[data-view="theory"] details.theory{display:none}
.app[data-view="theory"] .tpane{display:block}
@media (min-width:1100px){
  .app[data-view="theory"] .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:18px}
  .app[data-view="theory"] .card{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
}

.ttwrap{overflow-x:auto;max-width:100%;margin:8px 0}
.tt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tt th,.tt td{border:1px solid var(--line);padding:3px 10px;text-align:center}
.tt th{background:var(--soft);font-weight:600}
.tt td.de{color:var(--muted)}
.tt td.o.one{color:var(--blue);font-weight:600}
.tt.tl td,.tt.tl th{text-align:left}
details.gl{margin:4px 0}details.gl summary{cursor:pointer;color:var(--muted);font-size:.85rem}
details.gl ul,ul.gl2{margin:4px 0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:2px 22px}
.cell.wide{width:11em;text-align:left}
.cell.expr{width:min(100%,26em);text-align:left;font-size:1.05rem}
.cell.warn{border-color:var(--amber)}
.insbar{display:flex;gap:6px;flex-wrap:wrap}
.ib{all:unset;box-sizing:border-box;cursor:pointer;min-width:2.4rem;text-align:center;padding:5px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);font:500 1rem var(--f-mono)}
.ib:hover{border-color:var(--blue)}.ib:focus-visible{outline:3px solid var(--blue)}
.rowsq{display:flex;flex-direction:column;gap:10px}
.rq{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:8px}
.rl{flex:1 1 18em;min-width:0}
.ro{display:flex;gap:6px}
.opt.sm{padding:6px 12px;font-size:.9rem;white-space:nowrap}
code.w{font:500 1rem var(--f-mono);background:var(--soft);padding:1px 8px;border-radius:6px;letter-spacing:.1em}
.cell{width:3.6em}
.ln .cell.expr{width:min(100%,26em)}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.topics{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px;gap:8px}
  .tbtn{flex:0 0 auto;min-width:170px}
  .tbtn .s{display:none}
  h1{font-size:2.2rem}.card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- PRPR: kód a výstup programu --- */
pre.code{margin:10px 0;padding:12px 14px;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;overflow-x:auto;font:500 .88rem/1.5 var(--f-mono);max-width:100%;tab-size:4}
pre.code code{font:inherit;white-space:pre}
pre.code.inl{margin:0;padding:6px 10px;font-size:.82rem;background:transparent;border:0}
pre.code .k{color:var(--blue);font-weight:600}pre.code .c{color:var(--muted);font-style:italic}pre.code .s{color:var(--green)}pre.code .p{color:var(--amber)}pre.code .n{color:var(--red)}
code.ic{font:500 .88em var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:5px;white-space:pre-wrap}
pre.outbox{margin:6px 0;padding:8px 12px;background:var(--card);border:1.5px dashed var(--line);border-radius:8px;font:500 .9rem/1.45 var(--f-mono);overflow-x:auto;max-width:100%}
textarea.cell.out{width:min(100%,36em);min-height:5.5em;text-align:left;font:500 .95rem/1.45 var(--f-mono);resize:vertical;white-space:pre;overflow:auto}
.tt.tl td code.ic{white-space:nowrap}
@media (min-width:821px){nav.topics{max-height:calc(100vh - 32px);overflow-y:auto;padding-right:4px}}
.opt pre.code{overflow-x:auto}
</style>
<style>.backlink{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;padding:6px 12px 6px 10px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);transition:border-color .15s,color .15s}.backlink:hover{color:var(--blue);border-color:var(--blue)}.backlink:focus-visible{outline:3px solid var(--blue);outline-offset:2px}</style>
<div class="app" id="app" data-view="practice">
  <a class="backlink" href="../">← Cvičebnice</a>
  <header class="top">
    <div>
      <h1>Cvičebnica PRPR</h1>
      <p class="sub">Procedurálne programovanie v jazyku C: operátory, cykly, funkcie, súbory, ukazovatele, reťazce a dynamická pamäť. Každý príklad je nový, programy si odkrokuješ sám.</p>
    </div>
    <div class="score" id="score"></div>
  </header>
  <div class="tabs" role="tablist" aria-label="Zobrazenie"><button class="tab" role="tab" id="tab-practice" aria-selected="true" data-v="practice">Cvičenie</button><button class="tab" role="tab" id="tab-theory" aria-selected="false" data-v="theory">Teória + cvičenie</button></div>
  <div class="layout">
    <nav class="topics" id="nav" aria-label="Témy"></nav>
    <main>
      <details class="theory" id="theory"><summary></summary><div class="in"></div></details>
      <div class="split"><article class="tpane" id="tpane" aria-label="Teória"></article><section class="card" id="card" aria-live="off"></section></div>
    </main>
  </div>
</div>
<style>
/* --- nadstavby: skúška, ťahák, kartičky, tlač --- */
.xv,#printarea{display:none}
.app[data-view="exam"] #xv-exam,.app[data-view="sheet"] #xv-sheet,.app[data-view="cards"] #xv-cards{display:block}
.app[data-view="exam"] .layout,.app[data-view="sheet"] .layout,.app[data-view="cards"] .layout{display:none}
.xcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px 20px;margin-bottom:14px}
.xcard h3,.xv h4{font:700 1.7rem/1.1 var(--f-display);color:var(--red);margin:0 0 6px}
.xv h4{font-size:1.3rem;color:var(--green);margin:14px 0 6px}
.xgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.xgrid{grid-template-columns:minmax(0,1fr)}}
.chks{display:flex;flex-direction:column;gap:4px}
.chk,.fld{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.chk input{margin-top:.3em;accent-color:var(--blue)}
.fld{flex-direction:column;gap:4px;margin:8px 0;font-weight:600}
.fld select{font:500 1rem var(--f-body);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);max-width:100%}
.xhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px;padding:10px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.xtime{font:600 1.3rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--blue)}.xtime.low{color:var(--red)}
.weak{margin:4px 0;padding-left:1.2em}
details.rev{background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin:8px 0;padding:0 14px}
details.rev summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none}
details.rev .mark{display:inline-block;width:1.5em;text-align:center;font-weight:700}
details.rev.ok{border-color:var(--green)}details.rev.ok .mark{color:var(--green)}
details.rev.bad{border-color:var(--red)}details.rev.bad .mark{color:var(--red)}
details.rev[open]{padding-bottom:12px}
.chl{margin:6px 0;padding-left:1.2em}.chl .right{color:var(--green)}
.golink{all:unset;cursor:pointer;margin-left:12px;color:var(--blue);text-decoration:underline;font-weight:500}
.golink:focus-visible{outline:3px solid var(--blue)}
label.focus{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:var(--muted);padding:6px 2px}
label.focus input{accent-color:var(--blue);margin-top:.2em}
.io{display:flex;flex-direction:column;gap:2px}
.sheetgrid{columns:2 320px;column-gap:20px}
.sheetgrid section{break-inside:avoid;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:2px 14px 10px;margin:0 0 14px;font-size:.9rem}
.sheetgrid ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.flash{background:var(--soft);border-radius:12px;padding:18px 20px;margin:12px 0;min-height:7em}
.flash.back{border:2px solid var(--green)}
.flash .ans{margin:12px 0;padding:8px 12px;background:var(--ok-bg);border-radius:8px}
.lab{border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 14px 14px;margin:14px 0}
.lab h5{font:700 1.25rem var(--f-display);color:var(--red);margin:0 0 6px}
.lab .ctr{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:8px}
.lab label{display:grid;grid-template-columns:minmax(7em,auto) minmax(0,1fr) 3.6em;gap:8px;align-items:center;font-size:.9rem}
.lab label b{font:500 .85rem var(--f-mono);text-align:right}
.lab input[type=range]{width:100%;accent-color:var(--blue)}
.lab select{font:500 .95rem var(--f-body);padding:5px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);max-width:100%}
.lab .out{margin-top:6px;font-size:.92rem;min-height:2.6em}
.lab .plotw{margin:0 auto}
.apl{border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 14px 14px;margin:12px 0}
.apl h5{font:700 1.25rem var(--f-display);color:var(--red);margin:0 0 6px}
.apl .wd{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.apl .wd span{min-width:2em;text-align:center;padding:3px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);font:500 1rem var(--f-mono)}
.apl .wd span.cur{border-color:var(--blue);background:var(--blue);color:#fff}
.apl .wd span.done{color:var(--muted)}
.apl .st-out{font-size:.92rem;min-height:2.2em;margin:4px 0}
.apl .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

function cfix(x,n){
  const ax=Math.abs(x);let s=ax.toFixed(n);
  const sc=Math.pow(10,n),y=ax*sc;
  if(y-Math.floor(y)===0.5&&Number.isInteger(ax*Math.pow(2,n+1))){const f=Math.floor(y);s=((f%2===0?f:f+1)/sc).toFixed(n)}

function cg(x,p,up){
  if(p===undefined)p=6;if(p===0)p=1;

    if(cv==='%')return'%';

  let tot=0;const o=rows.map(r=>{const w=wage(r.m,r.h);tot+=w;return `Hod. mzda: ${cprintf('%.2f',r.m)}, hodin: ${cprintf('%.2f',r.h)}, spolu: ${cprintf('%.2f',w)}`});
  const src=`double tyzdenna_mzda(double h_mzda, double hod) {\n    if (hod <= 40)\n        return h_mzda * hod;\n    return h_mzda * 40 + (hod - 40) * h_mzda * 1.5;\n}\n\nint main() {\n    int n, i;\n    double m, h, w, spolu = 0;\n    scanf("%d", &n);\n    for (i = 0; i < n; i++) {\n        scanf("%lf %lf", &m, &h);\n        w = tyzdenna_mzda(m, h);\n        spolu += w;\n        printf("Hod. mzda: %.2f, hodin: %.2f, spolu: %.2f\\n", m, h, w);\n    }\n    printf("Celkova mzda: %.2f\\n", spolu);\n    return 0;\n}`;
  return outQ('Týždenná mzda (cvičenie 4.2)','Hodiny nad 40 sa platia 1,5-násobne.',src,o.join('\n')+`\nCelkova mzda: ${cprintf('%.2f',tot)}`,`<p>${rows.map(r=>`${r.m} €/h, ${r.h} h: ${r.h<=40?`${r.m}·${r.h}`:`${r.m}·40 + ${r.h-40}·${r.m}·1,5`} = ${cprintf('%.2f',wage(r.m,r.h))}`).join('<br>')}</p>`,{stdin:`${n}\n`+rows.map(r=>`${r.m} ${r.h}`).join('\n')})},
 ()=>{ // minimum a maximum
  const n=R(3,5),v=Array.from({length:n},()=>+(R(10,2000)/100).toFixed(2));
  const src=`int main() {\n    int n, i;\n    double x, min, max;\n    scanf("%d", &n);\n    scanf("%lf", &x);\n    min = max = x;\n    for (i = 1; i < n; i++) {\n        scanf("%lf", &x);\n        if (x < min)\n            min = x;\n        if (x > max)\n            max = x;\n    }\n    printf("Minimum: %.2f\\n", min);\n    printf("Maximum: %.2f\\n", max);\n    return 0;\n}`;
  return outQ('Minimum a maximum (cvičenie 2.8)','Prvé načítané číslo je počiatočné minimum aj maximum, ďalšie sa s nimi porovnávajú.',src,`Minimum: ${cprintf('%.2f',Math.min(...v))}\nMaximum: ${cprintf('%.2f',Math.max(...v))}`,`<p>Čísla: ${v.join(', ')}.</p>`,{stdin:`${n}\n`+v.join('\n')})},
 ()=>{ // postupnosť (cvičenie 2.9)
  const n=R(4,6);let a=[R(0,10)];for(let i=1;i<n;i++){const p=a[i-1];a.push(R(Math.max(0,Math.ceil(p/2)),2*p+1))}
  if(Math.random()<.5){const k=R(0,n-1);a[k]=pick([a[k]+R(5,15),a[k]+30,-1])}
  let ok=1;if(a[0]<0||a[0]>10)ok=0;for(let i=1;i<n;i++)if(a[i]>2*a[i-1]||2*a[i]<a[i-1])ok=0;
  const src=`int main() {\n    int a[${n}], i, ok = 1;\n    for (i = 0; i < ${n}; i++)\n        scanf("%d", &a[i]);\n    if (a[0] < 0 || a[0] > 10)\n        ok = 0;\n    for (i = 1; i < ${n}; i++)\n        if (a[i] > 2 * a[i - 1] || 2 * a[i] < a[i - 1])\n            ok = 0;\n    if (ok)\n        printf("Postupnost je spravna\\n");\n    else\n        printf("Postupnost nie je spravna\\n");\n    return 0;\n}`;
  const bad=[];if(a[0]<0||a[0]>10)bad.push('prvé číslo mimo <0, 10>');for(let i=1;i<n;i++){if(a[i]>2*a[i-1])bad.push(`${a[i]} je viac než dvojnásobok ${a[i-1]}`);else if(2*a[i]<a[i-1])bad.push(`${a[i]} je menej než polovica ${a[i-1]}`)}
  return outQ('Kontrola postupnosti (cvičenie 2.9)','Každý prvok musí byť najviac dvojnásobok predchádzajúceho a aspoň jeho polovica, prvý prvok má byť z intervalu <0, 10>.',src,ok?'Postupnost je spravna':'Postupnost nie je spravna',`<p>Postupnosť ${a.join(', ')}: ${ok?'všetky podmienky platia.':'porušená podmienka: '+bad.join('; ')+'.'}</p>`,{stdin:a.join('\n')})},
 ()=>{ // kalkulačka
  const ops=['+','-','*','/','%'];const op=pick(['+','-','*','/','+','-','*','/','%']);const x=R(1,40),y=R(1,9);
  const src=`int main() {\n    int a, b;\n    char op;\n    scanf("%d %d %c", &a, &b, &op);\n    switch (op) {\n        case '+':\n            printf("%d + %d = %d\\n", a, b, a + b);\n            break;\n        case '-':\n            printf("%d - %d = %d\\n", a, b, a - b);\n            break;\n        case '*':\n            printf("%d * %d = %d\\n", a, b, a * b);\n            break;\n        case '/':\n            printf("%d / %d = %d\\n", a, b, a / b);\n            break;\n        default:\n            printf("Zle zadana volba.\\n");\n    }\n    return 0;\n}`;
  const o=op==='%'?'Zle zadana volba.':`${x} ${op} ${y} = ${op==='+'?x+y:op==='-'?x-y:op==='*'?x*y:tdiv(x,y)}`;

];

const tsec=(h,b)=>`<section class="tsec"><h4>${h}</h4>${b}</section>`;

 tsec('Kompilovanie programu v C',`<p>Zdrojový súbor <code class="ic">program.c</code> sa preloží do spustiteľného súboru v niekoľkých fázach. Príkaz <code class="ic">gcc program.c -o program</code> vykoná všetky, prepínače zastavia preklad skôr.</p>${tbl(['Fáza','Príkaz','Čo sa stane'],[['Predspracovanie','gcc -E program.c','odstránia sa komentáre, vložia sa hlavičkové súbory (#include), rozvinú sa makrá'],['Kompilácia','gcc -S program.c','kontrola syntaxe, preklad do asemblerového kódu (.s)'],['Zostavovanie','gcc -c program.c','asembler → strojový kód, objektový súbor .o s relatívnymi adresami'],['Linkovanie','gcc program.o','spojenie objektových súborov a knižníc, vznikne spustiteľný súbor (a.out)']])}<p>Prepínač <code class="ic">-o meno</code> určí meno výstupného súboru. Ladenie (debugger) slúži na krokovanie programu.</p>`)+
 tsec('Najjednoduchší program',code(`#include <stdio.h>\n\nint main(void) {\n    printf("Hello world\\n");\n    return 0;\n}`)+`<p><code class="ic">#include</code> vloží hlavičkový súbor s deklaráciami funkcií (tu printf). Program začína funkciou <b>main</b>, návratová hodnota 0 znamená, že nenastala chyba.</p>`)+
 tsec('Vlastnosti jazyka C',`<ul><li>procedurálny jazyk nízkej úrovne, štrukturovaný, rýchly, prenositeľný (ANSI C, C89, C99, …)</li><li>C <b>nepodporuje</b>: výnimky, kontrolu rozsahu indexov (range-checking), automatickú správu pamäte (garbage collection), objekty, polymorfizmus</li><li>komentáre: <code class="ic">/* … */</code>, nevnárajú sa; v C99 aj <code class="ic">// …</code></li></ul>`)+
 tsec('Názvy premenných',`<ul><li>začínajú písmenom alebo _, obsahujú len písmená, číslice a _</li><li>rozlišujú sa veľké a malé písmená (pom, Pom, POM sú rôzne)</li><li>nesmú byť kľúčovým slovom (int, for, while, return …)</li><li>názvy začínajúce _ sú systémové, nepoužívať</li></ul><p><b>Definícia</b> premennej (int i;) pridelí pamäť, <b>deklarácia</b> len oznámi typ. Neinicializovaná lokálna premenná má náhodnú hodnotu.</p>`);
SUM.kom='<ul><li>Fázy: preprocesor (-E), kompilátor (-S), assembler (-c), linker; -o meno.</li><li>C nemá range-checking, výnimky ani garbage collection.</li><li>Komentáre sa nevnárajú. Neinicializovaná lokálna premenná je náhodná.</li><li>Názov: písmeno alebo _, potom písmená, číslice, _; nie kľúčové slovo.</li></ul>';

 tsec('printf: formáty',tbl(['Formát','Význam','Príklad (hodnota → výstup)'],[['%d','celé číslo (int)','42 → 42'],['%5d / %-5d / %05d','šírka 5: vpravo / vľavo / doplnené nulami','42 → "   42" / "42   " / 00042'],['%c','znak','65 → A'],['%x, %X, %o','šestnástková malými / veľkými, osmičková','255 → ff, FF, 377'],['%f, %.2f, %8.3f','reálne číslo, počet desatinných miest, šírka','3.14159 → 3.141590, 3.14, "   3.142"'],['%g','kratší zápis reálneho čísla bez zbytočných núl','0.5 → 0.5, 100.0 → 100'],['%e','vedecký zápis','1234.5 → 1.234500e+03'],['%s, %p, %%','reťazec, adresa, znak %','']])+`<p>Počet argumentov musí súhlasiť s počtom %. Pre long sa používa %ld, pre size_t %zu. Pri <b>scanf</b> sa pre <b>double</b> používa <b>%lf</b>, pre float %f a vždy sa odovzdáva <b>adresa</b> (&i).</p>`)+
 tsec('scanf a vstup',`<p><code class="ic">scanf</code> vráti počet úspešne načítaných položiek (pri konci vstupu EOF). Pri %d, %f sa biele znaky (medzera, nový riadok) preskakujú. Pri <b>%c</b> sa nepreskakujú: po <code class="ic">scanf("%d", &n)</code> zostane vo vstupe znak nového riadku, ktorý by %c prečítal. Medzera vo formáte (<code class="ic">" %c"</code>) preskočí biele znaky.</p>${code(`int n;\nchar c;\nscanf("%d", &n);   /* vo vstupe zostane \\n */\nscanf(" %c", &c);  /* medzera preskočí \\n */`)}<p>Na jeden znak je pohodlnejšie <code class="ic">getchar()</code>. Escape sekvencie: \\n nový riadok, \\t tabulátor, \\\\ spätné lomítko, \\" úvodzovky, \\' apostrof, %% znak %.</p>`)+
 tsec('Znaky a ASCII',`<p>Znak je číslo: 'A' = 65, 'a' = 97, '0' = 48. Veľké písmená 65–90, malé 97–122 (rozdiel 32). Preto <code class="ic">c + 'a' - 'A'</code> zmení veľké písmeno na malé.</p>`);
SUM.typ='<ul><li>char 1, short 2, int 4, long 8, float 4, double 8, ukazovateľ 8 bajtov.</li><li>scanf: &adresa, double %lf. printf: %d %c %f %.2f %5d %x %s %%.</li><li>unsigned pretečie modulo 2<sup>n</sup>. scanf("%c") neignoruje biele znaky.</li><li>\'A\' = 65, \'a\' = 97, \'0\' = 48.</li></ul>';

FULL.op=
 tsec('Aritmetické operátory',`<ul><li><b>/</b>: int / int je celočíselné delenie (odreže sa desatinná časť), ak je aspoň jeden operand reálny, deli sa reálne.</li><li><b>%</b> je zvyšok po delení: a = (a / b)·b + a % b. Znamienko zvyšku je znamienko a.</li><li>Rozšírené priradenie: <code class="ic">x += y</code> je x = x + y, podobne -=, *=, /=, %=.</li></ul>${code(`int i = 5, j = 13;\nj = j / 4;   /* 3 */\nj = i % 3;   /* 2 */`)}`)+
 tsec('Priorita a asociativita',`<p>Od najvyššej: <b>++ -- !</b>, potom <b>* / %</b>, <b>+ -</b>, <b>&lt; &gt; &lt;= &gt;=</b>, <b>== !=</b>, <b>&amp;&amp;</b>, <b>||</b>, <b>=</b>. Väčšina operátorov sa vyhodnocuje zľava doprava, výnimky sú ! ++ -- a priradenie (a = b = c sa vyhodnotí sprava). Ak si nie si istý, použi zátvorky.</p>`)+
 tsec('Inkrement a dekrement',code(`int i = 5, j = 1, k;\ni++;         /* i = 6 */\nj = ++i;     /* i = 7, j = 7  (najprv zväčší) */\nj = i++;     /* j = 7, i = 8  (najprv použije) */\nk = --j + 2; /* j = 6, k = 8 */`)+`<p>Prefix (++x) zmení hodnotu pred jej použitím, postfix (x++) po použití.</p>`)+
 tsec('Relačné a logické operátory',`<p>Výsledok porovnania je 1 (pravda) alebo 0 (nepravda). Nenulová hodnota je pravda. Pozor: <b>=</b> je priradenie, <b>==</b> porovnanie (<code class="ic">if (x = 5)</code> je vždy pravda).</p><p><b>Skrátené vyhodnocovanie</b>: pri <code class="ic">&&</code> sa druhý operand nevyhodnotí, ak je prvý nepravda, pri <code class="ic">||</code>, ak je prvý pravda. Vedľajšie účinky druhého operandu (++, --) sa potom nevykonajú.</p>`)+
 tsec('Bitové operátory',`<p><b>&</b> AND, <b>|</b> OR, <b>^</b> XOR, <b>~</b> negácia bitov, <b>&lt;&lt;</b> posun doľava (× 2<sup>k</sup>), <b>&gt;&gt;</b> posun doprava (÷ 2<sup>k</sup>). Nezamieňaj && s &, || s |.</p>`)+
 tsec('Ternárny operátor a čiarka',`<p><code class="ic">podmienka ? výraz1 : výraz2</code>, napr. <code class="ic">k = (i > j) ? i : j;</code> je maximum. Viaže sa sprava: a ? b : c ? d : e = a ? b : (c ? d : e). Čiarka vyhodnotí výrazy zľava doprava, hodnotou je posledný (používa sa v hlavičke cyklu for).</p>`);
SUM.op='<ul><li>int / int celočíselne, % zvyšok (znamienko podľa delenca).</li><li>Priorita: ++ -- !, * / %, + -, relačné, == !=, &&, ||, =.</li><li>Prefix ++x pred použitím, postfix x++ po použití.</li><li>&& a || sa vyhodnocujú skrátene. = nie je ==.</li><li>& | ^ ~ << >> sú bitové.</li></ul>';

FULL.typk=

FULL.ptr=
 tsec('Premenná a ukazovateľ',code(`int i = -10;\nint *p_i = &i;     /* p_i obsahuje adresu premennej i */\n*p_i = 5;          /* zmení i na 5 */\nint **pp = &p_i;   /* ukazovateľ na ukazovateľ */\n**pp = 7;          /* zmení i na 7 */\nint *q = NULL;     /* nikam neukazuje */`)+`<ul><li><b>&</b> je operátor adresy, <b>*</b> operátor dereferencie (hodnota na adrese).</li><li>Dereferencia <b>NULL</b> alebo neinicializovaného ukazovateľa → pád (segmentation fault).</li><li>V <code class="ic">int *p, q;</code> je p ukazovateľ, q len int.</li><li>Ukazovateľ má 8 bajtov, bez ohľadu na typ, na ktorý ukazuje. <code class="ic">%p</code> vypíše adresu.</li><li>Pamäť programu: inštrukcie, statické dáta (globálne premenné), zásobník (lokálne premenné), halda (malloc).</li></ul>`)+
 tsec('Aritmetika s ukazovateľmi',code(`int a[5] = {10, 20, 30, 40, 50};\nint *p = a;          /* a je adresa a[0] */\n*(p + 2);            /* a[2] = 30, p sa nemení */\np++;                 /* p ukazuje na a[1] */\np[1];                /* a[2] */\n&a[4] - &a[1];       /* 3 prvky */\n*p++;                /* *(p++): hodnota, potom posun */\n(*p)++;              /* zväčší hodnotu */`)+`<p>p + k posunie ukazovateľ o k <b>prvkov</b> (nie bajtov). *(p + k) je to isté ako p[k].</p>`)+
 tsec('Odovzdanie odkazom, void *, funkcie',code(`void vymen(int *a, int *b) {\n    int pom = *a;\n    *a = *b;\n    *b = pom;\n}\n...\nvymen(&x, &y);            /* zmení x aj y */\n\nvoid *pv = &k;\n*(int *) pv = -1;         /* void * treba pretypovať */\n\nint (*op)(int, int) = &add;\nprintf("%d", (*op)(2, 3));  /* ukazovateľ na funkciu */`)+`<p>Pri zmene hodnoty v inej funkcii odovzdáme jej adresu premennej. Signatúra funkcie (typy parametrov a návratový typ) musí zodpovedať typu ukazovateľa.</p>`);
SUM.ptr='<ul><li>&x adresa, *p hodnota. p = &x zmení cieľ, *p = k zmení hodnotu.</li><li>p + k posúva o k prvkov, *(p + k) = p[k].</li><li>NULL nedereferencovať. void * pretypovať.</li><li>Zmena premennej vo funkcii: odovzdať &x a použiť *p. int *p, q; → q je int.</li></ul>';

FULL.pol=

 tsec('Pole ako parameter funkcie',code(`int maximum(int pole[], int n) {\n    int *p_max = pole, *p;\n    for (p = pole + 1; p < pole + n; p++)\n        if (*p > *p_max)\n            p_max = p;\n    return *p_max;\n}\n/* volanie: maximum(a, 5)  alebo  maximum(&a[1], 3) */`)+`<p>Funkcia dostane adresu prvého prvku (pole sa nekopíruje), preto môže prvky meniť. V parametri <code class="ic">int a[]</code> je a v skutočnosti ukazovateľ a <code class="ic">sizeof(a)</code> je 8, takže počet prvkov treba odovzdať samostatne.</p>`);

FULL.mem=

 tsec('Typické chyby',`<ul><li><b>malloc(n)</b> namiesto <b>n * sizeof(int)</b>.</li><li>Zabudnuté <b>free</b> (únik pamäte), dvojité free, použitie po free.</li><li>Zápis mimo bloku (<code class="ic">i &lt;= n</code>).</li><li><code class="ic">if (p = NULL)</code> namiesto ==.</li><li>Vrátenie adresy lokálnej premennej (<code class="ic">return &x;</code>).</li><li><code class="ic">sizeof(p)</code> pre ukazovateľ je 8, nie veľkosť bloku.</li><li>Funkcia, ktorá má vytvoriť pole pre volajúceho, musí vrátiť ukazovateľ alebo dostať <code class="ic">int **</code>.</li></ul>`);

/* ---------- parsovanie polí ---------- */
function parseNum(s){s=String(s).trim().replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s+/g,'');if(!s)return null;
  let m=s.match(/^([+-]?)(\d+)\/(\d+)$/);if(m){const d=+m[3];if(!d)return null;return(m[1]==='-'?-1:1)*(+m[2])/d}
  m=s.match(/^([+-]?)(\d+)(?:\.(\d+))?$/);if(m)return(m[1]==='-'?-1:1)*parseFloat(m[2]+(m[3]?'.'+m[3]:''));return null}
function parseTok(s){s=String(s).trim().toLowerCase();if(s==='-'||s==='×')s='x';return['0','1','x'].includes(s)?s:null}
function parseSet(s){s=String(s).trim();if(s===''||s==='-'||s==='∅'||s==='–'){return s===''?null:[]}
  const p=s.split(/[\s,;]+/).filter(Boolean);if(!p.every(x=>/^\d+$/.test(x)))return null;return uniq(p.map(Number)).sort((a,b)=>a-b)}
const PARSE={num:parseNum,tok:parseTok,set:parseSet};
const same=(m,u,a)=>m==='num'?Math.abs(u-a)<1e-9:m==='set'?JSON.stringify(u)===JSON.stringify(a):u===a;
const showVal=(m,a)=>m==='set'?(a.length?a.join(', '):'-'):m==='num'?String(Math.round(a*1e6)/1e6).replace('-','−'):String(a);

/* ---------- navigácia ---------- */
function renderNav(){
  const all=totals();
  const btn=(id,name,short,st)=>`<button class="tbtn" data-id="${id}" aria-pressed="${S.topic===id}"><span class="n"><span>${name}</span><em>${st.ok}/${st.total}</em></span><span class="s">${short}</span><div class="bar"><i style="width:${st.total?Math.round(100*st.ok/st.total):0}%"></i></div></button>`;
  $('#nav').innerHTML=(S.view==='theory'?'':btn('mix','Všetko dokopy','náhodná téma',all))+TOPICS.map(t=>btn(t.id,t.name,t.short,tstat(t.id))).join('')+`<button class="reset" id="reset">Vynulovať štatistiku</button>`;
  $('#nav').querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{S.topic=b.dataset.id;renderTheory();if(S.view==='theory')window.scrollTo({top:0});next()});
  $('#reset').onclick=()=>{ST={stats:{},streak:0,best:0};save();renderNav()};
  renderScore()}
function renderScore(){const a=totals();
  $('#score').innerHTML=`<div><b>${a.ok}/${a.total}</b><span>správne na 1. pokus</span></div><div><b>${ST.streak}</b><span>v rade</span></div><div><b>${ST.best}</b><span>najlepšia séria</span></div>`}
function renderTheory(){
  const t=TOPICS.find(x=>x.id===S.topic),d=$('#theory'),p=$('#tpane');
  if(!t){d.hidden=true;p.innerHTML='';return}
  d.hidden=false;d.querySelector('summary').textContent='Zhrnutie z prednášok: '+t.name;d.querySelector('.in').innerHTML=t.theory;
  p.innerHTML=`<h3>${t.name}</h3>${t.full}`}
function setView(v){
  S.view=v;$('#app').dataset.view=v;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(v==='theory'&&S.topic==='mix'){S.topic='arch';renderTheory();next()}else{renderTheory();renderNav()}
  $('#tpane').scrollTop=0}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ---------- otázky ---------- */
function next(){

  card.querySelector('#xok').onclick=()=>{if(EX.busy)return;getS().counted=false;check()};
  card.querySelector('#xskip').onclick=()=>{if(EX.busy)return;EX.busy=true;examAdvance(false,true)};
  const f=card.querySelector('input.cell');if(f&&matchMedia('(hover:hover)').matches)f.focus({preventScroll:true})}
function examAdvance(ok,skipped){
  if(!EX||!EX.run)return;
  const it=EX.qs[EX.i];
  EX.log.push({t:it.t,q:it.q,ok,skipped});
  LASTGI=it.gi;weakUpd(ok,it.q,it.t);
  const s=tstat(it.t.id);s.total++;if(ok)s.ok++;save();
  EX.i++;
  if(EX.i>=EX.qs.length)finishExam(false);else showExamQ()}
function leaveExam(){
  if(!EX||!EX.run)return;
  EX.run=false;clearInterval(EX.timer);
  const card=document.getElementById('card'),split=document.querySelector('.split');
  if(card&&split&&card.parentNode!==split)split.appendChild(card);
  next()}
function finishExam(forced){
  if(!EX||!EX.run)return;
  const rest=EX.qs.slice(EX.log.length);
  rest.forEach(it=>{EX.log.push({t:it.t,q:it.q,ok:false,skipped:true,missed:true});LASTGI=it.gi;weakUpd(false,it.q,it.t);const s=tstat(it.t.id);s.total++;save()});
  const dur=Date.now()-EX.start,log=EX.log,t0=EX.qs;
  EX.run=false;clearInterval(EX.timer);
  const card=document.getElementById('card'),split=document.querySelector('.split');
  if(card&&split)split.appendChild(card);
  next();
  const ok=log.filter(l=>l.ok).length,n=log.length,pct=Math.round(100*ok/n);
  const by={};log.forEach(l=>{const b=by[l.t.name]||(by[l.t.name]={ok:0,n:0});b.n++;if(l.ok)b.ok++});
  const msg=pct>=90?'Výborne.':pct>=70?'Dobre, ešte pár chýb.':pct>=50?'Zatiaľ hranica, pozri si chyby nižšie.':'Treba ešte precvičovať, ale tvoje slabé miesta sú teraz zaznamenané.';
  const sec=Math.round(dur/1000);
  const box=document.getElementById('xv-exam');
  box.innerHTML=`<div class="xcard"><h3>Výsledok: ${ok} z ${n} (${pct} %)</h3><p>${msg} Čas: ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}.</p>
   <div class="ttwrap"><table class="tt"><thead><tr><th>Téma</th><th>Správne</th></tr></thead><tbody>${Object.entries(by).map(([k,v])=>`<tr><td style="text-align:left">${k}</td><td>${v.ok} / ${v.n}</td></tr>`).join('')}</tbody></table></div>
   <div class="actions"><button class="btn main" id="xagain">Nová skúška</button><button class="btn" id="xwrong">Zopakovať len chybné témy</button></div></div>
   <h4>Rozbor</h4>${log.map((l,i)=>`<details class="rev ${l.ok?'ok':'bad'}"><summary><span class="mark">${l.ok?'✓':'✗'}</span> ${i+1}. ${l.q.kind} <span class="muted">· ${l.t.name}${l.missed?' · nestihol si':l.skipped?' · preskočené':''}</span></summary><div class="prompt">${l.q.prompt}${choiceList(l.q)}</div><div class="sol"><h3>Postup</h3>${l.q.solution}</div></details>`).join('')}`;
  box.querySelector('#xagain').onclick=renderExam;
  box.querySelector('#xwrong').onclick=()=>{const ids=[...new Set(log.filter(l=>!l.ok).map(l=>l.t.id))];XCFG.topics=ids.length?ids:XCFG.topics;renderExam()};
  EX=null;window.scrollTo({top:0})}
function choiceList(q){
  const inp=q.input;if(inp.t==='choice')return`<ul class="chl">${inp.opts.map((o,i)=>`<li class="${i===q.answer[0]?'right':''}">${o}${i===q.answer[0]?' <b>(správne)</b>':''}</li>`).join('')}</ul>`;
  if(inp.t==='rows')return`<ul class="chl">${inp.rows.map((r,i)=>`<li>${r.label} <b>→ ${r.opts[q.answer[i]]}</b></li>`).join('')}</ul>`;
  return''}

/* ---------- pracovný list na tlač ---------- */
function printSheet(cfg){
  const items=genItems(cfg);if(!items.length)return;
  const task=it=>{const inp=it.q.input;let extra='';
    if(inp.t==='choice')extra=`<ol class="wsc" type="A">${inp.opts.map(o=>`<li>${o}</li>`).join('')}</ol>`;
    else if(inp.t==='rows')extra=`<ul class="wsc">${inp.rows.map(r=>`<li>${r.label} (${r.opts.join(' / ')})</li>`).join('')}</ul>`;
    else extra='<div class="wsl">Odpoveď: ______________________________</div>';
    return extra};
  document.getElementById('printarea').innerHTML=`<h2>Pracovný list: ${document.title}</h2><p class="muted">Meno: ______________________ &nbsp; Dátum: ____________</p>`+
    items.map((it,i)=>`<div class="wsq"><b>${i+1}.</b> <span class="kd">(${it.q.kind})</span><div class="prompt">${stripAnswerUi(it.q.prompt)}</div>${task(it)}</div>`).join('')+
    `<div class="pbreak"></div><h2>Riešenia</h2>`+items.map((it,i)=>`<div class="wsq"><b>${i+1}. ${it.q.kind}</b>${choiceList(it.q)}<div>${it.q.solution}</div></div>`).join('');
  document.body.classList.add('ws');
  const done=()=>{document.body.classList.remove('ws');window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);
  try{window.print()}catch(e){done()}}
function stripAnswerUi(h){return h}

/* ---------- ťahák ---------- */
function renderSheet(){
  const box=document.getElementById('xv-sheet');
  box.innerHTML=`<div class="xhead noprint"><b>Ťahák: najdôležitejšie z každej témy</b><button class="btn main" id="spr">Vytlačiť</button></div>
   <div class="sheetgrid">${TOPICS.map(t=>`<section><h4>${t.name}</h4>${t.theory}</section>`).join('')}</div>`;
  box.querySelector('#spr').onclick=()=>{try{window.print()}catch(e){}}}

/* ---------- kartičky ---------- */
let CD={topic:'all',q:null,flip:false,known:0,seen:0};
function newCard(){
  const pool=CD.topic==='all'?TOPICS:TOPICS.filter(t=>t.id===CD.topic);
  CD.q=null;CD.flip=false;
  for(let k=0;k<60&&!CD.q;k++){
    const t=xpick(pool);let q=null;try{q=xpick(t.gens)()}catch(e){q=null}
    if(q&&q.input&&q.input.t==='choice'){CD.q=q;CD.t=t}}
  drawCard()}
function renderCards(){
  const box=document.getElementById('xv-cards');
  box.innerHTML=`<div class="xcard"><h3>Kartičky</h3><p class="muted">Pojmy a pravidlá. Najprv si odpovedz v hlave, potom kartičku otoč.</p>
   <label class="fld">Téma<select id="cdt"><option value="all">Všetky témy</option>${TOPICS.map(t=>`<option value="${t.id}" ${CD.topic===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label>
   <div id="cdbox"></div><p class="muted" id="cdstat"></p></div>`;
  box.querySelector('#cdt').onchange=e=>{CD.topic=e.target.value;newCard()};
  newCard()}
function drawCard(){
  const b=document.getElementById('cdbox');if(!b)return;
  document.getElementById('cdstat').textContent=`Videl si ${CD.seen} kartičiek, vedel ${CD.known}.`;
  if(!CD.q){b.innerHTML='<p>Pre túto tému nie sú kartičky.</p>';return}
  const q=CD.q;
  b.innerHTML=CD.flip?`<div class="flash back"><div class="prompt">${q.prompt}</div><div class="ans"><b>Odpoveď:</b> ${q.input.opts[q.answer[0]]}</div><div class="sol">${q.solution}</div></div>
   <div class="actions"><button class="btn main" id="cdk">Vedel som</button><button class="btn" id="cdn">Nevedel som</button></div>`:
   `<div class="flash"><div class="prompt">${q.prompt}</div></div><div class="actions"><button class="btn main" id="cdf">Otočiť kartičku</button><button class="btn" id="cdx">Preskočiť</button></div>`;
  const g=id=>b.querySelector(id);
  if(CD.flip){g('#cdk').onclick=()=>{CD.seen++;CD.known++;newCard()};g('#cdn').onclick=()=>{CD.seen++;newCard()}}
  else{g('#cdf').onclick=()=>{CD.flip=true;drawCard()};g('#cdx').onclick=newCard}}
</script>
